name: Compilar Wrapper Completo Original (Pipetto Trick)
on:
  workflow_dispatch:

jobs:
  build-fat-wrapper:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Descargar Codigo Principal del Wrapper
        uses: actions/checkout@v4

      - name: 2. Configurar Entorno Java para Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Android SDK y NDK Oficial
        uses: android-actions/setup-android@v3

      - name: 4. Instalar Herramientas de Compilacion de Ubuntu
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build zstd tar glslang-tools pkg-config llvm clang libclang-dev cmake

      - name: 5. Instalar Dependencias Python de Mesa
        run: python3 -m pip install --break-system-packages mako packaging setuptools

      - name: 6. Sincronizar Entorno de Cabeceras e Inyecciones
        run: |
          chmod +x crear_cabeceras.sh
          ./crear_cabeceras.sh
          chmod +x crear_stubs.sh
          ./crear_stubs.sh

      - name: 7. Ejecutar Compilacion Unificada de Mesa (Todo Instalado)
        run: |
          chmod +x build_mesa.sh
          ./build_mesa.sh

      - name: 8. EL TRUCO DEL PESO REAL: Empaquetar libvulkan_wrapper.so en wrapper.tzst
        run: |
          mkdir -p wrapper_output
          find build64/ -name "libvulkan_wrapper.so" -exec cp -L {} wrapper_output/libvulkan_wrapper.so \;
          ls -lh wrapper_output/
          tar --dereference -I 'zstd -19' -cf wrapper.tzst -C wrapper_output libvulkan_wrapper.so

      - name: 9. Subir wrapper.tzst como Artefacto Universal para Winlator
        uses: actions/upload-artifact@v4
        with:
          name: bionic-vulkan-wrapper-universal
          path: wrapper.tzst
