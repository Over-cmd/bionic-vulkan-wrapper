name: Compilador Puro Leegao wrapper.tzst NDK Dual
on: workflow_dispatch
jobs:
  build-mali-pure:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Instalar Herramientas Base
        run: |
          sudo apt-get update && sudo apt-get install -y git zstd tar curl gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: 2. Descargar Código de Leegao Intacto (Checkout Oficial)
        uses: actions/checkout@v4
        with:
          repository: 'leegao/bionic-vulkan-wrapper'
          path: 'wrapper_src'
          fetch-depth: 1

      - name: 3. Setup Android SDK y NDK Oficial de Fábrica
        uses: android-actions/setup-android@v3

      - name: 4. Instalar Componentes del NDK Movil
        run: ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      - name: 5. Compilar el Wrapper Puro de Leegao con Clang del NDK (Bypass Total de Mesa)
        run: |
          cd wrapper_src
          
          # Ruta oficial de las herramientas de compilación del NDK
          TOOLCHAIN="${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin"
          SYSROOT="${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          
          echo "Compilando binario de 64 bits de Leegao Puro..."
          $TOOLCHAIN/aarch64-linux-android26-clang -O3 -shared -fPIC \
            --sysroot=$SYSROOT \
            -DHAVE_ANDROID_PLATFORM \
            -fvisibility=default \
            wrapper.c -o libvulkan_wrapper.so \
            -llog -landroid -ldl -Wl,--export-dynamic
            
          cd -

      - name: 6. Estructurar Contenedor Exacto para APK Steven-mxz
        run: |
          # Aplicamos tu corrección estricta de rutas: usr/lib y usr/share/vulkan/icd.d/
          mkdir -p /tmp/out/usr/lib /tmp/out/usr/share/vulkan/icd.d
          
          # Inyectamos el Fat Binary puro resultante
          cp -f wrapper_src/libvulkan_wrapper.so /tmp/out/usr/lib/libvulkan_wrapper.so
          
          # Creamos los puentes simbólicos directos en el entorno de librerías
          cd /tmp/out/usr/lib
          ln -s libvulkan_wrapper.so libvulkan.so || true
          ln -s libvulkan_wrapper.so libvulkan.mali.so || true
          ln -s libvulkan_wrapper.so vulkan.mali.so || true
          cd -

          # El manifiesto JSON apunta estrictamente a tu binario
          cat << 'EOF' > /tmp/out/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.1.149",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF

      - name: 7. Empaquetar Entorno Original en Formato wrapper.tzst
        run: |
          cd /tmp/out
          tar -cf - usr | zstd -19 > /tmp/wrapper.tzst
          cd -

      - name: 8. Subir Artefacto Terminado a tus Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Leegao-Wrapper-Puro-Unisoc
          path: /tmp/wrapper.tzst
