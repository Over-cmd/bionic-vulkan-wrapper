name: Compilar Wrapper Completo Original (Pipetto Trick)
on:
  workflow_dispatch:

jobs:
  build-fat-wrapper:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Descargar Codigo Principal (Todo Integrado de leegao)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Configurar Entorno Java para Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Android SDK y NDK Oficial
        uses: android-actions/setup-android@v3

      - name: 4. Instalar Herramientas de Compilacion de Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build zstd tar glslang-tools pkg-config llvm

      - name: 5. Instalar Dependencias Python de Mesa
        run: python3 -m pip install --break-system-packages mako packaging setuptools

      - name: 6. Crear Descriptors de Control y Librerías Estáticas Físicas (Truco Pipetto)
        run: |
          mkdir -p local_pkgconfig
          mkdir -p local_libs
          
          # Descriptor virtual para pasar el filtro de libdrm sin alterar el codigo base
          printf "Name: libdrm\nDescription: Android libdrm Stub\nVersion: 2.4.120\nLibs:\nCflags:\n" > local_pkgconfig/libdrm.pc

          # EL TRUCO DEFINITIVO PARA SPIRV-Tools-opt:
          # Creamos archivos estáticos .a reales pero vacíos usando la herramienta 'ar' de Linux.
          # Esto engaña al comando "cc.find_library" de Meson de forma física sin alterar el código fuente.
          echo "void stub() {}" > stub.c
          gcc -c stub.c -o stub.o
          ar rcs local_libs/libSPIRV-Tools-opt.a stub.o
          cp local_libs/libSPIRV-Tools-opt.a local_libs/libSPIRV-Tools-link.a
          cp local_libs/libSPIRV-Tools-opt.a local_libs/libSPIRV-Tools.a
          rm -f stub.c stub.o

      - name: 7. Ejecutar Compilacion Unificada Multilib
        run: |
          NDK_PATH="$ANDROID_NDK_LATEST_HOME"
          BASE_PWD="$PWD"
          
          # Redirigimos pkg-config a nuestro mapa local de control
          export PKG_CONFIG_PATH="$BASE_PWD/local_pkgconfig"
          export PKG_CONFIG_LIBDIR="$BASE_PWD/local_pkgconfig"

          # Forzamos la ruta de búsqueda de las librerías a nivel de variables de entorno de Clang
          export LIBRARY_PATH="$BASE_PWD/local_libs"

          # =========================================================================
          # ETAPA 1: COMPILACIÓN DEL WRAPPER EN 32 BITS (ÁRBOL INTEGRAL)
          # =========================================================================
          # Pasamos la ruta de nuestras librerías físicas inyectadas directamente en los link_args del archivo cross
          printf "[binaries]\nc = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi25-clang'\ncpp = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi25-clang++'\nar = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'\nstrip = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'\npkg-config = 'pkg-config'\nllvm-config = '/usr/bin/llvm-config'\n[built-in options]\nc_link_args = ['-L%s/local_libs']\ncpp_link_args = ['-L%s/local_libs']\n[host_machine]\nsystem = 'android'\ncpu_family = 'arm'\ncpu = 'armv7-a'\nendian = 'little'\n" "$NDK_PATH" "$NDK_PATH" "$NDK_PATH" "$NDK_PATH" "$BASE_PWD" "$BASE_PWD" > arm32_cross.txt
          
          export LDFLAGS="-L$BASE_PWD/local_libs -L$NDK_PATH/sources/third_party/shaderc/libs/cxx/android_armeabi-v7a"
          export CXXFLAGS="-I$NDK_PATH/sources/third_party/shaderc/third_party/spirv-tools/include"
          
          meson setup build32 --cross-file arm32_cross.txt --buildtype=release \
            -Dplatforms=android -Dplatform-sdk-version=25 -Dgallium-drivers= \
            -Dintel-rt=disabled -Dmicrosoft-clc=disabled -Dintel-clc=auto \
            -Dvulkan-drivers=wrapper --wrap-mode=nodownload
          ninja -C build32
          
          # =========================================================================
          # ETAPA 2: COMPILACIÓN EN 64 BITS + UNIFICACIÓN MONOLÍTICA
          # =========================================================================
          printf "[binaries]\nc = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android25-clang'\ncpp = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android25-clang++'\nar = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'\nstrip = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'\npkg-config = 'pkg-config'\nllvm-config = '/usr/bin/llvm-config'\n[built-in options]\nc_link_args = ['-L%s/local_libs']\ncpp_link_args = ['-L%s/local_libs']\n[host_machine]\nsystem = 'android'\ncpu_family = 'aarch64'\ncpu = 'armv8-a'\nendian = 'little'\n" "$NDK_PATH" "$NDK_PATH" "$NDK_PATH" "$NDK_PATH" "$BASE_PWD" "$BASE_PWD" > arm64_cross.txt
          
          # Fusion hibrida de Pipetto-crypto inyectando las tablas de reubicacion con --just-symbols
          SO_32_PATH="$BASE_PWD/build32/src/vulkan/wrapper/libvulkan_wrapper.so"
          export LDFLAGS="-L$BASE_PWD/local_libs -L$NDK_PATH/sources/third_party/shaderc/libs/cxx/android_arm64-v8a -Wl,-q -Wl,--eh-frame-hdr -Wl,--just-symbols=$SO_32_PATH"
          export CXXFLAGS="-I$NDK_PATH/sources/third_party/shaderc/third_party/spirv-tools/include"
          
          meson setup build64 --cross-file arm64_cross.txt --buildtype=release \
            -Dplatforms=android -Dplatform-sdk-version=25 -Dgallium-drivers= \
            -Dintel-rt=disabled -Dmicrosoft-clc=disabled -Dintel-clc=auto \
            -Dvulkan-drivers=wrapper --wrap-mode=nodownload
          ninja -C build64

      - name: 8. Empaquetar el UNICO libvulkan_wrapper.so Universal en wrapper.tzst
        run: |
          mkdir -p wrapper_output
          cp build64/src/vulkan/wrapper/libvulkan_wrapper.so wrapper_output/libvulkan_wrapper.so
          ls -la wrapper_output/
          tar -I 'zstd -19' -cf wrapper.tzst -C wrapper_output libvulkan_wrapper.so

      - name: 9. Subir wrapper.tzst como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: bionic-vulkan-wrapper-universal
          path: wrapper.tzst
