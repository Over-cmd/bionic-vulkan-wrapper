name: Compilar Wrapper Completo Multilib (Pipetto Trick)
on:
  workflow_dispatch:

jobs:
  build-universal-wrapper:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout del código principal (Mesa / Wrapper completo)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Descargar SPIRV-Tools e Headers (Integración monolítica)
        uses: actions/checkout@v4
        with:
          repository: 'KhronosGroup/SPIRV-Tools'
          ref: '80627fe'
          path: 'SPIRV-Tools'

      - name: Descargar SPIRV-Headers para el compilador
        uses: actions/checkout@v4
        with:
          repository: 'KhronosGroup/SPIRV-Headers'
          path: 'SPIRV-Tools/external/spirv-headers'

      - name: Configurar Entorno Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Android NDK oficial
        uses: android-actions/setup-android@v3

      - name: Instalar Herramientas de Compilación Cruzada
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build zstd tar glslang-tools pkg-config cmake

      - name: Instalar Mako y Dependencias de Python de Mesa
        run: |
          python3 -m pip install --break-system-packages mako packaging setuptools

      - name: Crear Descriptors Virtuales (Stubs para pasar validación de libdrm y cutils)
        run: |
          mkdir -p stub_libs/pkgconfig
          cat <<EOF > stub_libs/pkgconfig/libdrm.pc
          Name: libdrm
          Description: Android NDK libdrm stub
          Version: 2.4.120
          Libs:
          Cflags:
          EOF
          cp stub_libs/pkgconfig/libdrm.pc stub_libs/pkgconfig/cutils.pc
          cp stub_libs/pkgconfig/libdrm.pc stub_libs/pkgconfig/hardware.pc
          cp stub_libs/pkgconfig/libdrm.pc stub_libs/pkgconfig/sync.pc

      - name: PRE-COMPILAR SPIRV-TOOLS MULTILIB
        run: |
          NDK_PATH=$ANDROID_NDK_LATEST_HOME
          mkdir -p SPIRV-Tools/build_universal
          cd SPIRV-Tools/build_universal
          cmake .. -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-25 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPIRV_SKIP_TESTS=ON \
            -DSPIRV_WERROR=OFF
          ninja
          cd ../..

      - name: COMPILACIÓN DEL WRAPPER COMPLETO
        run: |
          NDK_PATH=$ANDROID_NDK_LATEST_HOME
          
          # Configuramos la cadena de herramientas cruzada apuntando al Clang del NDK
          cat <<EOF > arm64_biarch_cross.txt
          [binaries]
          c = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android25-clang'
          cpp = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android25-clang++'
          ar = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

          # EL TRUCO DE PIPETTO-CRYPTO:
          # Inyectamos variables globales para activar las tablas de símbolos híbridas de 32 y 64 bits (Multilib)
          # Las banderas --eh-frame-hdr y -q obligan al enlazador a retener secciones de reubicación ELF completas.
          # Esto permite que un único archivo mapee de forma cruzada llamadas biónicas de 32 bits bajo Box86.
          export PKG_CONFIG_PATH=$PWD/stub_libs/pkgconfig
          export LDFLAGS="-L$PWD/SPIRV-Tools/build_universal/source -L$PWD/SPIRV-Tools/build_universal/source/opt -Wl,-q -Wl,--eh-frame-hdr"
          export CXXFLAGS="-I$PWD/SPIRV-Tools/include -I$PWD/SPIRV-Tools/source"

          # Compilamos el árbol original completo sin deshabilitar opciones para que traiga todo
          meson setup build_universal \
            --cross-file arm64_biarch_cross.txt \
            --buildtype=release \
            -Dplatforms=android \
            -Dplatform-sdk-version=25 \
            -Dgallium-drivers= \
            -Dmicrosoft-clc=disabled \
            -Dintel-clc=system \
            -Dvulkan-drivers=wrapper

          ninja -C build_universal

      - name: Empaquetar el único libvulkan_wrapper.so en wrapper.tzst (Método Steven MXZ)
        run: |
          mkdir -p wrapper_output

          # Buscamos el archivo único generado por Meson con soporte de traducción integrado
          find build_universal/ -name "libvulkan_wrapper.so" -exec cp {} wrapper_output/ \;

          # Verificamos visualmente que el archivo esté listo en la raíz
          ls -la wrapper_output/

          # Empaquetamos el archivo sueltito directamente en la raíz del archivo .tzst (sin subcarpetas lib/ ni lib64/)
          tar -I 'zstd -19' -cf wrapper.tzst -C wrapper_output libvulkan_wrapper.so

      - name: Subir wrapper.tzst como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: bionic-vulkan-wrapper-universal
          path: wrapper.tzst
