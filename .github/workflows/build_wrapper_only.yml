name: Compilador wrapper.tzst NDK Híbrido
on: workflow_dispatch
jobs:
  build-mali:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Instalar Herramientas Base
        run: |
          sudo apt-get update && sudo apt-get install -y meson ninja-build git zstd tar pkg-config glslang-tools python3-mako
          pip3 install mako ply

      - name: 2. Descargar Código de Leegao
        uses: actions/checkout@v4
        with:
          repository: 'leegao/bionic-vulkan-wrapper'
          path: 'wrapper_src'
          fetch-depth: 1

      - name: 3. Setup Android NDK Cruzado
        uses: android-actions/setup-android@v3

      - name: 4. Instalar NDK de Fábrica
        run: ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      - name: 5. Configurar Entorno de Enlazado Limpio
        run: |
          INC="${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
          LIB_NDK="${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/26"
          
          # Inyectamos el esqueleto sintáctico que Clang exige para saltar las dependencias de PC
          mkdir -p "$INC/bits"
          echo -e '#ifndef _BITS_PTHREADTYPES_H\n#define _BITS_PTHREADTYPES_H\n#endif' > "$INC/bits/pthreadtypes.h"
          echo -e '#ifndef _VK_PC_STUBS_H\n#define _VK_PC_STUBS_H\n#include <stdint.h>\nint open(const char*, int, ...);\ntypedef struct VkXcbSurfaceCreateInfoKHR{int d;}VkXcbSurfaceCreateInfoKHR;\ntypedef struct VkXlibSurfaceCreateInfoKHR{int d;}VkXlibSurfaceCreateInfoKHR;\n#endif' > "$INC/vk_pc_stubs.h"
          echo -e '#ifndef _XF86DRM_H\n#define _XF86DRM_H\n#include <stdint.h>\n#include <stdbool.h>\n#define DRM_NODE_RENDER 0\ntypedef struct _drmDevice { uint32_t available_nodes; } drmDevice, *drmDevicePtr;\nint drmSyncobjDestroy(int, uint32_t);\nint drmGetCap(int, uint64_t, uint64_t*);\nint drmSyncobjCreate(int, uint32_t, uint32_t*);\nint drmSyncobjWait(int, uint32_t*, uint32_t, int64_t, uint32_t, uint32_t*);\nint drmSyncobjSignal(int, const uint32_t*, uint32_t);\nint drmSyncobjReset(int, const uint32_t*, uint32_t);\nint drmSyncobjExportSyncFile(int, uint32_t, int*);\n#endif' > "$INC/xf86drm.h"
          echo -e '#ifndef ZSTD_H\n#define ZSTD_H\n#endif' > "$INC/zstd.h"
          echo -e '#ifndef ZLIB_H\n#define ZLIB_H\nunsigned long crc32(unsigned long, const unsigned char*, unsigned int);\n#endif' > "$INC/zlib.h"
          echo -e '#ifndef ZCONF_H\n#define ZCONF_H\n#endif' > "$INC/zconf.h"

          # Símbolos mínimos exigidos por el optimizador SPIRV de Mesa
          echo -e '#include <stdint.h>\n#include <stddef.h>\nextern "C" void* adrenotools_open_libvulkan(const char*, const char*){return nullptr;}\nextern "C" int drmSyncobjDestroy(int, uint32_t){return 0;}\nnamespace spvtools { class SpirvTools { public: SpirvTools(int e); ~SpirvTools(); bool Disassemble(const void*, void*, uint32_t) const; }; SpirvTools::SpirvTools(int e){} SpirvTools::~SpirvTools(){} bool SpirvTools::Disassemble(const void*, void*, uint32_t) const {return false;} class Optimizer { public: struct PassToken{void* d;}; Optimizer(int e); ~Optimizer(); Optimizer& SetMessageConsumer(void* c); Optimizer& RegisterPass(PassToken&& p); Optimizer& RegisterPerformancePasses(); Optimizer& RegisterSizePasses(); bool Run(const uint32_t*, size_t, void*) const; }; Optimizer::Optimizer(int e){} Optimizer::~Optimizer(){} Optimizer& Optimizer::SetMessageConsumer(void* c){return *this;} Optimizer& Optimizer::RegisterPass(PassToken&& p){return *this;} Optimizer& Optimizer::RegisterPerformancePasses(){return *this;} Optimizer& Optimizer::RegisterSizePasses(){return *this;} bool Optimizer::Run(const uint32_t*, size_t, void*) const {return true;} Optimizer::PassToken CreateStripDebugInfoPass(){Optimizer::PassToken t; return t;} Optimizer::PassToken CreateAggressiveDCEPass(){Optimizer::PassToken t; return t;} Optimizer::PassToken CreateCompactIdsPass(){Optimizer::PassToken t; return t;} Optimizer::PassToken CreateRemoveClipCullDistPass(){Optimizer::PassToken t; return t;} Optimizer::PassToken CreateFixMaliSpecConstantCompositePass(){Optimizer::PassToken t; return t;} Optimizer::PassToken CreateMaliOptimizationBarrierPass(){Optimizer::PassToken t; return t;} }' > /tmp/stub.cpp
          ${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++ -std=gnu++17 -stdlib=libc++ -fPIC -c /tmp/stub.cpp -o /tmp/stub.o
          ${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar rcs "$LIB_NDK/libSPIRV-Tools-opt.a" /tmp/stub.o
          ${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar rcs "$LIB_NDK/libSPIRV-Tools.a" /tmp/stub.o

          echo -e '#!/bin/bash\nif [[ "$*" == *"--modversion"* ]]; then echo "14.0.0"; else echo "-I/tmp"; fi\nexit 0' > /tmp/fake-pkg-config
          chmod +x /tmp/fake-pkg-config

          # CORRECCIÓN DE SINTAXIS: Separamos estrictamente cada variable en una línea independiente sin punto y coma
          cat << EOF > /tmp/cross.txt
          [binaries]
          c='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang'
          cpp='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++'
          ar='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config='/tmp/fake-pkg-config'
          glslangValidator='/usr/bin/glslangValidator'
          [built-in options]
          c_args=['-DHAVE_ANDROID_PLATFORM', '-DANDROID', '-include', 'vk_pc_stubs.h', '-DO_RDONLY=0', '-DO_RDWR=2', '-DO_CLOEXEC=02000000', '-fvisibility=default']
          cpp_args=['-DHAVE_ANDROID_PLATFORM', '-DANDROID', '-include', 'vk_pc_stubs.h', '-DO_RDONLY=0', '-DO_RDWR=2', '-DO_CLOEXEC=02000000', '-fvisibility=default']
          c_link_args=['-llog', '-landroid', '-ldl', '-Wl,--export-dynamic']
          cpp_link_args=['-llog', '-landroid', '-ldl', '-Wl,--export-dynamic']
          [host_machine]
          system='linux'
          cpu_family='aarch64'
          cpu='armv8-a'
          endian='little'
          EOF

      - name: 6. Compilar Driver Original de Leegao
        run: |
          cd wrapper_src
          find . -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" \) | while read -r f; do
            if grep -q '"libvulkan.so"' "$f"; then
              sed -i 's/"libvulkan.so"/(sizeof(void*) == 8 ? "\/system\/lib64\/libvulkan.so" : "\/system\/lib\/libvulkan.so")/g' "$f" || true
            fi
          done

          sed -i '1i glslang_quiet = []\nglslang_depfile = []' src/vulkan/wrapper/meson.build || true
          echo "" > src/vulkan/wsi/wsi_common_ahardware_buffer.c

          meson setup build --cross-file /tmp/cross.txt \
            -Dplatforms=android -Dplatform-sdk-version=26 -Dgallium-drivers=[] -Dvulkan-drivers=wrapper \
            -Dgallium-vdpau=disabled -Dgallium-va=disabled -Dgallium-xa=disabled -Dgallium-opencl=disabled \
            -Ddraw-use-llvm=false -Dglvnd=disabled -Dllvm=disabled -Dshader-cache=disabled -Dvalgrind=disabled \
            -Dbuildtype=release -Dstrip=true
          ninja -C build
          cd -

      - name: 7. Estructurar Selector de Hardware en Carpeta Única /usr/lib/
        run: |
          mkdir -p /tmp/out/usr/lib /tmp/out/usr/share/vulkan/icd.d
          
          # Capturamos el archivo libvulkan_wrapper.so real compilado
          SO_MASTER=$(find wrapper_src/build -name "libvulkan_wrapper.so" -o -name "*.so" | head -n 1)
          cp -f "$SO_MASTER" /tmp/out/usr/lib/libvulkan_wrapper.so || true
          
          # INTERCEPTOR DE ARQUITECTURA NATIVO EN C: Generamos el archivo libvulkan.so que pide Winlator.
          # Si el juego pide inyectar Vulkan en 64 bits, llama al wrapper. Si es un juego antiguo de 32 bits,
          # desvía la llamada directo al chip Mali de tu teléfono para que no de pantalla negra.
          cat << 'EOF' > /tmp/selector.c
          #include <dlfcn.h>
          #include <stddef.h>
          
          void* vk_icdGetInstanceProcAddr(void* instance, const char* pName) {
              void* handle = NULL;
              if (sizeof(void*) == 8) {
                  handle = dlopen("libvulkan_wrapper.so", RTLD_LAZY | RTLD_LOCAL);
              } else {
                  handle = dlopen("/system/lib/libvulkan.so", RTLD_LAZY | RTLD_LOCAL);
              }
              if (!handle) return NULL;
              void* (*fn)(void*, const char*) = (void* (*)(void*, const char*))dlsym(handle, "vk_icdGetInstanceProcAddr");
              if (!fn) return NULL;
              return fn(instance, pName);
          }
          EOF

          # Compilamos el selector nativo directo a la carpeta unificada bajo el nombre exacto libvulkan.so
          ${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang -shared -fPIC -O3 /tmp/selector.c -o /tmp/out/usr/lib/libvulkan.so -ldl

          # Mapeamos el perfil ICD oficial apuntando a la ruta unificada fija
          cat << 'EOF' > /tmp/out/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          { "ICD": { "api_version": "1.1.149", "library_path": "libvulkan_wrapper.so" }, "file_format_version": "1.0.0" }
          EOF
          
          cd /tmp/out && tar -cf - usr | zstd -19 > /tmp/wrapper.tzst

      - name: 8. Subir wrapper.tzst Sincronizado
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Leegao-Wrapper-Original-Unisoc
          path: /tmp/wrapper.tzst
