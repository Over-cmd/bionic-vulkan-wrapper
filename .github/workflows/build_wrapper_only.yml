name: Compilador wrapper.tzst NDK Dual
on: workflow_dispatch
jobs:
  build-mali:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Instalar Herramientas Base
        run: |
          sudo apt-get update && sudo apt-get install -y meson ninja-build git zstd tar python3-mako
          pip3 install mako ply

      - name: 2. Descargar Código de Leegao
        uses: actions/checkout@v4
        with:
          repository: 'leegao/bionic-vulkan-wrapper'
          path: 'wrapper_src'
          fetch-depth: 1

      - name: 3. Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: 4. Instalar NDK de Fábrica
        run: ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      - name: 5. Crear Configuración Cruzada ARM64 con Bypass de Dependencias
        run: |
          # El bloque properties inyecta un enlace virtual hacia la libreria m nativa para saltear el bloqueo de libdrm sin pkg-config
          cat << EOF > /tmp/cross.txt
          [binaries]
          c='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang'
          cpp='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++'
          ar='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          [properties]
          libdrm_libs=['-lm']
          libzstd_libs=['-lm']
          [built-in options]
          c_args=['-DHAVE_ANDROID_PLATFORM', '-DANDROID', '-fvisibility=default']
          cpp_args=['-DHAVE_ANDROID_PLATFORM', '-DANDROID', '-fvisibility=default']
          c_link_args=['-llog', '-landroid', '-ldl', '-Wl,--export-dynamic']
          cpp_link_args=['-llog', '-landroid', '-ldl', '-Wl,--export-dynamic']
          [host_machine]
          system='android'
          cpu_family='aarch64'
          cpu='armv8-a'
          endian='little'
          EOF

      - name: 6. Compilar Puente Gráfico Dual para DXVK
        run: |
          cd wrapper_src
          
          # Enrutamiento automático hacia las carpetas físicas de tu Unisoc T618 (/system/lib y lib64)
          find . -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" \) | while read -r f; do
            if grep -q '"libvulkan.so"' "$f"; then
              sed -i 's/"libvulkan.so"/(sizeof(void*) == 8 ? "\/system\/lib64\/libvulkan.so" : "\/system\/lib\/libvulkan.so")/g' "$f" || true
            fi
          done

          # Aislamos el módulo del Wrapper original desactivando libdrm mediante la propiedad cruzada del Paso 5
          meson setup build --cross-file /tmp/cross.txt \
            -Dplatforms=android \
            -Dplatform-sdk-version=26 \
            -Dgallium-drivers=[] \
            -Dvulkan-drivers=wrapper \
            -Dgallium-vdpau=disabled \
            -Dgallium-va=disabled \
            -Dgallium-xa=disabled \
            -Dgallium-opencl=disabled \
            -Ddraw-use-llvm=false \
            -Dglvnd=disabled \
            -Dllvm=disabled \
            -Dshader-cache=disabled \
            -Dvalgrind=disabled \
            -Dbuildtype=release \
            -Dstrip=true
          ninja -C build
          cd -

      - name: 7. Estructurar para Winlator Steven-mxz
        run: |
          mkdir -p /tmp/out/usr/lib /tmp/out/usr/share/vulkan/icd.d
          
          # Buscamos el binario final generado 'libvulkan_wrapper.so' que busca tu APK
          SO_MASTER=$(find wrapper_src/build -name "libvulkan_wrapper.so" -o -name "*.so" | head -n 1)
          cp -f "$SO_MASTER" /tmp/out/usr/lib/libvulkan_wrapper.so || true
          
          # Enlaces simbólicos de respaldo para DXVK de 32 y 64 bits
          cd /tmp/out/usr/lib
          ln -s libvulkan_wrapper.so libvulkan.so || true
          ln -s libvulkan_wrapper.so libvulkan.mali.so || true
          ln -s libvulkan_wrapper.so vulkan.mali.so || true
          cd -

          cat << 'EOF' > /tmp/out/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.1.149",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF
          
          cd /tmp/out && tar -cf - usr | zstd -19 > /tmp/wrapper.tzst

      - name: 8. Subir wrapper.tzst Listo
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Leegao-Wrapper-Original-Unisoc
          path: /tmp/wrapper.tzst
