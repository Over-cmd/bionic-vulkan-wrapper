name: Compilador wrapper.tzst NDK Híbrido Oficial Real
on: workflow_dispatch
jobs:
  build-mali:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Instalar Herramientas Base
        run: |
          sudo apt-get update && sudo apt-get install -y meson ninja-build git zstd tar pkg-config glslang-tools python3-mako cmake g++ curl
          pip3 install mako ply

      - name: 2. Checkout de tu Repositorio (Carga el .sh)
        uses: actions/checkout@v4

      - name: 3. Descargar Código de Leegao Original
        uses: actions/checkout@v4
        with:
          repository: 'leegao/bionic-vulkan-wrapper'
          path: 'wrapper_src'
          fetch-depth: 1

      - name: 4. Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: 5. Instalar NDK de Fábrica
        run: ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      - name: 6. Ejecutar Instalación de Componentes Reales e Iniciar Compilación
        run: |
          # Purificamos los saltos de línea invisibles de Windows antes de la ejecución
          sed -i 's/\r$//' setup_stubs.sh || true
          chmod +x setup_stubs.sh
          ./setup_stubs.sh

          cd wrapper_src
          rm -rf build || true

          # Apuntamos los respaldos de cabeceras directamente al ecosistema real instalado
          echo -e '#ifndef LOCAL_ZSTD_H\n#define LOCAL_ZSTD_H\n#endif' > include/zstd.h
          echo -e '#ifndef LOCAL_ZLIB_H\n#define LOCAL_ZLIB_H\n#endif' > include/zlib.h
          echo -e '#include <libdrm/xf86drm.h>' > include/xf86drm.h

          # FUSIÓN FORZADA DE COMPILADORES DE SHADERS Y DRM REALES:
          # Usamos --whole-archive localizado dentro de la receta de construcción para obligar a Clang
          # a empaquetar de verdad todo el árbol físico de libdrm y SPIRV-Tools reales dentro de libvulkan_wrapper.so
          sed -i "s/link_with : \[/link_args : \['-Wl,--whole-archive', '-lSPIRV-Tools-opt', '-lSPIRV-Tools', '-ldrm', '-Wl,--no-whole-archive'\], link_with : \[/g" src/vulkan/wrapper/meson.build || true

          # Abrimos la visibilidad pública de la tabla de Khronos para el escaneo de Winlator
          find src/vulkan/wrapper/ -name "*.c" -o -name "*.h" -o -name "*.cpp" | while read -r archivo_c; do
            sed -i 's/vk_icdGetInstanceProcAddr/__attribute__((visibility("default"))) vk_icdGetInstanceProcAddr/g' "$archivo_c" || true
            sed -i 's/vk_icdNegotiateLoaderICDInterfaceVersion/__attribute__((visibility("default"))) vk_icdNegotiateLoaderICDInterfaceVersion/g' "$archivo_c" || true
          done

          # Desvío biónico transparente al Vulkan real de tu procesador Unisoc
          find . -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" \) | while read -r f; do
            sed -i 's/"libvulkan.so"/"\/system\/lib64\/libvulkan.so"/g' "$f" || true
            sed -i 's/"libvulkan.so.1"/"\/system\/lib64\/libvulkan.so"/g' "$f" || true
          done

          sed -i "s/gnu_symbol_visibility : 'hidden'/gnu_symbol_visibility : 'default'/g" meson.build || true
          sed -i 's/-fvisibility=hidden/-fvisibility=default/g' meson.build || true
          sed -i '1i glslang_quiet = []\nglslang_depfile = []' src/vulkan/wrapper/meson.build || true
          echo "" > src/vulkan/wsi/wsi_common_ahardware_buffer.c

          meson setup build --cross-file /tmp/cross.txt \
            -Dplatforms=android -Dplatform-sdk-version=26 -Dgallium-drivers=[] -Dvulkan-drivers=wrapper \
            -Dgallium-vdpau=disabled -Dgallium-va=disabled -Dgallium-xa=disabled -Dgallium-opencl=disabled \
            -Ddraw-use-llvm=false -Dglvnd=disabled -Dllvm=disabled -Dshader-cache=disabled -Dvalgrind=disabled \
            -Dbuildtype=release -Dstrip=false
          ninja -C build
          cd -

      - name: 7. Estructurar Carpeta Única /usr/lib e Imprimir Peso de Verificación
        run: |
          mkdir -p /tmp/out/usr/lib /tmp/out/usr/share/vulkan/icd.d
          SO_MASTER=$(find wrapper_src/build -name "libvulkan_wrapper.so" -o -name "*.so" | head -n 1)
          cp -f "$SO_MASTER" /tmp/out/usr/lib/libvulkan_wrapper.so || true
          
          chmod 755 /tmp/out/usr/lib/libvulkan_wrapper.so || true
          chmod +x /tmp/out/usr/lib/libvulkan_wrapper.so || true
          
          echo "===================================================="
          echo "EL PESO ACTUAL REAL DE TU DRIVER ES:"
          du -sh /tmp/out/usr/lib/libvulkan_wrapper.so
          echo "===================================================="

          cat << 'EOF' > /tmp/out/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          { "file_format_version": "1.0.0", "ICD": { "library_path": "libvulkan_wrapper.so", "api_version": "1.3.292" } }
          EOF
          
          cd /tmp/out && tar -p -cf - usr | zstd -19 > ${{ github.workspace }}/wrapper.tzst

      - name: 8. Subir wrapper.tzst Original Real, Pesado y Completo
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Leegao-Wrapper-Original-Unisoc
          path: ${{ github.workspace }}/wrapper.tzst
