name: Compilar Wrapper Completo Original (Pipetto Trick)
on:
  workflow_dispatch:

jobs:
  build-universal:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Descargar Código Principal (Mesa / Wrapper de leegao completo)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Descargar Fuentes Reales de SPIRV-Tools
        uses: actions/checkout@v4
        with:
          repository: 'KhronosGroup/SPIRV-Tools'
          ref: '80627fe'
          path: 'SPIRV-Tools'

      - name: 3. Descargar Fuentes Reales de SPIRV-Headers
        uses: actions/checkout@v4
        with:
          repository: 'KhronosGroup/SPIRV-Headers'
          path: 'SPIRV-Tools/external/spirv-headers'

      - name: 4. Configurar Java para Entorno Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. Instalar Android SDK y NDK Oficial (Sin virtualizar / Librerías Reales)
        uses: android-actions/setup-android@v3

      - name: 6. Instalar Herramientas del Sistema de Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build zstd tar glslang-tools pkg-config cmake

      - name: 7. Instalar dependencias de Python requeridas por Mesa
        run: |
          python3 -m pip install --break-system-packages mako packaging setuptools

      - name: 8. Pre-compilar SPIRV-Tools Real para ARM64 y ARM32
        run: |
          NDK_PATH=$ANDROID_NDK_LATEST_HOME
          
          # Compilamos SPIRV-Tools para 64 bits
          mkdir -p SPIRV-Tools/build_arm64 && cd SPIRV-Tools/build_arm64
          cmake .. -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-25 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPIRV_SKIP_TESTS=ON \
            -DSPIRV_WERROR=OFF
          ninja
          cd ../..

          # Compilamos SPIRV-Tools para 32 bits
          mkdir -p SPIRV-Tools/build_arm32 && cd SPIRV-Tools/build_arm32
          cmake .. -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-25 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPIRV_SKIP_TESTS=ON \
            -DSPIRV_WERROR=OFF
          ninja
          cd ../..

      - name: 9. COMPILACIÓN COMPLETA ORIGINAL DE LEEGAO (64 BITS)
        run: |
          NDK_PATH=$ANDROID_NDK_LATEST_HOME
          
          cat <<EOF > arm64_cross.txt
          [binaries]
          c = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android25-clang'
          cpp = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android25-clang++'
          ar = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

          export LDFLAGS="-L$PWD/SPIRV-Tools/build_arm64/source -L$PWD/SPIRV-Tools/build_arm64/source/opt"
          export CXXFLAGS="-I$PWD/SPIRV-Tools/include -I$PWD/SPIRV-Tools/source"

          meson setup build64 \
            --cross-file arm64_cross.txt \
            --buildtype=release \
            -Dplatforms=android \
            -Dplatform-sdk-version=25 \
            -Dvulkan-drivers=wrapper

          ninja -C build64

      - name: 10. COMPILACIÓN COMPLETA ORIGINAL DE LEEGAO (32 BITS)
        run: |
          NDK_PATH=$ANDROID_NDK_LATEST_HOME
          
          cat <<EOF > arm32_cross.txt
          [binaries]
          c = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi25-clang'
          cpp = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi25-clang++'
          ar = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'arm'
          cpu = 'armv7-a'
          endian = 'little'
          EOF

          export LDFLAGS="-L$PWD/SPIRV-Tools/build_arm32/source -L$PWD/SPIRV-Tools/build_arm32/source/opt"
          export CXXFLAGS="-I$PWD/SPIRV-Tools/include -I$PWD/SPIRV-Tools/source"

          meson setup build32 \
            --cross-file arm32_cross.txt \
            --buildtype=release \
            -Dplatforms=android \
            -Dplatform-sdk-version=25 \
            -Dvulkan-drivers=wrapper

          ninja -C build32

      - name: 11. El Truco de Pipetto (Empaquetar ambas arquitecturas juntas para Steven MXZ)
        run: |
          # Creamos una carpeta limpia de salida
          mkdir -p wrapper_output

          # Copiamos el archivo de 64 bits renombrándolo de forma interna o estructurándolo en la raíz 
          # para que Winlator discrimine la inyección dinámicamente tal y como lo hace Pipetto
          cp build64/src/vulkan/wrapper/libvulkan_wrapper.so wrapper_output/libvulkan_wrapper.so
          cp build32/src/vulkan/wrapper/libvulkan_wrapper.so wrapper_output/libvulkan_wrapper_32.so

          # Empaquetamos ambos archivos originales limpios en el .tzst final
          tar -I 'zstd -19' -cf wrapper.tzst -C wrapper_output .

      - name: 12. Subir wrapper.tzst como Artefacto (Corregido)
        uses: actions/upload-artifact@v4
        with:
          name: bionic-vulkan-wrapper-universal
          path: wrapper.tzst
