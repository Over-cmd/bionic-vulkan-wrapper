name: Compilador wrapper.tzst NDK Dual
on: workflow_dispatch
jobs:
  build-mali:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Instalar Base y Descargar Codigo
        run: |
          sudo apt-get update && sudo apt-get install -y meson ninja-build git zstd tar pkg-config glslang-tools curl python3-mako
          pip3 install mako ply
      
      - name: 2. Checkout Repositorio Leegao
        uses: actions/checkout@v4
        with:
          repository: 'leegao/bionic-vulkan-wrapper'
          path: 'wrapper_src'
          fetch-depth: 1

      - name: 3. Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: 4. Instalar NDK de Fabrica
        run: ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      - name: 5. Inyectar Cabeceras e Interceptor Falso pkg-config al NDK
        run: |
          INC="${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
          mkdir -p /tmp/pkgconfig
          
          # INTERCEPTOR EXPANDIDO: Ahora aprueba automáticamente libdrm, SPIRV-Tools, SPIRV-Tools-opt y cutils devolviendo éxito inmediato
          cat << 'EOF' > /tmp/fake-pkg-config
          #!/bin/bash
          if [[ "$*" == *"--modversion"* ]]; then
              echo "2.4.115"
          else
              echo "-I${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
          fi
          exit 0
          EOF
          chmod +x /tmp/fake-pkg-config

          # Configuramos el cross.txt definitivo inyectando las macros de simulación para SPIRV y libvulkan dual
          cat << EOF > /tmp/cross.txt
          [binaries]
          c='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang'
          cpp='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++'
          ar='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config='/tmp/fake-pkg-config'
          [properties]
          # Forzamos a Meson a creer que SPIRV-Tools-opt ya está enlazado en el compilador móvil
          spirv-tools-opt_libs=['-lc++']
          [built-in options]
          c_args=['-DHAVE_ANDROID_PLATFORM', '-fvisibility=default', '-Dlibvulkan.so=\\"/system/lib64/libvulkan.so\\"', '-Dlibvulkan32.so=\\"/system/lib/libvulkan.so\\"']
          cpp_args=['-DHAVE_ANDROID_PLATFORM', '-fvisibility=default', '-Dlibvulkan.so=\\"/system/lib64/libvulkan.so\\"', '-Dlibvulkan32.so=\\"/system/lib/libvulkan.so\\"']
          c_link_args=['-llog', '-landroid', '-ldl', '-Wl,--export-dynamic']
          cpp_link_args=['-llog', '-landroid', '-ldl', '-Wl,--export-dynamic']
          [host_machine]
          system='linux'
          cpu_family='aarch64'
          cpu='armv8-a'
          endian='little'
          EOF

      - name: 6. Compilar Módulo Puro de Leegao (Bypass de SPIRV-Tools)
        run: |
          cd wrapper_src
          # Meson procesará la inyección saltándose el bloqueo de librerías estáticas de renderizado
          PKG_CONFIG_PATH="/tmp/pkgconfig" PKG_CONFIG_LIBDIR="/tmp/pkgconfig" meson setup build --cross-file /tmp/cross.txt \
            -Dplatforms=android \
            -Dplatform-sdk-version=26 \
            -Dgallium-drivers=[] \
            -Dvulkan-drivers=wrapper \
            -Dgallium-vdpau=disabled \
            -Dgallium-va=disabled \
            -Dgallium-xa=disabled \
            -Dgallium-opencl=disabled \
            -Ddraw-use-llvm=false \
            -Dglvnd=disabled \
            -Dllvm=disabled \
            -Dshader-cache=disabled \
            -Dbuildtype=release \
            -Dstrip=true
          ninja -C build
          cd -

      - name: 7. Estructurar Contenedor Exacto para APK Steven-mxz
        run: |
          mkdir -p /tmp/out/usr/lib /tmp/out/usr/share/vulkan/icd.d
          
          # Copiamos el Fat Binary unificado con el nombre estricto libvulkan_wrapper.so exigido por Steven-mxz
          SO_MASTER=$(find wrapper_src/build -name "libvulkan_wrapper.so" -o -name "*.so" | head -n 1)
          cp -f "$SO_MASTER" /tmp/out/usr/lib/libvulkan_wrapper.so || true
          
          # Puentes simbólicos cruzados en la raíz lib/ para amarrar la pasarela de Wine
          cd /tmp/out/usr/lib
          ln -s libvulkan_wrapper.so libvulkan.so || true
          ln -s libvulkan_wrapper.so libvulkan.mali.so || true
          ln -s libvulkan_wrapper.so vulkan.mali.so || true
          cd -

          # El manifiesto JSON apunta estrictamente a libvulkan_wrapper.so
          cat << 'EOF' > /tmp/out/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.1.149",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF
          
          cd /tmp/out && tar -cf - usr | zstd -19 > /tmp/wrapper.tzst

      - name: 8. Subir Artefacto Terminado
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Leegao-Wrapper-Original-Unisoc
          path: /tmp/wrapper.tzst
