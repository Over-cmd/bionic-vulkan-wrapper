name: Compilar Wrapper Completo Original (Pipetto Trick)
on:
  workflow_dispatch:

jobs:
  build-fat-wrapper:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Descargar Codigo Principal del Wrapper
        uses: actions/checkout@v4

      - name: 2. Descargar SPIRV-Tools Estable (Bypass de Red)
        uses: actions/checkout@v4
        with:
          repository: 'KhronosGroup/SPIRV-Tools'
          ref: 'main'
          path: 'spirv_source'

      - name: 3. Descargar SPIRV-Headers Estables
        uses: actions/checkout@v4
        with:
          repository: 'KhronosGroup/SPIRV-Headers'
          ref: 'main'
          path: 'spirv_source/external/spirv-headers'

      - name: 4. Configurar Entorno Java para Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. Instalar Android SDK y NDK Oficial
        uses: android-actions/setup-android@v3

      - name: 6. Instalar Herramientas de Compilacion de Ubuntu
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build zstd tar glslang-tools pkg-config llvm clang libclang-dev cmake

      - name: 7. Instalar Dependencias Python de Mesa
        run: python3 -m pip install --break-system-packages mako packaging setuptools

      - name: 8. Pre-compilar Dependencias Fisicas de SPIRV con Peso Real
        run: |
          mkdir -p spirv_source/build_32
          cd spirv_source/build_32
          cmake .. -G Ninja -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release -DSPIRV_SKIP_TESTS=ON -DSPIRV_WERROR=OFF
          ninja
          mkdir -p "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/26"
          cp source/opt/libSPIRV-Tools-opt.a "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/26/libSPIRV-Tools-opt.a"
          cp source/libSPIRV-Tools.a "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/26/libSPIRV-Tools.a"
          
          cd ../..
          mkdir -p spirv_source/build_64
          cd spirv_source/build_64
          cmake .. -G Ninja -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release -DSPIRV_SKIP_TESTS=ON -DSPIRV_WERROR=OFF
          ninja
          mkdir -p "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/26"
          cp source/opt/libSPIRV-Tools-opt.a "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/26/libSPIRV-Tools-opt.a"
          cp source/libSPIRV-Tools.a "$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/26/libSPIRV-Tools.a"
          cd ../..

      - name: 9. Generar Entorno de Cabeceras e Inyecciones
        run: |
          chmod +x crear_cabeceras.sh
          ./crear_cabeceras.sh
          chmod +x crear_stubs.sh
          ./crear_stubs.sh

      - name: 10. Ejecutar Compilacion Unificada de Mesa (Todo Instalado)
        run: |
          chmod +x build_mesa.sh
          ./build_mesa.sh

      - name: 11. EL TRUCO DEL PESO REAL: Empaquetar libvulkan_wrapper.so en formato plano sin saltos de linea
        run: [ "mkdir -p wrapper_output", "cp -L build64/src/vulkan/wrapper/libvulkan_wrapper.so wrapper_output/libvulkan_wrapper.so", "ls -lh wrapper_output/", "tar -cf wrapper.tar -C wrapper_output libvulkan_wrapper.so", "zstd -19 wrapper.tar -o wrapper.tzst" ]

      - name: 12. Subir wrapper.tzst como Artefacto Universal para Winlator
        uses: actions/upload-artifact@v4
        with:
          name: bionic-vulkan-wrapper-universal
          path: wrapper.tzst
