name: Compilador wrapper.tzst Mali Unificado
on: workflow_dispatch
jobs:
  build-mali-wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Instalar Herramientas y Descargar Codigo
        run: |
          sudo apt-get update && sudo apt-get install -y meson ninja-build git zstd tar pkg-config glslang-tools gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
          git clone --depth 1 https://github.com wrapper_src

      - name: 2. Crear Puentes Simulados de Android y DRM
        run: |
          mkdir -p /tmp/mock/include/{cutils,hardware,android,backtrace,log} /tmp/pkgconfig
          echo -e '#ifndef _M\n#define _M\n#endif' | tee /tmp/mock/include/cutils/properties.h /tmp/mock/include/hardware/hardware.h /tmp/mock/include/android/log.h /tmp/mock/include/backtrace/Backtrace.h /tmp/mock/include/drm.h > /dev/null
          
          cat << 'EOF' > /tmp/mock/include/xf86drm.h
          #ifndef _X\n#define _X\n#include <stdint.h>\nstruct drm_gem_close { uint32_t handle; uint32_t pad; };\n#define DRM_IOCTL_GEM_CLOSE 0\n#define DRM_PRIME_CAP_IMPORT 1\n#define DRM_PRIME_CAP_EXPORT 2\n#define DRM_NODE_RENDER 0\n#define DRM_NODE_PRIMARY 1\n#define _IOWR(t,n,s) 0\n#define _IOW(t,n,s) 0\ntypedef struct { uint32_t available_nodes; char **nodes; } drmDevice, *drmDevicePtr;\nstatic inline int drmIoctl(int f, unsigned long r, void *a) { return 0; }\nstatic inline int drmPrimeFDToHandle(int f, int p, uint32_t *h) { return 0; }\nstatic inline int drmGetDevice2(int f, uint32_t g, drmDevicePtr *d) { return -1; }\nstatic inline void drmFreeDevice(drmDevicePtr *d) {}\nstatic inline int drmDevicesEqual(drmDevicePtr a, drmDevicePtr b) { return 0; }\nstatic inline int drmGetDevices2(uint32_t f, drmDevicePtr d[], int m) { return 0; }\n#endif
          EOF
          
          cat << 'EOF' > /tmp/mock/include/log/log.h
          #ifndef _L\n#define _ANDROID_LOG_ERROR 6\n#define ANDROID_LOG_WARN 5\n#define ANDROID_LOG_INFO 4\n#define ANDROID_LOG_DEBUG 3\n#define LOG_PRI(p,t,...) do{}while(0)\n#endif
          EOF

          for pc in hardware log libglvnd libclc sync backtrace nativewindow cutils; do
            echo -e "Name: $pc\nDescription: M\nVersion: 1.0\nCflags: -I/tmp/mock/include\nLibs:" > /tmp/pkgconfig/$pc.pc
          done
          echo -e "Name: libdrm\nVersion: 2.4.110\nCflags: -I/tmp/mock/include\nLibs:" > /tmp/pkgconfig/libdrm.pc
          echo -e "Name: dl\nVersion: 1.0\nLibs: -ldl" > /tmp/pkgconfig/dl.pc
          echo -e "Name: zlib\nVersion: 1.3\nLibs:" > /tmp/pkgconfig/zlib.pc
          echo -e "Name: libzstd\nVersion: 1.5.5\nLibs:" > /tmp/pkgconfig/libzstd.pc

          cat << 'EOF' > /tmp/cross.txt
          [binaries]
          c='aarch64-linux-gnu-gcc'
          cpp='aarch64-linux-gnu-g++'
          ar='aarch64-linux-gnu-ar'
          strip='aarch64-linux-gnu-strip'
          pkgconfig='pkg-config'
          glslangValidator='/usr/bin/glslangValidator'
          [host_machine]
          system='linux'
          cpu_family='aarch64'
          cpu='armv8-a'
          endian='little'
          EOF

      - name: 3. Parchear Codigo y Compilar con Meson/Ninja
        env:
          PKG_CONFIG_PATH: "/tmp/pkgconfig"
        run: |
          cd wrapper_src
          find . -name "*meson.build" -o -name "*.build" -exec sed -i 's/-ferror-limit=1000/-fmax-errors=1000/g' {} \;
          find . -name "anon_file.c" -exec sed -i 's/syscall(SYS_memfd_create, debug_name, MFD_CLOEXEC | MFD_ALLOW_SEALING)/memfd_create(debug_name, MFD_CLOEXEC | MFD_ALLOW_SEALING)/g' {} \;
          find . -name "cnd_monotonic.c" -exec sed -i 's/pthread_cond_timedwait(&cond->cond, mtx, abs_time)/pthread_cond_timedwait(\&cond->cond, (pthread_mutex_t *)mtx, abs_time)/g' {} \;
          find . -name "cnd_monotonic.c" -exec sed -i 's/pthread_cond_wait(&cond->cond, mtx)/pthread_cond_wait(\&cond->cond, (pthread_mutex_t *)mtx)/g' {} \;
          find . -name "rand_xor.c" -exec sed -i 's/syscall(SYS_getrandom, seed, seed_size, GRND_NONBLOCK)/getrandom(seed, seed_size, GRND_NONBLOCK)/g' {} \;
          
          echo -e '#include <stdint.h>\n#include <stdio.h>\n#include "util/u_debug_stack.h"\nextern "C" {\nvoid debug_backtrace_capture(struct debug_stack_frame *f, unsigned s, unsigned c) {}\nvoid debug_backtrace_dump(const struct debug_stack_frame *f, unsigned c) {}\nvoid debug_backtrace_print(FILE *f, const struct debug_stack_frame *fr, unsigned c) {}\n}' > src/util/u_debug_stack_android.cpp
          sed -i '1s/^/#include <stdint.h>\n/' src/util/u_debug_stack.h
          echo -e '\nconst _EGLDriver _eglDriver = {0};' >> src/egl/main/eglapi.c

          find . -name "vk_android.c" -o -name "anativewindow.c" -o -name "zink_kopper.c" | while read -r f; do
            if [ -f "$f" ]; then
              sed -i 's/ANativeWindow_fromSurface/NULL \/\/ ANativeWindow_fromSurface/g' "$f"
              sed -i 's/ANativeWindow_acquire/NULL \/\/ ANativeWindow_acquire/g' "$f"
            fi
          done

          meson setup build --cross-file /tmp/cross.txt -Dplatforms=android -Dplatform-sdk-version=26 -Dgallium-drivers=zink -Dgallium-vdpau=disabled -Dgallium-va=disabled -Dgallium-xa=disabled -Dgallium-opencl=disabled -Ddraw-use-llvm=false -Dglvnd=false -Dllvm=disabled -Dshader-cache=disabled -Dvulkan-drivers=[] -Dbuildtype=release -Dstrip=true
          ninja -C build

      - name: 4. Estructurar usr/ y Crear wrapper.tzst
        run: |
          mkdir -p /tmp/out/usr/lib /tmp/out/usr/share/vulkan/icd.d
          cp -f $(find wrapper_src/build -name "libvulkan_wrapper.so" -o -name "*.so" | head -n 1) /tmp/out/usr/lib/libvulkan_wrapper.so || cp -f wrapper_src/build/src/vulkan/wrapper/libvulkan_wrapper.so /tmp/out/usr/lib/libvulkan_wrapper.so || true
          
          cat << 'EOF' > /tmp/out/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.1.149",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF
          
          cd /tmp/out && tar -cf - usr | zstd -19 > /tmp/wrapper.tzst

      - name: 5. Subir Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Leegao-Wrapper-Unisoc
          path: /tmp/wrapper.tzst
