name: Compilar Wrapper Completo Multilib
on:
  workflow_dispatch:

jobs:
  build-full-multilib:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configurar Entorno Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Android NDK oficial
        uses: android-actions/setup-android@v3

      - name: Instalar Herramientas del Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build zstd tar glslang-tools pkg-config

      - name: Instalar Mako y Dependencias de Python de Mesa
        run: |
          python3 -m pip install --break-system-packages mako packaging setuptools

      - name: COMPILACIÓN 64 BITS (ARM64) - TODO EL ÁRBOL DE MESA
        run: |
          NDK_PATH=$ANDROID_NDK_LATEST_HOME
          
          # Configuramos el cross-file apuntando al Clang de 64 bits con la API mínima aceptada (25)
          cat <<EOF > arm64_cross.txt
          [binaries]
          c = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android25-clang'
          cpp = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android25-clang++'
          ar = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

          # Ajustamos "-Dplatform-sdk-version=25" para cumplir la validación estricta de Mesa
          meson setup build64 \
            --cross-file arm64_cross.txt \
            --buildtype=release \
            -Dplatforms=android \
            -Dplatform-sdk-version=25 \
            -Dvulkan-drivers=wrapper

          ninja -C build64

      - name: COMPILACIÓN 32 BITS (ARM32) - TODO EL ÁRBOL DE MESA
        run: |
          NDK_PATH=$ANDROID_NDK_LATEST_HOME
          
          # Configuramos el cross-file de 32 bits apuntando al compilador armv7a con la API 25
          cat <<EOF > arm32_cross.txt
          [binaries]
          c = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi25-clang'
          cpp = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi25-clang++'
          ar = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'arm'
          cpu = 'armv7-a'
          endian = 'little'
          EOF

          meson setup build32 \
            --cross-file arm32_cross.txt \
            --buildtype=release \
            -Dplatforms=android \
            -Dplatform-sdk-version=25 \
            -Dvulkan-drivers=wrapper

          ninja -C build32

      - name: Estructurar y Empaquetar para Winlator
        run: |
          # Creamos la estructura limpia requerida para almacenar binarios de 32 y 64 bits
          mkdir -p wrapper_output/lib64
          mkdir -p wrapper_output/lib

          # Copiamos absolutamente todos los archivos .so resultantes de la compilación completa
          find build64/ -name "*.so" -exec cp {} wrapper_output/lib64/ \;
          find build32/ -name "*.so" -exec cp {} wrapper_output/lib/ \;

          # Empaquetamos el árbol resultante en el formato comprimido .tzst solicitado
          tar -I 'zstd -19' -cf wrapper.tzst -C wrapper_output .

      - name: Subir wrapper.tzst como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: bionic-vulkan-wrapper-multilib
          path: wrapper.tzst
