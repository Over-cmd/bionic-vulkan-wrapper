name: Compilar Wrapper Completo Original (Pipetto Trick)
on:
  workflow_dispatch:

jobs:
  build-universal:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Descargar Código Principal (Mesa / Wrapper de leegao completo)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Configurar Entorno Java para Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Android SDK y NDK Oficial (Herramientas y Librerías Reales)
        uses: android-actions/setup-android@v3

      - name: 4. Instalar Herramientas de Compilación de Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build zstd tar glslang-tools pkg-config

      - name: 5. Instalar Dependencias Python de Mesa
        run: |
          python3 -m pip install --break-system-packages mako packaging setuptools

      - name: 6. COMPILACIÓN COMPLETA ORIGINAL DE LEEGAO (64 BITS)
        run: |
          NDK_PATH=$ANDROID_NDK_LATEST_HOME
          
          cat <<EOF > arm64_cross.txt
          [binaries]
          c = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android25-clang'
          cpp = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android25-clang++'
          ar = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

          # Mapeamos las librerías nativas de SPIRV-Tools incluidas dentro del NDK r29
          export LDFLAGS="-L$NDK_PATH/sources/third_party/shaderc/libs/cxx/android_arm64-v8a"
          export CXXFLAGS="-I$NDK_PATH/sources/third_party/shaderc/third_party/spirv-tools/include"

          # El truco: Filtramos gallium-drivers para evitar libclc de PC, manteniendo el driver original wrapper al 100%
          meson setup build64 \
            --cross-file arm64_cross.txt \
            --buildtype=release \
            -Dplatforms=android \
            -Dplatform-sdk-version=25 \
            -Dgallium-drivers= \
            -Dvulkan-drivers=wrapper

          ninja -C build64

      - name: 7. COMPILACIÓN COMPLETA ORIGINAL DE LEEGAO (32 BITS)
        run: |
          NDK_PATH=$ANDROID_NDK_LATEST_HOME
          
          cat <<EOF > arm32_cross.txt
          [binaries]
          c = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi25-clang'
          cpp = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi25-clang++'
          ar = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'arm'
          cpu = 'armv7-a'
          endian = 'little'
          EOF

          export LDFLAGS="-L$NDK_PATH/sources/third_party/shaderc/libs/cxx/android_armeabi-v7a"
          export CXXFLAGS="-I$NDK_PATH/sources/third_party/shaderc/third_party/spirv-tools/include"

          meson setup build32 \
            --cross-file arm32_cross.txt \
            --buildtype=release \
            -Dplatforms=android \
            -Dplatform-sdk-version=25 \
            -Dgallium-drivers= \
            -Dvulkan-drivers=wrapper

          ninja -C build32

      - name: 8. El Truco de Pipetto (Empaquetar ambas arquitecturas juntas para Steven MXZ)
        run: |
          mkdir -p wrapper_output

          # Copiamos el archivo de 64 bits principal como 'libvulkan_wrapper.so'
          # Y sumamos el de 32 bits como 'libvulkan_wrapper_32.so' en la misma raíz de la inyección
          cp build64/src/vulkan/wrapper/libvulkan_wrapper.so wrapper_output/libvulkan_wrapper.so
          cp build32/src/vulkan/wrapper/libvulkan_wrapper.so wrapper_output/libvulkan_wrapper_32.so

          # Verificamos visualmente que el contenido esté correcto
          ls -la wrapper_output/

          # Empaquetamos todo directamente suelto en la raíz del archivo .tzst
          tar -I 'zstd -19' -cf wrapper.tzst -C wrapper_output .

      - name: 9. Subir wrapper.tzst como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: bionic-vulkan-wrapper-universal
          path: wrapper.tzst
