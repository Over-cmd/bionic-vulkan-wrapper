name: Compilar Wrapper Completo Original (Pipetto Trick)
on:
  workflow_dispatch:

jobs:
  build-fat-wrapper:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Descargar Codigo Principal (Todo Integrado de leegao)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Configurar Entorno Java para Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Android SDK y NDK Oficial
        uses: android-actions/setup-android@v3

      - name: 4. Instalar Herramientas de Compilacion de Ubuntu (Corregido)
        run: |
          sudo apt-get update
          # Eliminamos libspirv-printer-dev para evitar el error de APT de Ubuntu 24.04
          sudo apt-get install -y meson ninja-build zstd tar glslang-tools pkg-config

      - name: 5. Instalar Dependencias Python de Mesa
        run: python3 -m pip install --break-system-packages mako packaging setuptools

      - name: 6. Crear Descriptors de Control (El Truco de Inyeccion de Pipetto)
        run: |
          rm -rf subprojects/*.wrap
          mkdir -p local_pkgconfig
          
          # Generamos los descriptores virtuales para que Meson pase las validaciones al instante
          printf "Name: libdrm\nDescription: Android libdrm Stub\nVersion: 2.4.120\nLibs:\nCflags:\n" > local_pkgconfig/libdrm.pc
          printf "Name: SPIRV-Tools-opt\nDescription: SPIRV Optimization Stub\nVersion: 2024.1\nLibs:\nCflags:\n" > local_pkgconfig/SPIRV-Tools-opt.pc
          cp local_pkgconfig/SPIRV-Tools-opt.pc local_pkgconfig/SPIRV-Tools.pc

      - name: 7. Ejecutar Compilacion Unificada Multilib
        run: |
          NDK_PATH="$ANDROID_NDK_LATEST_HOME"
          BASE_PWD="$PWD"
          
          # Redirigimos pkg-config a nuestro mapa local de inyeccion de dependencias
          export PKG_CONFIG_PATH="$BASE_PWD/local_pkgconfig"
          export PKG_CONFIG_LIBDIR="$BASE_PWD/local_pkgconfig"

          # =========================================================================
          # ETAPA 1: COMPILACIÓN DEL WRAPPER EN 32 BITS (ÁRBOL INTEGRAL)
          # =========================================================================
          printf "[binaries]\nc = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi25-clang'\ncpp = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi25-clang++'\nar = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'\nstrip = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'\npkg-config = 'pkg-config'\n[host_machine]\nsystem = 'android'\ncpu_family = 'arm'\ncpu = 'armv7-a'\nendian = 'little'\n" "$NDK_PATH" "$NDK_PATH" "$NDK_PATH" "$NDK_PATH" > arm32_cross.txt
          
          meson setup build32 --cross-file arm32_cross.txt --buildtype=release \
            -Dplatforms=android -Dplatform-sdk-version=25 -Dgallium-drivers= \
            -Dintel-rt=disabled -Dmicrosoft-clc=disabled -Dintel-clc=auto \
            -Dvulkan-drivers=wrapper --wrap-mode=nodownload
          ninja -C build32
          
          # =========================================================================
          # ETAPA 2: COMPILACIÓN EN 64 BITS + UNIFICACIÓN MONOLÍTICA
          # =========================================================================
          printf "[binaries]\nc = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android25-clang'\ncpp = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android25-clang++'\nar = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'\nstrip = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'\npkg-config = 'pkg-config'\n[host_machine]\nsystem = 'android'\ncpu_family = 'aarch64'\ncpu = 'armv8-a'\nendian = 'little'\n" "$NDK_PATH" "$NDK_PATH" "$NDK_PATH" "$NDK_PATH" > arm64_cross.txt
          
          # Truco Fat Binary de Pipetto: Inyectamos el mapa logico del .so de 32 bits directo en el Linker de 64 bits
          SO_32_PATH="$BASE_PWD/build32/src/vulkan/wrapper/libvulkan_wrapper.so"
          export LDFLAGS="-Wl,-q -Wl,--eh-frame-hdr -Wl,--just-symbols=$SO_32_PATH"
          
          meson setup build64 --cross-file arm64_cross.txt --buildtype=release \
            -Dplatforms=android -Dplatform-sdk-version=25 -Dgallium-drivers= \
            -Dintel-rt=disabled -Dmicrosoft-clc=disabled -Dintel-clc=auto \
            -Dvulkan-drivers=wrapper --wrap-mode=nodownload
          ninja -C build64

      - name: 8. Empaquetar el UNICO libvulkan_wrapper.so Universal en wrapper.tzst
        run: |
          mkdir -p wrapper_output
          cp build64/src/vulkan/wrapper/libvulkan_wrapper.so wrapper_output/libvulkan_wrapper.so
          ls -la wrapper_output/
          tar -I 'zstd -19' -cf wrapper.tzst -C wrapper_output libvulkan_wrapper.so

      - name: 9. Subir wrapper.tzst como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: bionic-vulkan-wrapper-universal
          path: wrapper.tzst
