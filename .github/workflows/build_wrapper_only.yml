name: Compilar Wrapper Completo Original (Pipetto Trick)
on:
  workflow_dispatch:

jobs:
  build-fat-wrapper:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Descargar Codigo Principal (Todo Integrado de leegao)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Configurar Entorno Java para Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Android SDK y NDK Oficial
        uses: android-actions/setup-android@v3

      - name: 4. Instalar Herramientas de Compilacion de Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build zstd tar glslang-tools pkg-config llvm spirv-tools

      - name: 5. Instalar Dependencias Python de Mesa
        run: python3 -m pip install --break-system-packages mako packaging setuptools

      - name: 6. Crear Descriptors de Control (El Truco de Inyeccion de Pipetto)
        run: |
          NDK_PATH="$ANDROID_NDK_LATEST_HOME"
          mkdir -p local_pkgconfig
          
          # 1. Descriptor real apuntando a las cabeceras nativas integradas en el NDK de Google para libdrm
          printf "prefix=%s/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr\nlibdir=\${prefix}/lib\nincludedir=\${prefix}/include\n\nName: libdrm\nDescription: Userspace interface to kernel DRM services\nVersion: 2.4.120\nLibs:\nCflags: -I\${includedir}\n" "$NDK_PATH" > local_pkgconfig/libdrm.pc

          # 2. Descriptor virtual de libclc para que Meson no detenga el arbol completo
          printf "Name: libclc\nDescription: OpenCL C library stub for Android\nVersion: 0.2.0\nLibs:\nCflags:\n" > local_pkgconfig/libclc.pc

          # 3. Mapeamos los archivos .pc reales del sistema host de Ubuntu para SPIRV-Tools
          printf "Name: SPIRV-Tools\nDescription: SPIRV Tools\nVersion: 2024.1\nLibs: -lSPIRV-Tools\nCflags:\n" > local_pkgconfig/SPIRV-Tools.pc
          printf "Name: SPIRV-Tools-opt\nDescription: SPIRV Tools Opt\nVersion: 2024.1\nLibs: -lSPIRV-Tools-opt\nCflags:\n" > local_pkgconfig/SPIRV-Tools-opt.pc

          # 4. Inyectamos los metadatos reales de LLVMSPIRVLib
          printf "Name: LLVMSPIRVLib\nDescription: LLVM SPIR-V Translator Library\nVersion: 18.1.0\nLibs: -lLLVMSPIRVLib\nCflags:\n" > local_pkgconfig/LLVMSPIRVLib.pc

          # EL TRUCO DEFINITIVO PARA CLANG: Generamos stubs virtuales de pkgconfig para todos los modulos internos de Clang.
          # Esto burla de forma limpia el find_library de la linea 1922, haciendo que Meson apruebe la validacion al instante.
          for lib in clangBasic clangLex clangAST clangAnalysis clangSema clangEdit clangFrontend clangRewrite clangSerialization clangDriver clang-cpp; do
            printf "Name: %s\nDescription: Clang %s Stub\nVersion: 18.1.3\nLibs:\nCflags:\n" "$lib" "$lib" > "local_pkgconfig/$lib.pc"
          done

      - name: 7. Ejecutar Compilacion Unificada Multilib (Todo Instalado)
        run: |
          NDK_PATH="$ANDROID_NDK_LATEST_HOME"
          BASE_PWD="$PWD"
          
          # Forzamos a pkg-config a leer nuestro mapa de desvio de control local
          export PKG_CONFIG_PATH="$BASE_PWD/local_pkgconfig"
          export PKG_CONFIG_LIBDIR="$BASE_PWD/local_pkgconfig"

          # =========================================================================
          # ETAPA 1: COMPILACIÓN DEL WRAPPER EN 32 BITS (ÁRBOL ORIGINAL COMPLETO)
          # =========================================================================
          printf "[binaries]\nc = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi25-clang'\ncpp = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi25-clang++'\nar = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'\nstrip = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'\npkg-config = 'pkg-config'\nllvm-config = '/usr/bin/llvm-config'\n[host_machine]\nsystem = 'android'\ncpu_family = 'arm'\ncpu = 'armv7-a'\nendian = 'little'\n" "$NDK_PATH" "$NDK_PATH" "$NDK_PATH" "$NDK_PATH" > arm32_cross.txt
          
          export LDFLAGS="-L$NDK_PATH/sources/third_party/shaderc/libs/cxx/android_armeabi-v7a"
          export CXXFLAGS="-I$NDK_PATH/sources/third_party/shaderc/third_party/spirv-tools/include"
          
          # Todo instalado al completo sin desactivar opciones ni drivers de Mesa
          meson setup build32 --cross-file arm32_cross.txt --buildtype=release \
            -Dplatforms=android -Dplatform-sdk-version=25 -Dvulkan-drivers=wrapper \
            --wrap-mode=nodownload
          ninja -C build32
          
          # =========================================================================
          # ETAPA 2: COMPILACIÓN EN 64 BITS + TRUCO PIPETTO (FAT BINARY)
          # =========================================================================
          printf "[binaries]\nc = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android25-clang'\ncpp = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android25-clang++'\nar = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'\nstrip = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'\npkg-config = 'pkg-config'\nllvm-config = '/usr/bin/llvm-config'\n[host_machine]\nsystem = 'android'\ncpu_family = 'aarch64'\ncpu = 'armv8-a'\nendian = 'little'\n" "$NDK_PATH" "$NDK_PATH" "$NDK_PATH" "$NDK_PATH" > arm64_cross.txt
          
          # Inyectamos el truco Fat Binary unificando la tabla de simbolos de la Etapa 1
          SO_32_PATH="$BASE_PWD/build32/src/vulkan/wrapper/libvulkan_wrapper.so"
          export LDFLAGS="-L$NDK_PATH/sources/third_party/shaderc/libs/cxx/android_arm64-v8a -Wl,-q -Wl,--eh-frame-hdr -Wl,--just-symbols=$SO_32_PATH"
          export CXXFLAGS="-I$NDK_PATH/sources/third_party/shaderc/third_party/spirv-tools/include"
          
          meson setup build64 --cross-file arm64_cross.txt --buildtype=release \
            -Dplatforms=android -Dplatform-sdk-version=25 -Dvulkan-drivers=wrapper \
            --wrap-mode=nodownload
          ninja -C build64

      - name: 8. Empaquetar el UNICO libvulkan_wrapper.so Universal en wrapper.tzst
        run: |
          mkdir -p wrapper_output
          cp build64/src/vulkan/wrapper/libvulkan_wrapper.so wrapper_output/libvulkan_wrapper.so
          ls -la wrapper_output/
          tar -I 'zstd -19' -cf wrapper.tzst -C wrapper_output libvulkan_wrapper.so

      - name: 9. Subir wrapper.tzst como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: bionic-vulkan-wrapper-universal
          path: wrapper.tzst
