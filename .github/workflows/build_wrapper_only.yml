name: Compilar Wrapper Completo Original (Pipetto Trick)
on:
  workflow_dispatch:

jobs:
  build-fat-wrapper:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Descargar Codigo Principal (Mesa / Wrapper completo)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Configurar Entorno Java para Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Android SDK y NDK Oficial (Herramientas Reales)
        uses: android-actions/setup-android@v3

      - name: 4. Instalar Herramientas de Compilacion de Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build zstd tar glslang-tools pkg-config

      - name: 5. Instalar Dependencias Python de Mesa
        run: python3 -m pip install --break-system-packages mako packaging setuptools

      - name: 6. ETAPA 1: COMPILACION COMPLETA ORIGINAL DE 32 BITS
        run: |
          # Creamos un script auxiliar para aislar las comillas y evitar errores de YAML
          echo "NDK_PATH=\$ANDROID_NDK_LATEST_HOME" > run_build32.sh
          echo "echo '[binaries]' > arm32_cross.txt" >> run_build32.sh
          echo "echo \"c = '\$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi25-clang'\" >> arm32_cross.txt" >> run_build32.sh
          echo "echo \"cpp = '\$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi25-clang++'\" >> arm32_cross.txt" >> run_build32.sh
          echo "echo \"ar = '\$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'\" >> arm32_cross.txt" >> run_build32.sh
          echo "echo \"strip = '\$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'\" >> arm32_cross.txt" >> run_build32.sh
          echo "echo \"pkg-config = 'pkg-config'\" >> arm32_cross.txt" >> run_build32.sh
          echo "echo '[host_machine]' >> arm32_cross.txt" >> run_build32.sh
          echo "echo \"system = 'android'\" >> arm32_cross.txt" >> run_build32.sh
          echo "echo \"cpu_family = 'arm'\" >> arm32_cross.txt" >> run_build32.sh
          echo "echo \"cpu = 'armv7-a'\" >> arm32_cross.txt" >> run_build32.sh
          echo "echo \"endian = 'little'\" >> arm32_cross.txt" >> run_build32.sh
          echo "export LDFLAGS=\"-L\$NDK_PATH/sources/third_party/shaderc/libs/cxx/android_armeabi-v7a\"" >> run_build32.sh
          echo "export CXXFLAGS=\"-I\$NDK_PATH/sources/third_party/shaderc/third_party/spirv-tools/include\"" >> run_build32.sh
          echo "meson setup build32 --cross-file arm32_cross.txt --buildtype=release -Dplatforms=android -Dplatform-sdk-version=25 -Dgallium-drivers= -Dvulkan-drivers=wrapper" >> run_build32.sh
          echo "ninja -C build32" >> run_build32.sh
          
          # Ejecutamos el script de la Etapa 1
          bash run_build32.sh

      - name: 7. ETAPA 2: COMPILACION DE 64 BITS CON INYECCION DE SIMBOLOS (Truco Pipetto)
        run: |
          # Creamos el segundo script auxiliar para la Etapa 2
          echo "NDK_PATH=\$ANDROID_NDK_LATEST_HOME" > run_build64.sh
          echo "echo '[binaries]' > arm64_cross.txt" >> run_build64.sh
          echo "echo \"c = '\$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android25-clang'\" >> arm64_cross.txt" >> run_build64.sh
          echo "echo \"cpp = '\$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android25-clang++'\" >> arm64_cross.txt" >> run_build64.sh
          echo "echo \"ar = '\$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'\" >> arm64_cross.txt" >> run_build64.sh
          echo "echo \"strip = '\$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'\" >> arm64_cross.txt" >> run_build64.sh
          echo "echo \"pkg-config = 'pkg-config'\" >> arm64_cross.txt" >> run_build64.sh
          echo "echo '[host_machine]' >> arm64_cross.txt" >> run_build64.sh
          echo "echo \"system = 'android'\" >> arm64_cross.txt" >> run_build64.sh
          echo "echo \"cpu_family = 'aarch64'\" >> arm64_cross.txt" >> run_build64.sh
          echo "echo \"cpu = 'armv8-a'\" >> arm64_cross.txt" >> run_build64.sh
          echo "echo \"endian = 'little'\" >> arm64_cross.txt" >> run_build64.sh
          echo "SO_32_PATH=\"\$PWD/build32/src/vulkan/wrapper/libvulkan_wrapper.so\"" >> run_build64.sh
          echo "export LDFLAGS=\"-L\$NDK_PATH/sources/third_party/shaderc/libs/cxx/android_arm64-v8a -Wl,-q -Wl,--eh-frame-hdr -Wl,--just-symbols=\$SO_32_PATH\"" >> run_build64.sh
          echo "export CXXFLAGS=\"-I\$NDK_PATH/sources/third_party/shaderc/third_party/spirv-tools/include\"" >> run_build64.sh
          echo "meson setup build64 --cross-file arm64_cross.txt --buildtype=release -Dplatforms=android -Dplatform-sdk-version=25 -Dgallium-drivers= -Dvulkan-drivers=wrapper" >> run_build64.sh
          echo "ninja -C build64" >> run_build64.sh
          
          # Ejecutamos el script híbrido final de la Etapa 2
          bash run_build64.sh

      - name: 8. Empaquetar el UNICO libvulkan_wrapper.so Universal en wrapper.tzst
        run: |
          mkdir -p wrapper_output
          cp build64/src/vulkan/wrapper/libvulkan_wrapper.so wrapper_output/libvulkan_wrapper.so
          ls -la wrapper_output/
          tar -I 'zstd -19' -cf wrapper.tzst -C wrapper_output libvulkan_wrapper.so

      - name: 9. Subir wrapper.tzst como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: bionic-vulkan-wrapper-universal
          path: wrapper.tzst
