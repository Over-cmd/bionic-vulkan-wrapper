name: Compilar Wrapper Completo Original NDK25
on:
  workflow_dispatch:

jobs:
  build-wrapper:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Descargar Codigo Principal del Wrapper
        uses: actions/checkout@v4

      - name: 2. Descargar SPIRV-Tools Custom de leegao
        uses: actions/checkout@v4
        with:
          repository: 'leegao/SPIRV-Tools'
          path: 'spirv_source'

      - name: 3. Descargar SPIRV-Headers Estables de Khronos
        uses: actions/checkout@v4
        with:
          repository: 'KhronosGroup/SPIRV-Headers'
          ref: 'main'
          path: 'spirv_source/external/spirv-headers'

      - name: 4. Configurar Entorno Java para Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. Instalar Android SDK y NDK r25c Oficial
        uses: android-actions/setup-android@v3
        with:
          ndk-version: '25.2.9519653'

      - name: 6. Instalar Herramientas de Compilacion de Ubuntu
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build zstd tar glslang-tools pkg-config llvm clang libclang-dev cmake

      - name: 7. Instalar Dependencias Python de Mesa
        run: python3 -m pip install --break-system-packages mako packaging setuptools

      - name: 8. Pre-compilar Dependencias Fisicas de SPIRV
        run: |
          # LOCALIZACIÓN EXACTA: Buscamos físicamente dónde guardó GitHub el NDK 25 para evitar errores de ruta
          REAL_NDK=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -name "25.*" | head -n 1)
          if [ -z "$REAL_NDK" ]; then REAL_NDK="$ANDROID_SDK_ROOT/ndk/25.2.9519653"; fi
          
          export ANDROID_NDK_HOME="$REAL_NDK"
          export ANDROID_NDK_LATEST_HOME="$REAL_NDK"
          echo "Usando NDK 25 en la ruta física real: $REAL_NDK"
          
          # Inyectamos el operando de Khronos para evitar la colisión en table2.cpp del paso 33
          sed -i 's/SPV_OPERAND_TYPE_MEMORY_MODEL,/SPV_OPERAND_TYPE_MEMORY_MODEL,\n  SPV_OPERAND_TYPE_GATHER_MODES,/g' spirv_source/include/spirv-tools/libspirv.h
          
          mkdir -p spirv_source/build_64
          cd spirv_source/build_64
          cmake .. -G Ninja -DCMAKE_TOOLCHAIN_FILE="$REAL_NDK/build/cmake/android.toolchain.cmake" -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release -DSPIRV_SKIP_TESTS=ON -DSPIRV_WERROR=OFF
          ninja
          mkdir -p "$REAL_NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/26"
          cp source/opt/libSPIRV-Tools-opt.a "$REAL_NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/26/libSPIRV-Tools-opt.a"
          cp source/libSPIRV-Tools.a "$REAL_NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/26/libSPIRV-Tools.a"
          cd ../..

      - name: 9. Generar Entorno de Cabeceras
        run: |
          REAL_NDK=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -name "25.*" | head -n 1)
          if [ -z "$REAL_NDK" ]; then REAL_NDK="$ANDROID_SDK_ROOT/ndk/25.2.9519653"; fi
          export ANDROID_NDK_LATEST_HOME="$REAL_NDK"
          
          sed -i 's/\r$//' crear_cabeceras.sh || true
          sed -i 's/\r$//' crear_stubs.sh || true
          sed -i 's/\r$//' build_mesa.sh || true
          chmod +x crear_cabeceras.sh && ./crear_cabeceras.sh || true
          chmod +x crear_stubs.sh && ./crear_stubs.sh || true

      - name: 10. Ejecutar Compilacion Monolítico de Mesa
        run: |
          REAL_NDK=$(find /usr/local/lib/android/sdk/ndk -maxdepth 1 -name "25.*" | head -n 1)
          if [ -z "$REAL_NDK" ]; then REAL_NDK="$ANDROID_SDK_ROOT/ndk/25.2.9519653"; fi
          export ANDROID_NDK_LATEST_HOME="$REAL_NDK"
          
          chmod +x build_mesa.sh
          ./build_mesa.sh

      - name: 11. Subir wrapper.tzst como Artefacto para Winlator
        uses: actions/upload-artifact@v4
        with:
          name: bionic-vulkan-wrapper-universal
          path: wrapper.tzst
