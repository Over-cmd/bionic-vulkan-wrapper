name: Compilador Oficial wrapper.tzst Íntegro Dual (32/64 bits)
on:
  workflow_dispatch:

jobs:
  build-mali-wrapper-pure-ndk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Instalar Herramientas de Compilación Cruzada y Meson Base
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build python3-pip python3-setuptools git zstd tar pkg-config glslang-tools curl python3-mako
          pip3 install mako ply

      - name: 2. Descargar Código de Leegao Intacto (Checkout Oficial)
        uses: actions/checkout@v4
        with:
          repository: 'leegao/bionic-vulkan-wrapper'
          path: 'wrapper_src'
          fetch-depth: 1

      - name: 3. Configurar Android SDK y NDK Oficial de Fábrica
        uses: android-actions/setup-android@v3

      - name: 4. Instalar Componentes del NDK (Versión de Máxima Compatibilidad)
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      - name: 5. Escribir e Inyectar Cabeceras Reales al NDK (Bypass de Red Inmune)
        run: |
          SYSROOT_INC="${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
          mkdir -p "$SYSROOT_INC/libdrm"
          
          # Inyección local limpia de zlib.h y zconf.h mínimos
          echo -e '#ifndef ZLIB_H\n#define _ZLIB_H\n#define MESA_ZLIB\n#define ZEXTERN extern\n#define ZEXPORT\n#define ZEXPORTVA\ntypedef unsigned char Byte;\ntypedef unsigned int uInt;\ntypedef unsigned long uLong;\ntypedef void *voidpf;\n#endif' > "$SYSROOT_INC/zlib.h"
          echo -e '#ifndef ZCONF_H\n#define ZCONF_H\n#endif' > "$SYSROOT_INC/zconf.h"
          
          # Inyección local limpia de zstd.h mínimo
          echo -e '#ifndef ZSTD_H_ZSTD\n#define ZSTD_H_ZSTD\n#include <stddef.h>\ntypedef size_t ZSTD_ErrorCode;\nunsigned long long ZSTD_isError(size_t code) { return 0; }\nconst char* ZSTD_getErrorName(size_t code) { return ""; }\n#endif' > "$SYSROOT_INC/zstd.h"
          
          # Inyección local de la estructura DRM completa que exige Zink y EGL
          cat << 'EOF' > "$SYSROOT_INC/xf86drm.h"
          #ifndef _XF86DRM_H
          #define _XF86DRM_H
          #include <stdint.h>
          struct drm_gem_close { uint32_t handle; uint32_t pad; };
          #define DRM_IOCTL_GEM_CLOSE 0
          #define DRM_PRIME_CAP_IMPORT 0x1
          #define DRM_PRIME_CAP_EXPORT 0x2
          #define DRM_NODE_RENDER 0
          #define DRM_NODE_PRIMARY 1
          #ifndef _IOWR
          #define _IOWR(type,nr,size) 0
          #endif
          #ifndef _IOW
          #define _IOW(type,nr,size) 0
          #endif
          typedef struct _drmDevice {
              uint32_t available_nodes;
              char **nodes;
          } drmDevice, *drmDevicePtr;
          static inline int drmIoctl(int fd, unsigned long request, void *arg) { return 0; }
          static inline int drmPrimeFDToHandle(int fd, int prime_fd, uint32_t *handle) { return 0; }
          static inline int drmGetDevice2(int fd, uint32_t flags, drmDevicePtr *device) { return -1; }
          static inline void drmFreeDevice(drmDevicePtr *device) {}
          static inline int drmDevicesEqual(drmDevicePtr a, drmDevicePtr b) { return 0; }
          static inline int drmGetDevices2(uint32_t flags, drmDevicePtr devices[], int max_devices) { return 0; }
          #endif
          EOF
          
          echo -e '#ifndef _DRM_H\n#define _DRM_H\n#endif' > "$SYSROOT_INC/libdrm/drm.h"

      - name: 6. Crear Puentes de Validación Robustos para pkg-config
        run: |
          mkdir -p /tmp/pkgconfig
          SYSROOT_PATH="${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          
          # Puentes base vacíos para engañar a las dependencias de Android
          for pc in cutils hardware log sync backtrace nativewindow libglvnd libclc libdrm libzstd dl; do
            echo -e "Name: $pc\nDescription: NDK Bridge\nVersion: 1.0\nCflags:\nLibs:" > /tmp/pkgconfig/$pc.pc
          done

          # RECALIBRACIÓN ROBUSTA DE ZLIB.PC: Inyectamos valores reales de texto para evitar el error .strip() de Python
          cat << EOF > /tmp/pkgconfig/zlib.pc
          Name: zlib
          Description: Android NDK Fixed Zlib Bridge
          Version: 1.2.11
          Cflags: -I${SYSROOT_PATH}/usr/include
          Libs: -L${SYSROOT_PATH}/usr/lib -lz
          EOF

      - name: 7. Generar Archivo de Compilación Cruzada con Sysroot del NDK (ARM64)
        run: |
          cat << EOF > /tmp/cross_android_ndk64.txt
          [binaries]
          c = '${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang'
          cpp = '${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++'
          ar = '${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkgconfig = 'pkg-config'
          glslangValidator = '/usr/bin/glslangValidator'
          [properties]
          sys_root = '${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/sysroot'
          c_args = ['-I${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include']
          cpp_args = ['-I${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include']
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

      - name: 8. Compilar el Proyecto Original Completo usando el NDK
        env:
          PKG_CONFIG_PATH: "/tmp/pkgconfig"
        run: |
          cd wrapper_src
          rm -rf build_ndk
          
          # Seteamos -Dzlib=disabled de forma segura junto a -Dshader-cache=disabled para neutralizar la validación estricta
          meson setup build_ndk --cross-file /tmp/cross_android_ndk64.txt \
            -Dplatforms=android \
            -Dplatform-sdk-version=26 \
            -Dgallium-drivers=zink \
            -Dgallium-vdpau=disabled \
            -Dgallium-va=disabled \
            -Dgallium-xa=disabled \
            -Dgallium-opencl=disabled \
            -Ddraw-use-llvm=false \
            -Dglvnd=disabled \
            -Dllvm=disabled \
            -Dshader-cache=disabled \
            -Dzstd=disabled \
            -Dzlib=disabled \
            -Dvulkan-drivers=[] \
            -Dbuildtype=release \
            -Dstrip=true
            
          ninja -C build_ndk
          cd -

      - name: 9. Estructurar Contenedor en Rutas usr/lib y usr/share (Formato Steven-mxz)
        run: |
          mkdir -p /tmp/mali_wrapper/usr/lib
          mkdir -p /tmp/mali_wrapper/usr/share/vulkan/icd.d

          # Buscamos el binario final generado por el entorno dual
          SO_MASTER=$(find wrapper_src/build_ndk -name "libvulkan_wrapper.so" -o -name "*.so" | head -n 1)
          if [ ! -z "$SO_MASTER" ] && [ -f "$SO_MASTER" ]; then
            echo "Inyectando binario unificado con soporte dual intacto en usr/lib/..."
            cp -f "$SO_MASTER" /tmp/mali_wrapper/usr/lib/libvulkan_wrapper.so
          else
            cp -f wrapper_src/build_ndk/src/vulkan/wrapper/libvulkan_wrapper.so /tmp/mali_wrapper/usr/lib/libvulkan_wrapper.so || true
          fi

          # INYECCIÓN CON LA SINTAXIS DE PUNTO EXACTA SOLICITADA POR TI
          cat << 'EOF' > /tmp/mali_wrapper/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.1.149",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF

      - name: 10. Empaquetar Entorno Original en Formato wrapper.tzst
        run: |
          cd /tmp/mali_wrapper
          tar -cf - usr | zstd -19 > /tmp/wrapper.tzst
          cd -

      - name: 11. Subir wrapper.tzst Original Terminado a tus Artifacts de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Leegao-Wrapper-Original-Unisoc
          path: /tmp/wrapper.tzst
