name: Compilador wrapper.tzst NDK Híbrido Oficial Real
on: workflow_dispatch
jobs:
  build-mali:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Instalar Herramientas Base, Shaders y DRM Reales del Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build git zstd tar pkg-config glslang-tools python3-mako libdrm-dev spirv-tools
          pip3 install mako ply

      - name: 2. Checkout de tu Repositorio
        uses: actions/checkout@v4

      - name: 3. Descargar Código de Leegao Original
        uses: actions/checkout@v4
        with:
          repository: 'leegao/bionic-vulkan-wrapper'
          path: 'wrapper_src'
          fetch-depth: 1

      - name: 4. Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: 5. Instalar NDK de Fábrica
        run: ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      - name: 6. Sincronización de Componentes Reales y Compilación Dual Pesada
        run: |
          SYSROOT_MAESTRO="${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          LIB_64="${SYSROOT_MAESTRO}/usr/lib/aarch64-linux-android/26"
          LIB_32="${SYSROOT_MAESTRO}/usr/lib/arm-linux-androideabi/26"

          # Extrayendo librerías estáticas de SPIRV reales del sistema para inundar el NDK
          # Esto entrega los archivos legítimos .a que find_library exige en la línea 203
          sudo cp -f /usr/lib/x86_64-linux-gnu/libSPIRV-Tools-opt.a "$LIB_64/libSPIRV-Tools-opt.a" 2>/dev/null || true
          sudo cp -f /usr/lib/x86_64-linux-gnu/libSPIRV-Tools.a "$LIB_64/libSPIRV-Tools.a" 2>/dev/null || true
          sudo cp -f /usr/lib/x86_64-linux-gnu/libSPIRV-Tools-opt.a "$LIB_32/libSPIRV-Tools-opt.a" 2>/dev/null || true
          sudo cp -f /usr/lib/x86_64-linux-gnu/libSPIRV-Tools.a "$LIB_32/libSPIRV-Tools.a" 2>/dev/null || true
          
          # Copia masiva de seguridad en la raíz de búsqueda del compilador
          sudo cp -f /usr/lib/x86_64-linux-gnu/libSPIRV-Tools* "${SYSROOT_MAESTRO}/usr/lib/" 2>/dev/null || true

          # Interceptor real para pkg-config apuntando a las rutas oficiales instaladas
          sudo cat << 'EOF' > /usr/local/bin/fake-pkg-config
          #!/bin/bash
          if [[ "$*" == *"--modversion"* ]]; then echo "14.0.0"; else echo "-I/usr/include"; fi
          exit 0
          EOF
          sudo chmod +x /usr/local/bin/fake-pkg-config

          # ESCRITURA VERTICAL DEL ARCHIVO CRUZADO DE 64 BITS (cross_64.txt)
          cat << EOF > /tmp/cross_64.txt
          [binaries]
          c='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang'
          cpp='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++'
          ar='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config='/usr/local/bin/fake-pkg-config'
          glslangValidator='/usr/bin/glslangValidator'
          [properties]
          sys_root='${SYSROOT_MAESTRO}'
          [built-in options]
          c_args=['-DHAVE_ANDROID_PLATFORM', '-DANDROID', '-DVK_USE_PLATFORM_ANDROID_KHR', '-DVK_EXPORT', '-DO_RDONLY=0', '-DO_RDWR=2', '-DO_CLOEXEC=02000000', '-fvisibility=default']
          cpp_args=['-DHAVE_ANDROID_PLATFORM', '-DANDROID', '-DVK_USE_PLATFORM_ANDROID_KHR', '-DVK_EXPORT', '-DO_RDONLY=0', '-DO_RDWR=2', '-DO_CLOEXEC=02000000', '-fvisibility=default']
          c_link_args=['-llog', '-landroid', '-ldl', '-Wl,--export-dynamic', '-Wl,--no-as-needed', '-L${LIB_64}', '-L${SYSROOT_MAESTRO}/usr/lib']
          cpp_link_args=['-llog', '-landroid', '-ldl', '-Wl,--export-dynamic', '-Wl,--no-as-needed', '-L${LIB_64}', '-L${SYSROOT_MAESTRO}/usr/lib', '-stdlib=libc++']
          [host_machine]
          system='linux'
          cpu_family='aarch64'
          cpu='armv8-a'
          endian='little'
          EOF

          # ESCRITURA VERTICAL DEL ARCHIVO CRUZADO DE 32 BITS (cross_32.txt)
          cat << EOF > /tmp/cross_32.txt
          [binaries]
          c='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang'
          cpp='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi26-clang++'
          ar='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config='/usr/local/bin/fake-pkg-config'
          glslangValidator='/usr/bin/glslangValidator'
          [properties]
          sys_root='${SYSROOT_MAESTRO}'
          [built-in options]
          c_args=['-DHAVE_ANDROID_PLATFORM', '-DANDROID', '-DVK_USE_PLATFORM_ANDROID_KHR', '-DVK_EXPORT', '-DO_RDONLY=0', '-DO_RDWR=2', '-DO_CLOEXEC=02000000', '-fvisibility=default']
          cpp_args=['-DHAVE_ANDROID_PLATFORM', '-DANDROID', '-DVK_USE_PLATFORM_ANDROID_KHR', '-DVK_EXPORT', '-DO_RDONLY=0', '-DO_RDWR=2', '-DO_CLOEXEC=02000000', '-fvisibility=default']
          c_link_args=['-llog', '-landroid', '-ldl', '-Wl,--export-dynamic', '-Wl,--no-as-needed', '-L${LIB_32}', '-L${SYSROOT_MAESTRO}/usr/lib']
          cpp_link_args=['-llog', '-landroid', '-ldl', '-Wl,--export-dynamic', '-Wl,--no-as-needed', '-L${LIB_32}', '-L${SYSROOT_MAESTRO}/usr/lib', '-stdlib=libc++']
          [host_machine]
          system='linux'
          cpu_family='arm'
          cpu='armv7-a'
          endian='little'
          EOF

          cd wrapper_src
          rm -rf build || true

          # SEMBRADO DE HARDWARE REAL DE UBUNTU:
          mkdir -p include/libdrm
          cp -f /usr/include/xf86drm.h include/xf86drm.h
          cp -f /usr/include/libdrm/drm.h include/libdrm/drm.h
          cp -f /usr/include/xf86drm.h include/libdrm/xf86drm.h

          find src/vulkan/wrapper/ -name "*.c" -o -name "*.h" -o -name "*.cpp" | while read -r archivo_c; do
            sed -i 's/vk_icdGetInstanceProcAddr/__attribute__((visibility("default"))) vk_icdGetInstanceProcAddr/g' "$archivo_c" || true
            sed -i 's/vk_icdNegotiateLoaderICDInterfaceVersion/__attribute__((visibility("default"))) vk_icdNegotiateLoaderICDInterfaceVersion/g' "$archivo_c" || true
          done

          # PUENTE BIÓNICO MÓVIL DUAL INTERNO: Conmutación de rutas automática entre lib64 y lib
          find . -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" \) | while read -r f; do
            sed -i 's/"libvulkan.so"/(sizeof(void*) == 8 ? "\/system\/lib64\/libvulkan.so" : "\/system\/lib\/libvulkan.so")/g' "$f" || true
            sed -i 's/"libvulkan.so.1"/(sizeof(void*) == 8 ? "\/system\/lib64\/libvulkan.so" : "\/system\/lib\/libvulkan.so")/g' "$f" || true
          done

          sed -i "s/gnu_symbol_visibility : 'hidden'/gnu_symbol_visibility : 'default'/g" meson.build || true
          sed -i 's/-fvisibility=hidden/-fvisibility=default/g' meson.build || true
          sed -i '1i glslang_quiet = []\nglslang_depfile = []' src/vulkan/wrapper/meson.build || true
          echo "" > src/vulkan/wsi/wsi_common_ahardware_buffer.c

          # RECORRIDO 1: COMPILAMOS E INYECTAMOS EL DRIVER DE 64 BITS REAL PESADO
          rm -rf build || true
          meson setup build --cross-file /tmp/cross_64.txt \
            -Dplatforms=android -Dplatform-sdk-version=26 -Dgallium-drivers=[] -Dvulkan-drivers=wrapper \
            -Ddraw-use-llvm=false -Dglvnd=disabled -Dllvm=disabled -Dshader-cache=disabled -Dvalgrind=disabled \
            -Dbuildtype=debugoptimized -Dstrip=false
          ninja -C build
          mkdir -p /tmp/out/usr/lib
          cp -f $(find build -name "libvulkan_wrapper.so" -o -name "*.so" | head -n 1) /tmp/out/usr/lib/libvulkan_wrapper.so

          # RECORRIDO 2: COMPILAMOS E INYECTAMOS EL DRIVER DE 32 BITS REAL PESADO
          rm -rf build || true
          meson setup build --cross-file /tmp/cross_32.txt \
            -Dplatforms=android -Dplatform-sdk-version=26 -Dgallium-drivers=[] -Dvulkan-drivers=wrapper \
            -Ddraw-use-llvm=false -Dglvnd=disabled -Dllvm=disabled -Dshader-cache=disabled -Dvalgrind=disabled \
            -Dbuildtype=debugoptimized -Dstrip=false
          ninja -C build
          mkdir -p /tmp/out/usr/lib32
          cp -f $(find build -name "libvulkan_wrapper.so" -o -name "*.so" | head -n 1) /tmp/out/usr/lib32/libvulkan_wrapper.so
          cd -

      - name: 7. Estructurar Paquete Dual Híbrido de 20MB con Permisos Máster
        run: |
          mkdir -p /tmp/out/usr/share/vulkan/icd.d
          chmod 755 /tmp/out/usr/lib/libvulkan_wrapper.so /tmp/out/usr/lib32/libvulkan_wrapper.so || true
          chmod +x /tmp/out/usr/lib/libvulkan_wrapper.so /tmp/out/usr/lib32/libvulkan_wrapper.so || true
          
          echo "===================================================="
          echo "EL PESO ACTUAL REAL DE TU DRIVER DUAL ES:"
          du -sh /tmp/out/usr/lib/libvulkan_wrapper.so /tmp/out/usr/lib32/libvulkan_wrapper.so
          echo "===================================================="

          cat << 'EOF' > /tmp/out/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          { "file_format_version": "1.0.0", "ICD": { "library_path": "libvulkan_wrapper.so", "api_version": "1.3.292" } }
          EOF
          
          cd /tmp/out && tar -p -cf - usr | zstd -19 > ${{ github.workspace }}/wrapper.tzst

      - name: 8. Subir wrapper.tzst Dual Completo de 20MB
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Leegao-Wrapper-Original-Unisoc
          path: ${{ github.workspace }}/wrapper.tzst
