name: Compilador wrapper.tzst NDK Dual
on: workflow_dispatch
jobs:
  build-mali:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Instalar Base y Descargar Codigo
        run: |
          sudo apt-get update && sudo apt-get install -y meson ninja-build git zstd tar pkg-config glslang-tools curl python3-mako
          pip3 install mako ply
      
      - name: 2. Checkout Repositorio Leegao
        uses: actions/checkout@v4
        with:
          repository: 'leegao/bionic-vulkan-wrapper'
          path: 'wrapper_src'
          fetch-depth: 1

      - name: 3. Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: 4. Instalar NDK de Fabrica
        run: ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      - name: 5. Inyectar Cabeceras Físicas y Mocks de Validación al NDK
        run: |
          INC="${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
          LIB_NDK="${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/26"
          mkdir -p "$INC/bits" /tmp/pkgconfig
          
          echo -e '#ifndef _BITS_PTHREADTYPES_H\n#define _BITS_PTHREADTYPES_H\n#endif' > "$INC/bits/pthreadtypes.h"

          # PARCHE MAESTRO INTEGRADO: Creamos el archivo de inyección forzada directamente dentro de la ruta global de inclusión de Clang
          cat << 'EOF' > "$INC/android_wsi_keys.h"
          #ifndef _ANDROID_WSI_KEYS_H
          #define _ANDROID_WSI_KEYS_H
          #define ANDROID 1
          #define HAVE_ANDROID_PLATFORM 1
          #define VK_USE_PLATFORM_ANDROID_KHR 1
          #endif
          EOF

          # Mantenemos las firmas completas del bus DRM y sincronizacion requeridas
          cat << 'EOF' > "$INC/xf86drm.h"
          #ifndef _XF86DRM_H
          #define _XF86DRM_H
          #include <stdint.h>
          #include <stdbool.h>
          #define DRM_NODE_RENDER 0
          #define DRM_NODE_PRIMARY 1
          #define DRM_CAP_SYNCOBJ_TIMELINE 0x1
          typedef struct { uint16_t domain; uint8_t bus; uint8_t dev; uint8_t func; } drmPciBusInfo, *drmPciBusInfoPtr;
          typedef union { drmPciBusInfoPtr pci; void *foo; } drmBusInfo;
          typedef struct _drmDevice { uint32_t available_nodes; char **nodes; int bustype; drmBusInfo businfo; } drmDevice, *drmDevicePtr;
          enum { DRM_BUS_PCI = 0 };
          int drmIoctl(int fd, unsigned long request, void *arg);
          int drmGetCap(int fd, uint64_t capability, uint64_t *value);
          int drmPrimeFDToHandle(int fd, int prime_fd, uint32_t *handle);
          int drmSyncobjCreate(int fd, uint32_t flags, uint32_t *handle);
          int drmSyncobjDestroy(int fd, uint32_t handle);
          int drmSyncobjReset(int fd, const uint32_t *handles, uint32_t num_handles);
          int drmSyncobjSignal(int fd, const uint32_t *handles, uint32_t num_handles);
          int drmSyncobjWait(int fd, uint32_t *handles, uint32_t num_handles, int64_t timeout_nsec, uint32_t flags, uint32_t *first_signaled);
          int drmSyncobjExportSyncFile(int fd, uint32_t handle, int *map_fd);
          int drmSyncobjImportSyncFile(int fd, uint32_t handle, int map_fd);
          int drmSyncobjFDToHandle(int fd, int map_fd, uint32_t *handle);
          int drmSyncobjHandleToFD(int fd, uint32_t handle, int *map_fd);
          int drmSyncobjTimelineSignal(int fd, const uint32_t *handles, const uint64_t *points, uint32_t num_handles);
          int drmSyncobjTimelineWait(int fd, uint32_t *handles, uint64_t *points, uint32_t num_handles, int64_t timeout_nsec, uint32_t flags, uint32_t *first_signaled);
          int drmSyncobjQuery(int fd, const uint32_t *handles, uint64_t *points, uint32_t num_handles);
          int drmSyncobjTransfer(int fd, uint32_t dst_handle, uint64_t dst_point, uint32_t src_handle, uint64_t src_point, uint32_t flags);
          int drmGetDevice2(int fd, uint32_t flags, drmDevicePtr *device);
          void drmFreeDevice(drmDevicePtr *device);
          int drmGetDevices2(uint32_t flags, drmDevicePtr devices[], int max_devices);
          void drmFreeDevices(drmDevicePtr devices[], int count);
          bool drmDevicesEqual(drmDevicePtr a, drmDevicePtr b);
          #endif
          EOF

          cat << 'EOF' > "$INC/zstd.h"
          #ifndef ZSTD_H_ZSTD
          #define ZSTD_H_ZSTD
          #include <stddef.h>
          typedef size_t ZSTD_ErrorCode;
          static inline unsigned long long ZSTD_isError(size_t code) { return 0; }
          static inline const char* ZSTD_getErrorName(size_t code) { return ""; }
          size_t ZSTD_compressBound(size_t srcSize);
          size_t ZSTD_compress(void* dst, size_t dstCapacity, const void* src, size_t srcSize, int compressionLevel);
          size_t ZSTD_decompress(void* dst, size_t dstCapacity, const void* src, size_t srcSize);
          #endif
          EOF

          cat << 'EOF' > "$INC/zlib.h"
          #ifndef ZLIB_H
          #define ZLIB_H
          #include <sys/types.h>
          typedef unsigned char Byte;
          typedef unsigned int uInt;
          typedef unsigned long uLong;
          typedef void *voidpf;
          unsigned long crc32(unsigned long crc, const unsigned char *buf, unsigned int len);
          #endif
          EOF

          echo -e '#ifndef ZCONF_H\n#define ZCONF_H\n#endif' > "$INC/zconf.h"

          ar rcs "$LIB_NDK/libSPIRV-Tools-opt.a" /dev/null || true
          ar rcs "$LIB_NDK/libSPIRV-Tools.a" /dev/null || true

          cat << 'EOF' > /tmp/fake-pkg-config
          #!/bin/bash
          if [[ "$*" == *"--modversion"* ]]; then echo "2.4.115"; else echo "-I${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"; fi
          exit 0
          EOF
          chmod +x /tmp/fake-pkg-config

          # PASATOR INAPELABLE: Pasamos '-include', 'android_wsi_keys.h' con rutas nativas del sysroot
          # Esto obliga a Clang a inyectar las macros al vuelo al inicio de cada archivo procesado de forma automatica
          cat << EOF > /tmp/cross.txt
          [binaries]
          c='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang'
          cpp='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++'
          ar='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config='/tmp/fake-pkg-config'
          [built-in options]
          c_args=['-DHAVE_ANDROID_PLATFORM', '-DANDROID', '-DVK_USE_PLATFORM_ANDROID_KHR', '-include', 'android_wsi_keys.h', '-fvisibility=default']
          cpp_args=['-DHAVE_ANDROID_PLATFORM', '-DANDROID', '-DVK_USE_PLATFORM_ANDROID_KHR', '-include', 'android_wsi_keys.h', '-fvisibility=default']
          c_link_args=['-llog', '-landroid', '-ldl', '-lnativewindow', '-Wl,--export-dynamic']
          cpp_link_args=['-llog', '-landroid', '-ldl', '-lnativewindow', '-Wl,--export-dynamic']
          [host_machine]
          system='linux'
          cpu_family='aarch64'
          cpu='armv8-a'
          endian='little'
          EOF

      - name: 6. Compilar Codigo Completo con el NDK
        run: |
          cd wrapper_src
          
          find . -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" \) | while read -r f; do
            if grep -q '"libvulkan.so"' "$f"; then
              sed -i 's/"libvulkan.so"/(sizeof(void*) == 8 ? "\/system\/lib64\/libvulkan.so" : "\/system\/lib\/libvulkan.so")/g' "$f" || true
            fi
          done

          PKG_CONFIG_PATH="/tmp/pkgconfig" PKG_CONFIG_LIBDIR="/tmp/pkgconfig" meson setup build --cross-file /tmp/cross.txt \
            -Dplatforms=android \
            -Dplatform-sdk-version=26 \
            -Dgallium-drivers=[] \
            -Dvulkan-drivers=wrapper \
            -Dgallium-vdpau=disabled \
            -Dgallium-va=disabled \
            -Dgallium-xa=disabled \
            -Dgallium-opencl=disabled \
            -Ddraw-use-llvm=false \
            -Dglvnd=disabled \
            -Dllvm=disabled \
            -Dshader-cache=disabled \
            -Dvalgrind=disabled \
            -Dbuildtype=release \
            -Dstrip=true
          ninja -C build
          cd -

      - name: 7. Estructurar Contenedor Exacto para APK Steven-mxz
        run: |
          mkdir -p /tmp/out/usr/lib /tmp/out/usr/share/vulkan/icd.d
          
          SO_MASTER=$(find wrapper_src/build -name "libvulkan_wrapper.so" -o -name "*.so" | head -n 1)
          cp -f "$SO_MASTER" /tmp/out/usr/lib/libvulkan_wrapper.so || true
          
          cd /tmp/out/usr/lib
          ln -s libvulkan_wrapper.so libvulkan.so || true
          ln -s libvulkan_wrapper.so libvulkan.mali.so || true
          ln -s libvulkan_wrapper.so vulkan.mali.so || true
          cd -

          cat << 'EOF' > /tmp/out/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.1.149",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF
          
          cd /tmp/out && tar -cf - usr | zstd -19 > /tmp/wrapper.tzst

      - name: 8. Subir Artefacto Terminado
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Leegao-Wrapper-Original-Unisoc
          path: /tmp/wrapper.tzst
