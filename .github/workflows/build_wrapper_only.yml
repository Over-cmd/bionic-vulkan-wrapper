name: Compilar Wrapper Completo Multilib (Pipetto Trick)
on:
  workflow_dispatch:

jobs:
  build-full-multilib:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout del código principal (Mesa / Wrapper)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Descargar SPIRV-Tools de forma automática (Sin comandos Git)
        uses: actions/checkout@v4
        with:
          repository: 'KhronosGroup/SPIRV-Tools'
          ref: '80627fe' # El commit de compatibilidad estable de leegao
          path: 'SPIRV-Tools' # Lo guarda exactamente en la carpeta que necesita Meson

      - name: Descargar SPIRV-Headers (Obligatorio para SPIRV-Tools)
        uses: actions/checkout@v4
        with:
          repository: 'KhronosGroup/SPIRV-Headers'
          path: 'SPIRV-Tools/external/spirv-headers' # Ruta interna que requiere el compilador

      - name: Configurar Entorno Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Android NDK oficial
        uses: android-actions/setup-android@v3

      - name: Instalar Herramientas de Compilación Cruzada
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build zstd tar glslang-tools pkg-config cmake

      - name: Instalar Mako y Dependencias de Python de Mesa
        run: |
          python3 -m pip install --break-system-packages mako packaging setuptools

      - name: Crear Descriptors Virtuales (Stubs para pasar validación de libdrm)
        run: |
          mkdir -p stub_libs/pkgconfig
          cat <<EOF > stub_libs/pkgconfig/libdrm.pc
          Name: libdrm
          Description: Android NDK libdrm stub
          Version: 2.4.120
          Libs:
          Cflags:
          EOF

      - name: COMPILACIÓN 64 BITS (ARM64)
        run: |
          NDK_PATH=$ANDROID_NDK_LATEST_HOME
          
          # 1. Compilar primero SPIRV-Tools para ARM64
          mkdir -p SPIRV-Tools/build64
          cd SPIRV-Tools/build64
          cmake .. -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-25 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPIRV_SKIP_TESTS=ON \
            -DSPIRV_WERROR=OFF
          ninja
          cd ../..

          # 2. Configurar el cross-file para Mesa
          cat <<EOF > arm64_cross.txt
          [binaries]
          c = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android25-clang'
          cpp = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android25-clang++'
          ar = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

          export PKG_CONFIG_PATH=$PWD/stub_libs/pkgconfig
          export LDFLAGS="-L$PWD/SPIRV-Tools/build64/source -L$PWD/SPIRV-Tools/build64/source/opt"
          export CXXFLAGS="-I$PWD/SPIRV-Tools/include -I$PWD/SPIRV-Tools/source"

          meson setup build64 \
            --cross-file arm64_cross.txt \
            --buildtype=release \
            -Dplatforms=android \
            -Dplatform-sdk-version=25 \
            -Dgallium-drivers= \
            -Dmicrosoft-clc=disabled \
            -Dintel-clc=system \
            -Dvulkan-drivers=wrapper

          ninja -C build64

      - name: COMPILACIÓN 32 BITS (ARM32)
        run: |
          NDK_PATH=$ANDROID_NDK_LATEST_HOME
          
          # 1. Compilar primero SPIRV-Tools para ARM32
          mkdir -p SPIRV-Tools/build32
          cd SPIRV-Tools/build32
          cmake .. -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-25 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPIRV_SKIP_TESTS=ON \
            -DSPIRV_WERROR=OFF
          ninja
          cd ../..

          # 2. Configurar el cross-file para Mesa de 32 bits
          cat <<EOF > arm32_cross.txt
          [binaries]
          c = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi25-clang'
          cpp = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi25-clang++'
          ar = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'arm'
          cpu = 'armv7-a'
          endian = 'little'
          EOF

          export PKG_CONFIG_PATH=$PWD/stub_libs/pkgconfig
          export LDFLAGS="-L$PWD/SPIRV-Tools/build32/source -L$PWD/SPIRV-Tools/build32/source/opt"
          export CXXFLAGS="-I$PWD/SPIRV-Tools/include -I$PWD/SPIRV-Tools/source"

          meson setup build32 \
            --cross-file arm32_cross.txt \
            --buildtype=release \
            -Dplatforms=android \
            -Dplatform-sdk-version=25 \
            -Dgallium-drivers= \
            -Dmicrosoft-clc=disabled \
            -Dintel-clc=system \
            -Dvulkan-drivers=wrapper

          ninja -C build32

      - name: Estructurar con el "Truco de Pipetto" para Steven MXZ
        run: |
          mkdir -p wrapper_output/lib64
          mkdir -p wrapper_output/lib

          # Copiamos estrictamente los binarios libvulkan_wrapper.so generados
          find build64/ -name "libvulkan_wrapper.so" -exec cp {} wrapper_output/lib64/ \;
          find build32/ -name "libvulkan_wrapper.so" -exec cp {} wrapper_output/lib/ \;

          # Guardamos el archivo .tzst con máxima compresión Zstandard
          tar -I 'zstd -19' -cf wrapper.tzst -C wrapper_output .

      - name: Subir wrapper.tzst como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: bionic-vulkan-wrapper-multilib
          path: wrapper.tzst
