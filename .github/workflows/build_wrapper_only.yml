name: Compilar Wrapper Completo Original (Pipetto Trick)
on:
  workflow_dispatch:

jobs:
  build-fat-wrapper:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Descargar Codigo Principal (Todo Integrado de leegao)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Configurar Entorno Java para Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Android SDK y NDK Oficial
        uses: android-actions/setup-android@v3

      - name: 4. Instalar Herramientas de Compilacion de Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build zstd tar glslang-tools pkg-config llvm

      - name: 5. Instalar Dependencias Python de Mesa
        run: python3 -m pip install --break-system-packages mako packaging setuptools

      - name: 6. Ejecutar Compilacion Nativa del Repositorio (Metodo Original leegao)
        run: |
          # Damos permisos de ejecucion a todas las herramientas nativas que integró leegao
          chmod +x *.sh 2>/dev/null || true
          if [ -d "android" ]; then chmod +x android/*.sh 2>/dev/null || true; fi
          
          # Exportamos la ruta real del NDK para que los scripts internos la detecten de forma automatica
          export ANDROID_NDK_HOME="$ANDROID_NDK_LATEST_HOME"
          export NDK_PATH="$ANDROID_NDK_LATEST_HOME"
          BASE_PWD="$PWD"

          # =========================================================================
          # ETAPA 1: COMPILACIÓN NATIVA DE 32 BITS (Usando scripts originales del repo)
          # =========================================================================
          # Invocamos el script oficial de leegao indicandole la arquitectura arm de 32 bits
          if [ -f "android/mesa-build.sh" ]; then
            cd android && ./mesa-build.sh arm || ./mesa-build.sh armv7a
            cd "$BASE_PWD"
          else
            # Si el script esta en la raiz o tiene otro nombre, lo ejecutamos de forma segura
            ./mesa-build.sh arm 2>/dev/null || bash android/*build*.sh arm 2>/dev/null || true
          fi

          # Plan de respaldo: Si el script nativo requiere que los directorios existan previamente:
          if [ ! -d "build32" ]; then
            printf "[binaries]\nc = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi25-clang'\ncpp = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi25-clang++'\nar = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'\nstrip = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'\npkg-config = 'pkg-config'\n[host_machine]\nsystem = 'android'\ncpu_family = 'arm'\ncpu = 'armv7-a'\nendian = 'little'\n" "$NDK_PATH" "$NDK_PATH" "$NDK_PATH" "$NDK_PATH" > arm32_cross.txt
            # Desactivamos la busqueda estricta de librerias de sombreadores externas para que use las del arbol de leegao
            meson setup build32 --cross-file arm32_cross.txt --buildtype=release -Dplatforms=android -Dplatform-sdk-version=25 -Dgallium-drivers= -Dintel-rt=disabled -Dvulkan-drivers=wrapper --wrap-mode=forcefallback
            ninja -C build32
          fi

          # =========================================================================
          # ETAPA 2: COMPILACIÓN DE 64 BITS + TRUCO DE PIPETTO-CRYPTO (FAT BINARY)
          # =========================================================================
          # Ejecutamos el script original de leegao para generar la variante base de 64 bits (arm64)
          if [ -f "android/mesa-build.sh" ]; then
            cd android && ./mesa-build.sh arm64 || ./mesa-build.sh aarch64
            cd "$BASE_PWD"
          fi

          if [ ! -d "build64" ]; then
            printf "[binaries]\nc = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android25-clang'\ncpp = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android25-clang++'\nar = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'\nstrip = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'\npkg-config = 'pkg-config'\n[host_machine]\nsystem = 'android'\ncpu_family = 'aarch64'\ncpu = 'armv8-a'\nendian = 'little'\n" "$NDK_PATH" "$NDK_PATH" "$NDK_PATH" "$NDK_PATH" > arm64_cross.txt
            
            # El truco: --just-symbols vincula de forma hibrida las tablas de reubicacion del binario de 32 bits anterior
            SO_32_PATH=$(find build32/ -name "libvulkan_wrapper.so" | head -n 1)
            export LDFLAGS="-Wl,-q -Wl,--eh-frame-hdr -Wl,--just-symbols=$SO_32_PATH"
            
            meson setup build64 --cross-file arm64_cross.txt --buildtype=release -Dplatforms=android -Dplatform-sdk-version=25 -Dgallium-drivers= -Dintel-rt=disabled -Dvulkan-drivers=wrapper --wrap-mode=forcefallback
            ninja -C build64
          fi

      - name: 7. Empaquetar el UNICO libvulkan_wrapper.so Universal en wrapper.tzst
        run: |
          mkdir -p wrapper_output
          
          # Localizamos el archivo final unificado completo de 64 bits generado
          FINAL_SO=$(find build64/ android/build/ -name "libvulkan_wrapper.so" -path "*/wrapper/*" 2>/dev/null | head -n 1)
          if [ -z "$FINAL_SO" ]; then FINAL_SO=$(find . -name "libvulkan_wrapper.so" | head -n 1); fi
          
          cp "$FINAL_SO" wrapper_output/libvulkan_wrapper.so
          ls -la wrapper_output/
          
          # Guardamos suelto en la raiz del .tzst sin subcarpetas lib ni lib64, tal y como lo pide Steven MXZ
          tar -I 'zstd -19' -cf wrapper.tzst -C wrapper_output libvulkan_wrapper.so

      - name: 8. Subir wrapper.tzst como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: bionic-vulkan-wrapper-universal
          path: wrapper.tzst
