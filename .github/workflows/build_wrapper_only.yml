name: Compilador wrapper.tzst NDK Híbrido Oficial Real
on: workflow_dispatch

jobs:
  build-mali:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Instalar Herramientas Base del Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build git zstd tar pkg-config glslang-tools python3-mako python3-pip cmake g++
          pip3 install mako ply --break-system-packages || pip3 install mako ply

      - name: 2. Checkout de tu Repositorio (Carga los .sh)
        uses: actions/checkout@v4

      - name: 3. Descargar Código de Leegao Original Completo
        uses: actions/checkout@v4
        with:
          repository: 'leegao/bionic-vulkan-wrapper'
          path: 'wrapper_src'
          fetch-depth: 1

      - name: 4. Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: 5. Instalar NDK de Fábrica
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"
          echo "ANDROID_NDK_HOME=${ANDROID_SDK_ROOT}/ndk/25.2.9519653" >> $GITHUB_ENV

      - name: 6. Compilación Híbrida Usando los Subproyectos Originales de Leegao
        run: |
          # Corregir saltos de línea de Windows (CRLF) a Linux (LF)
          sed -i 's/\r$//' *.sh || true
          chmod +x setup_stubs.sh setup_libs_stubs.sh setup_cross.sh
          
          # Mover los scripts dentro del entorno de Leegao si es necesario,
          # o ejecutar el script principal asegurando el entorno del NDK.
          export ANDROID_NDK_ROOT=${ANDROID_NDK_HOME}
          ./setup_stubs.sh

      - name: 7. Archivar y Comprimir en .tar.zst
        run: |
          # Reemplaza 'build' o 'output' por la carpeta real donde se genere tu binario de 9MB
          tar --zstd -cf wrapper_output.tzst wrapper_src/

      - name: 8. Subir Artefacto Compilado
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-ndk-hibrido
          path: wrapper_output.tzst
