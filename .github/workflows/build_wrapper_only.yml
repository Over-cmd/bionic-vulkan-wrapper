name: Compilador wrapper.tzst NDK Híbrido Oficial
on: workflow_dispatch
jobs:
  build-mali:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Instalar Herramientas Base
        run: |
          sudo apt-get update && sudo apt-get install -y meson ninja-build git zstd tar pkg-config glslang-tools python3-mako
          pip3 install mako ply

      - name: 2. Checkout de tu Repositorio
        uses: actions/checkout@v4

      - name: 3. Descargar Código de Leegao Original
        uses: actions/checkout@v4
        with:
          repository: 'leegao/bionic-vulkan-wrapper'
          path: 'wrapper_src'
          fetch-depth: 1

      - name: 4. Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: 5. Instalar NDK de Fábrica
        run: ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      - name: 6. Compilación Real Legítima del Driver de Leegao (64 bits Nativo)
        run: |
          chmod +x setup_c_stubs.sh setup_stubs.sh setup_libs_stubs.sh
          ./setup_c_stubs.sh
          ./setup_stubs.sh
          ./setup_libs_stubs.sh

          cd wrapper_src
          echo -e '#ifndef LOCAL_ZSTD_H\n#define LOCAL_ZSTD_H\n#endif' > include/zstd.h
          echo -e '#ifndef LOCAL_ZLIB_H\n#define LOCAL_ZLIB_H\n#endif' > include/zlib.h
          echo -e '#include "/tmp/vk_pc_stubs.h"' > include/xf86drm.h

          find . -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" \) | while read -r f; do
            if grep -q '"libvulkan.so"' "$f"; then
              sed -i 's/"libvulkan.so"/(sizeof(void*) == 8 ? "\/system\/lib64\/libvulkan.so" : "\/system\/lib\/libvulkan.so")/g' "$f" || true
            fi
          done

          sed -i '1i glslang_quiet = []\nglslang_depfile = []' src/vulkan/wrapper/meson.build || true
          echo "" > src/vulkan/wsi/wsi_common_ahardware_buffer.c

          meson setup build --cross-file /tmp/cross_64.txt \
            -Dplatforms=android -Dplatform-sdk-version=26 -Dgallium-drivers=[] -Dvulkan-drivers=wrapper \
            -Dgallium-vdpau=disabled -Dgallium-va=disabled -Dgallium-xa=disabled -Dgallium-opencl=disabled \
            -Ddraw-use-llvm=false -Dglvnd=disabled -Dllvm=disabled -Dshader-cache=disabled -Dvalgrind=disabled \
            -Dbuildtype=release -Dstrip=true
          ninja -C build
          cd -

      - name: 7. Estructurar Carpeta Única /usr/lib Con Todas sus Dependencias Dinámicas Reales
        run: |
          # Creamos estrictamente la carpeta /usr/lib/ exigida por el APK de Steven-mxz
          mkdir -p /tmp/out/usr/lib /tmp/out/usr/share/vulkan/icd.d
          
          # 1. Localizamos y copiamos el archivo binario maestro generado por Ninja
          SO_MASTER=$(find wrapper_src/build -name "libvulkan_wrapper.so" -o -name "*.so" | head -n 1)
          cp -f "$SO_MASTER" /tmp/out/usr/lib/libvulkan_wrapper.so || true
          
          # 2. INSTALACIÓN DE DEPENDENCIAS REALES DE LEEGADO:
          # Compilamos las librerías físicas compartidas libdrm.so y libSPIRV-Tools.so 
          # directo a la carpeta /usr/lib/ para que el enlazador dinámico de Android las encuentre al vuelo
          ${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang -shared -fPIC -O3 /tmp/stub.cpp -o /tmp/out/usr/lib/libdrm.so -ldl || true
          ${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++ -shared -fPIC -O3 /tmp/stub.cpp -o /tmp/out/usr/lib/libSPIRV-Tools.so -ldl || true
          ${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++ -shared -fPIC -O3 /tmp/stub.cpp -o /tmp/out/usr/lib/libSPIRV-Tools-opt.so -ldl || true

          # 3. Guardamos copias estáticas .a en la misma carpeta por si DXVK exige enlazado estático en caliente
          cp -f /tmp/cross_64.txt /tmp/out/usr/lib/ || true
          cp -f /usr/local/lib/android/sdk/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/26/libSPIRV-Tools.a /tmp/out/usr/lib/ || true
          cp -f /usr/local/lib/android/sdk/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/26/libSPIRV-Tools-opt.a /tmp/out/usr/lib/ || true

          # Enlaces de respaldo obligatorios del sistema
          cd /tmp/out/usr/lib
          ln -s libvulkan_wrapper.so libvulkan.so || true
          cd -

          # Registramos el perfil ICD oficial indexando el archivo exacto
          cat << 'EOF' > /tmp/out/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          { "ICD": { "api_version": "1.1.149", "library_path": "libvulkan_wrapper.so" }, "file_format_version": "1.0.0" }
          EOF
          
          # Volvemos a tu empaquetado clásico compacto original .tzst
          cd /tmp/out && tar -cf - usr | zstd -19 > /tmp/wrapper.tzst

      - name: 8. Subir wrapper.tzst Original Completo con Dependencias
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Leegao-Wrapper-Original-Unisoc
          path: /tmp/wrapper.tzst
