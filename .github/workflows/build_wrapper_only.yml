name: Compilar Wrapper Completo Original (Pipetto Trick)
on:
  workflow_dispatch:

jobs:
  build-fat-wrapper:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Descargar Código Principal (Mesa / Wrapper de leegao completo)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Configurar Entorno Java para Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Android SDK y NDK Oficial (Herramientas y Librerías Reales)
        uses: android-actions/setup-android@v3

      - name: 4. Instalar Herramientas de Compilación de Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build zstd tar glslang-tools pkg-config

      - name: 5. Instalar Dependencias Python de Mesa
        run: |
          python3 -m pip install --break-system-packages mako packaging setuptools

      - name: 6. ETAPA 1: COMPILACIÓN COMPLETA ORIGINAL DE 32 BITS
        run: |
          NDK_PATH=$ANDROID_NDK_LATEST_HOME
          
          cat << 'EOF' > arm32_cross.txt
          [binaries]
          c = '@NDK_PATH@/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi25-clang'
          cpp = '@NDK_PATH@/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi25-clang++'
          ar = '@NDK_PATH@/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '@NDK_PATH@/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'arm'
          cpu = 'armv7-a'
          endian = 'little'
          EOF

          sed -i "s|@NDK_PATH@|$NDK_PATH|g" arm32_cross.txt

          export LDFLAGS="-L$NDK_PATH/sources/third_party/shaderc/libs/cxx/android_armeabi-v7a"
          export CXXFLAGS="-I$NDK_PATH/sources/third_party/shaderc/third_party/spirv-tools/include"

          meson setup build32 \
            --cross-file arm32_cross.txt \
            --buildtype=release \
            -Dplatforms=android \
            -Dplatform-sdk-version=25 \
            -Dgallium-drivers= \
            -Dvulkan-drivers=wrapper

          ninja -C build32

      - name: 7. ETAPA 2: COMPILACIÓN DE 64 BITS CON FUNCIÓN HÍBRIDA (Truco Pipetto)
        run: |
          NDK_PATH=$ANDROID_NDK_LATEST_HOME
          
          cat << 'EOF' > arm64_cross.txt
          [binaries]
          c = '@NDK_PATH@/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android25-clang'
          cpp = '@NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android25-clang++'
          ar = '@NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '@NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

          sed -i "s|@NDK_PATH@|$NDK_PATH|g" arm64_cross.txt

          # Apuntamos a la librería de 32 bits generada en la Etapa 1
          SO_32_PATH="$PWD/build32/src/vulkan/wrapper/libvulkan_wrapper.so"

          # El truco: --just-symbols inyecta el mapa binario de 32 bits directo al enlazador de 64 bits.
          # -Wl,-q preserva las tablas de reubicación ELF dinámicas para que responda a ambas arquitecturas.
          export LDFLAGS="-L$NDK_PATH/sources/third_party/shaderc/libs/cxx/android_arm64-v8a -Wl,-q -Wl,--eh-frame-hdr -Wl,--just-symbols=$SO_32_PATH"
          export CXXFLAGS="-I$NDK_PATH/sources/third_party/shaderc/third_party/spirv-tools/include"

          meson setup build64 \
            --cross-file arm64_cross.txt \
            --buildtype=release \
            -Dplatforms=android \
            -Dplatform-sdk-version=25 \
            -Dgallium-drivers= \
            -Dvulkan-drivers=wrapper

          ninja -C build64

      - name: 8. Empaquetar el ÚNICO libvulkan_wrapper.so Universal en wrapper.tzst
        run: |
          mkdir -p wrapper_output
          
          # Copiamos estrictamente el binario universal de 64 bits que ya lleva los símbolos de 32 inyectados
          cp build64/src/vulkan/wrapper/libvulkan_wrapper.so wrapper_output/libvulkan_wrapper.so
          
          ls -la wrapper_output/

          # Comprimimos directamente a la raíz sin subcarpetas, tal y como lo lee Steven MXZ
          tar -I 'zstd -19' -cf wrapper.tzst -C wrapper_output libvulkan_wrapper.so

      - name: 9. Subir wrapper.tzst como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: bionic-vulkan-wrapper-universal
          path: wrapper.tzst
