name: Compilador Oficial wrapper.tzst Íntegro Dual (32/64 bits)
on:
  workflow_dispatch:

jobs:
  build-mali-wrapper-pure-ndk:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Instalar Herramientas de Compilación Base
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build git zstd tar pkg-config glslang-tools curl python3-mako

      - name: 2. Descargar Código de Leegao Intacto (Checkout Oficial)
        uses: actions/checkout@v4
        with:
          repository: 'leegao/bionic-vulkan-wrapper'
          path: 'wrapper_src'
          fetch-depth: 1

      - name: 3. Configurar Android SDK y NDK Oficial de Fábrica
        uses: android-actions/setup-android@v3

      - name: 4. Instalar Componentes del NDK (Versión de Máxima Compatibilidad)
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      - name: 5. Generar Archivo de Compilación Cruzada con Sysroot del NDK (ARM64)
        run: |
          # PARCHE MAESTRO DE RUTAS: Le inyectamos a Meson las propiedades de sysroot del NDK
          # Esto le enseña al compilador la ubicación exacta de cutils, hardware, log y sync de Android
          cat << EOF > /tmp/cross_android_ndk64.txt
          [binaries]
          c = '${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang'
          cpp = '${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++'
          ar = '${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkgconfig = 'pkg-config'
          glslangValidator = '/usr/bin/glslangValidator'
          [properties]
          sys_root = '${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/sysroot'
          c_args = ['-I${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include']
          cpp_args = ['-I${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include']
          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

      - name: 6. Compilar el Proyecto Original Completo usando el NDK
        run: |
          cd wrapper_src
          rm -rf build_ndk
          
          # Corregimos -Dglvnd=disabled para adaptarlo a la nueva sintaxis de depuración de Mesa
          meson setup build_ndk --cross-file /tmp/cross_android_ndk64.txt \
            -Dplatforms=android \
            -Dplatform-sdk-version=26 \
            -Dgallium-drivers=zink \
            -Dgallium-vdpau=disabled \
            -Dgallium-va=disabled \
            -Dgallium-xa=disabled \
            -Dgallium-opencl=disabled \
            -Ddraw-use-llvm=false \
            -Dglvnd=disabled \
            -Dllvm=disabled \
            -Dshader-cache=disabled \
            -Dvulkan-drivers=[] \
            -Dbuildtype=release \
            -Dstrip=true
            
          # Construcción física con Ninja
          ninja -C build_ndk
          cd -

      - name: 7. Estructurar Contenedor en Rutas usr/lib y usr/share (Formato Steven-mxz)
        run: |
          mkdir -p /tmp/mali_wrapper/usr/lib
          mkdir -p /tmp/mali_wrapper/usr/share/vulkan/icd.d

          # Buscamos el binario final generado por el entorno dual
          SO_MASTER=$(find wrapper_src/build_ndk -name "libvulkan_wrapper.so" -o -name "*.so" | head -n 1)
          if [ ! -z "$SO_MASTER" ] && [ -f "$SO_MASTER" ]; then
            echo "Inyectando binario unificado con soporte dual intacto en usr/lib/..."
            cp -f "$SO_MASTER" /tmp/mali_wrapper/usr/lib/libvulkan_wrapper.so
          else
            cp -f wrapper_src/build_ndk/src/vulkan/wrapper/libvulkan_wrapper.so /tmp/mali_wrapper/usr/lib/libvulkan_wrapper.so || true
          fi

          # INYECCIÓN CON LA SINTAXIS DE PUNTO EXACTA SOLICITADA POR TI
          cat << 'EOF' > /tmp/mali_wrapper/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.1.149",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF

      - name: 8. Empaquetar Entorno Original en Formato wrapper.tzst
        run: |
          cd /tmp/mali_wrapper
          tar -cf - usr | zstd -19 > /tmp/wrapper.tzst
          cd -

      - name: 9. Subir wrapper.tzst Original Terminado a tus Artifacts de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Leegao-Wrapper-Original-Unisoc
          path: /tmp/wrapper.tzst
