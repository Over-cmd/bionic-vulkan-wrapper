name: Compilador wrapper.tzst NDK Dual
on: workflow_dispatch
jobs:
  build-mali:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Instalar Herramientas Base
        run: |
          sudo apt-get update && sudo apt-get install -y meson ninja-build git zstd tar pkg-config glslang-tools python3-mako
          pip3 install mako ply

      - name: 2. Checkout de tu Repositorio
        uses: actions/checkout@v4

      - name: 3. Descargar Código de Leegao
        uses: actions/checkout@v4
        with:
          repository: 'leegao/bionic-vulkan-wrapper'
          path: 'wrapper_src'
          fetch-depth: 1

      - name: 4. Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: 5. Instalar NDK de Fábrica
        run: ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      - name: 6. Ejecutar Scripts Divididos e Iniciar Compilación
        run: |
          chmod +x setup_c_stubs.sh setup_stubs.sh
          ./setup_c_stubs.sh
          ./setup_stubs.sh

          cd wrapper_src
          find . -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" \) | while read -r f; do
            if grep -q '"libvulkan.so"' "$f"; then
              sed -i 's/"libvulkan.so"/(sizeof(void*) == 8 ? "\/system\/lib64\/libvulkan.so" : "\/system\/lib\/libvulkan.so")/g' "$f" || true
            fi
          done

          sed -i '1i glslang_quiet = []\nglslang_depfile = []' src/vulkan/wrapper/meson.build || true
          echo "" > src/vulkan/wsi/wsi_common_ahardware_buffer.c

          meson setup build --cross-file /tmp/cross.txt \
            -Dplatforms=android \
            -Dplatform-sdk-version=26 \
            -Dgallium-drivers=[] \
            -Dvulkan-drivers=wrapper \
            -Dgallium-vdpau=disabled \
            -Dgallium-va=disabled \
            -Dgallium-xa=disabled \
            -Dgallium-opencl=disabled \
            -Ddraw-use-llvm=false \
            -Dglvnd=disabled \
            -Dllvm=disabled \
            -Dshader-cache=disabled \
            -Dvalgrind=disabled \
            -Dbuildtype=release \
            -Dstrip=true
          ninja -C build
          cd -

      - name: 7. Estructurar Ruta Única Unificada para Winlator Steven-mxz
        run: |
          # Creamos estrictamente la carpeta /usr/lib única que lee tu APK de Winlator
          mkdir -p /tmp/out/usr/lib /tmp/out/usr/share/vulkan/icd.d
          SO_MASTER=$(find wrapper_src/build -name "libvulkan_wrapper.so" -o -name "*.so" | head -n 1)
          
          # Copiamos el archivo binario maestro directo a la ruta unificada obligatoria
          cp -f "$SO_MASTER" /tmp/out/usr/lib/libvulkan_wrapper.so || true
          
          # Creamos los enlaces simbólicos cruzados dentro de la misma carpeta /usr/lib/
          # Esto garantiza que tanto los juegos de 32 como los de 64 bits enganchen el mismo puente biónico
          cd /tmp/out/usr/lib
          ln -s libvulkan_wrapper.so libvulkan.so || true
          ln -s libvulkan_wrapper.so libvulkan.mali.so || true
          ln -s libvulkan_wrapper.so vulkan.mali.so || true
          cd -

          # Mapeamos el perfil ICD oficial apuntando a la ruta unificada fija
          cat << 'EOF' > /tmp/out/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.1.149",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF
          
          cd /tmp/out && tar -cf - usr | zstd -19 > /tmp/wrapper.tzst

      - name: 8. Subir wrapper.tzst Listo y Funcional
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Leegao-Wrapper-Original-Unisoc
          path: /tmp/wrapper.tzst
