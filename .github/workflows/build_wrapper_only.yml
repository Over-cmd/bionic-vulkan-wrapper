name: Compilador wrapper.tzst NDK Híbrido
on: workflow_dispatch
jobs:
  build-mali:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Instalar Herramientas Base
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build git zstd tar pkg-config

      - name: 2. Setup Android NDK de Fábrica
        uses: android-actions/setup-android@v3

      - name: 3. Instalar NDK 25
        run: ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      - name: 4. Fabricar Fat Binary Único para Steven-mxz
        run: |
          # Creamos estrictamente la topología unificada exigida por el APK
          mkdir -p /tmp/out/usr/lib /tmp/out/usr/share/vulkan/icd.d
          
          # Escribimos el cargador híbrido autónomo en C nativo para Android.
          # Exportamos los dos puntos de entrada de Khronos que DXVK, Wine y Winlator rastrean de forma rígida.
          cat << 'EOF' > /tmp/interceptor.c
          #include <dlfcn.h>
          #include <stddef.h>
          
          // Función de resolución interna de JNI biónico para mapear el hardware de tu Unisoc T618
          static void* resolver_driver_mali(void* instance, const char* pName) {
              void* handle = NULL;
              // Evaluamos la arquitectura del juego en caliente.
              // Si el puntero mide 8 bytes es un proceso de 64 bits; de lo contrario es de 32 bits.
              if (sizeof(void*) == 8) {
                  handle = dlopen("/system/lib64/libvulkan.so", RTLD_NOW | RTLD_GLOBAL);
              } else {
                  handle = dlopen("/system/lib/libvulkan.so", RTLD_NOW | RTLD_GLOBAL);
              }
              if (!handle) return NULL;
              
              void* (*fn)(void*, const char*) = (void* (*)(void*, const char*))dlsym(handle, "vk_icdGetInstanceProcAddr");
              if (!fn) fn = (void* (*)(void*, const char*))dlsym(handle, "vkGetInstanceProcAddr");
              if (!fn) return NULL;
              return fn(instance, pName);
          }

          // Firma obligatoria 1: Requerida por el cargador ICD interno de Winlator
          void* vk_icdGetInstanceProcAddr(void* instance, const char* pName) {
              return resolver_driver_mali(instance, pName);
          }

          // Firma obligatoria 2: Requerida de forma rígida por DXVK y hilos de Wine
          void* vkGetInstanceProcAddr(void* instance, const char* pName) {
              return resolver_driver_mali(instance, pName);
          }
          EOF

          # Compilamos el interceptor físico ÚNICAMENTE bajo el nombre exacto que el APK modificado exige inyectar en /usr/lib/
          # Usamos las banderas estricta -shared y -fPIC para habilitar la inyección directa en memoria
          ${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang -shared -fPIC -O3 /tmp/interceptor.c -o /tmp/out/usr/lib/libvulkan_wrapper.so -ldl

          # Registramos el perfil ICD oficial apuntando al nombre rígido del wrapper unificado
          cat << 'EOF' > /tmp/out/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.1.149",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF

          # Empaquetamos todo dentro de la estructura limpia comprimido con Zstd de alta densidad
          cd /tmp/out && tar -cf - usr | zstd -19 > /tmp/wrapper.tzst

      - name: 5. Subir wrapper.tzst Máster e Indestructible
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Leegao-Wrapper-Original-Unisoc
          path: /tmp/wrapper.tzst
