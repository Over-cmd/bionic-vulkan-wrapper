name: Compilador wrapper.tzst NDK Dual
on: workflow_dispatch
jobs:
  build-mali:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Instalar Herramientas Base
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build git zstd tar pkg-config

      - name: 2. Setup Android NDK de Fábrica
        uses: android-actions/setup-android@v3

      - name: 3. Instalar NDK 25
        run: ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      - name: 4. Fabricar Interceptor JNI Hardware para Unisoc T618
        run: |
          mkdir -p /tmp/out/usr/lib /tmp/out/usr/share/vulkan/icd.d
          
          # Creamos un puente biónico directo en C para Android. 
          # Este intercepta la llamada rígida de Winlator y abre el Vulkan real de tu chip Mali-G52
          cat << 'EOF' > /tmp/interceptor.c
          #include <dlfcn.h>
          #include <stddef.h>
          
          // Punto de entrada unificado que DXVK y Wine exigen para inicializar el chip gráfico
          void* vk_icdGetInstanceProcAddr(void* instance, const char* pName) {
              void* handle = dlopen("/system/lib64/libvulkan.so", RTLD_NOW | RTLD_GLOBAL);
              if (!handle) handle = dlopen("/system/lib/libvulkan.so", RTLD_NOW | RTLD_GLOBAL);
              if (!handle) return NULL;
              
              void* (*fn)(void*, const char*) = (void* (*)(void*, const char*))dlsym(handle, "vk_icdGetInstanceProcAddr");
              if (!fn) return NULL;
              return fn(instance, pName);
          }
          EOF

          # Compilamos el interceptor físico bajo los dos nombres exactos que el APK rígido de Steven-mxz exige ver
          # Usamos las banderas -shared y -fPIC para habilitar la inyección nativa en el espacio de memoria de Wine
          ${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang -shared -fPIC -O3 /tmp/interceptor.c -o /tmp/out/usr/lib/libvulkan.so -ldl
          ${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang -shared -fPIC -O3 /tmp/interceptor.c -o /tmp/out/usr/lib/libvulkan_wrapper.so -ldl

          # Registramos el perfil ICD oficial indexando el archivo rígido unificado
          cat << 'EOF' > /tmp/out/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.1.149",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF

          # Empaquetamos todo dentro de la topología limpia /usr/lib/ comprimido con Zstd de alta densidad
          cd /tmp/out && tar -cf - usr | zstd -19 > /tmp/wrapper.tzst

      - name: 5. Subir wrapper.tzst Máster Funcional
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Leegao-Wrapper-Original-Unisoc
          path: /tmp/wrapper.tzst
