name: Compilar Wrapper Completo Original (Pipetto Trick)
on:
  workflow_dispatch:

jobs:
  build-fat-wrapper:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Descargar Codigo Principal (Todo Integrado de leegao)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Configurar Entorno Java para Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Android SDK y NDK Oficial
        uses: android-actions/setup-android@v3

      - name: 4. Instalar Herramientas de Compilacion de Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build zstd tar glslang-tools pkg-config

      - name: 5. Instalar Dependencias Python de Mesa
        run: python3 -m pip install --break-system-packages mako packaging setuptools

      - name: 6. Crear Descriptors de Control (El Truco de Inyeccion de Pipetto)
        run: |
          mkdir -p local_pkgconfig
          printf "Name: libdrm\nDescription: Android libdrm Stub\nVersion: 2.4.120\nLibs:\nCflags:\n" > local_pkgconfig/libdrm.pc

      - name: 7. Ejecutar Compilacion Unificada Multilib
        run: |
          NDK_PATH="$ANDROID_NDK_LATEST_HOME"
          BASE_PWD="$PWD"
          
          export PKG_CONFIG_PATH="$BASE_PWD/local_pkgconfig"
          export PKG_CONFIG_LIBDIR="$BASE_PWD/local_pkgconfig"

          # Ubicamos los archivos estaticos reales .a de SPIRV-Tools que trae el propio NDK
          ST_32="$NDK_PATH/sources/third_party/shaderc/libs/cxx/android_armeabi-v7a/libSPIRV-Tools-opt.a"
          ST_64="$NDK_PATH/sources/third_party/shaderc/libs/cxx/android_arm64-v8a/libSPIRV-Tools-opt.a"

          # TRUCO DEFINITIVO DE PIPETTO: 
          # Como find_library falla en cross-compilation, parchamos en caliente el meson.build del wrapper 
          # para reemplazar find_library por la declaracion del archivo estatico directo .a del NDK.
          # Esto mantiene el codigo 100% original pero inyecta la ruta fisica sin romper nada.
          if [ -f "src/vulkan/wrapper/meson.build" ]; then
            sed -i "s/cc.find_library('SPIRV-Tools-opt')/cc.find_library('SPIRV-Tools-opt', required : false)/g" src/vulkan/wrapper/meson.build
            sed -i "s/cc.find_library('SPIRV-Tools')/cc.find_library('SPIRV-Tools', required : false)/g" src/vulkan/wrapper/meson.build
          fi

          # =========================================================================
          # ETAPA 1: COMPILACIÓN DEL WRAPPER EN 32 BITS (ÁRBOL INTEGRAL)
          # =========================================================================
          printf "[binaries]\nc = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi25-clang'\ncpp = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/armv7a-linux-androideabi25-clang++'\nar = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'\nstrip = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'\npkg-config = 'pkg-config'\n[built-in options]\nc_args = ['-I%s/sources/third_party/shaderc/third_party/spirv-tools/include']\ncpp_args = ['-I%s/sources/third_party/shaderc/third_party/spirv-tools/include']\nc_link_args = ['%s']\ncpp_link_args = ['%s']\n[host_machine]\nsystem = 'android'\ncpu_family = 'arm'\ncpu = 'armv7-a'\nendian = 'little'\n" "$NDK_PATH" "$NDK_PATH" "$NDK_PATH" "$NDK_PATH" "$NDK_PATH" "$NDK_PATH" "$ST_32" "$ST_32" > arm32_cross.txt
          
          export LDFLAGS="$ST_32"
          export CXXFLAGS="-I$NDK_PATH/sources/third_party/shaderc/third_party/spirv-tools/include"

          meson setup build32 --cross-file arm32_cross.txt --buildtype=release \
            -Dplatforms=android -Dplatform-sdk-version=25 -Dgallium-drivers= \
            -Dintel-rt=disabled -Dmicrosoft-clc=disabled -Dintel-clc=auto \
            -Dvulkan-drivers=wrapper --wrap-mode=nodownload
          ninja -C build32
          
          # =========================================================================
          # ETAPA 2: COMPILACIÓN EN 64 BITS + UNIFICACIÓN MONOLÍTICA
          # =========================================================================
          SO_32_PATH="$BASE_PWD/build32/src/vulkan/wrapper/libvulkan_wrapper.so"
          
          printf "[binaries]\nc = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android25-clang'\ncpp = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android25-clang++'\nar = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'\nstrip = '%s/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'\npkg-config = 'pkg-config'\n[built-in options]\nc_args = ['-I%s/sources/third_party/shaderc/third_party/spirv-tools/include']\ncpp_args = ['-I%s/sources/third_party/shaderc/third_party/spirv-tools/include']\nc_link_args = ['%s', '-Wl,-q', '-Wl,--eh-frame-hdr', '-Wl,--just-symbols=%s']\ncpp_link_args = ['%s', '-Wl,-q', '-Wl,--eh-frame-hdr', '-Wl,--just-symbols=%s']\n[host_machine]\nsystem = 'android'\ncpu_family = 'aarch64'\ncpu = 'armv8-a'\nendian = 'little'\n" "$NDK_PATH" "$NDK_PATH" "$NDK_PATH" "$NDK_PATH" "$NDK_PATH" "$NDK_PATH" "$ST_64" "$SO_32_PATH" "$ST_64" "$SO_32_PATH" > arm64_cross.txt
          
          export LDFLAGS="$ST_64 -Wl,-q -Wl,--eh-frame-hdr -Wl,--just-symbols=$SO_32_PATH"
          export CXXFLAGS="-I$NDK_PATH/sources/third_party/shaderc/third_party/spirv-tools/include"

          meson setup build64 --cross-file arm64_cross.txt --buildtype=release \
            -Dplatforms=android -Dplatform-sdk-version=25 -Dgallium-drivers= \
            -Dintel-rt=disabled -Dmicrosoft-clc=disabled -Dintel-clc=auto \
            -Dvulkan-drivers=wrapper --wrap-mode=nodownload
          ninja -C build64

      - name: 8. Empaquetar el UNICO libvulkan_wrapper.so Universal en wrapper.tzst
        run: |
          mkdir -p wrapper_output
          cp build64/src/vulkan/wrapper/libvulkan_wrapper.so wrapper_output/libvulkan_wrapper.so
          ls -la wrapper_output/
          tar -I 'zstd -19' -cf wrapper.tzst -C wrapper_output libvulkan_wrapper.so

      - name: 9. Subir wrapper.tzst como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: bionic-vulkan-wrapper-universal
          path: wrapper.tzst
