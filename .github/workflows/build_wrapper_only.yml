#!/bin/bash
set -e

# Heredamos de forma limpia la ruta inyectada por el paso 5 del YAML
export ANDROID_NDK_HOME="$MY_NDK_PATH"
echo "=== 1. Pre-compilando el Motor Optimizador de leegao (NDK: $ANDROID_NDK_HOME) ==="

# Armonizamos las tablas sintácticas de Khronos
sed -i 's/SPV_OPERAND_TYPE_MEMORY_MODEL,/SPV_OPERAND_TYPE_MEMORY_MODEL,\n  SPV_OPERAND_TYPE_GATHER_MODES,/g' spirv_source/include/spirv-tools/libspirv.h

mkdir -p spirv_source/build_64
cd spirv_source/build_64
cmake .. -G Ninja \
  -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_HOME/build/cmake/android.toolchain.cmake" \
  -DANDROID_ABI=arm64-v8a \
  -DANDROID_PLATFORM=android-26 \
  -DCMAKE_BUILD_TYPE=Release \
  -DSPIRV_SKIP_TESTS=ON \
  -DSPIRV_WERROR=OFF
ninja
cd ../..

echo "=== 2. COMPILACIÓN DIRECTA POR HARDWARE (El Secreto de Winlator Steven MXZ) ==="
mkdir -p wrapper_output
CLANG_64="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++"
SYSROOT="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot"

# Clang++ compila directamente los módulos fuente limpios y puros de leegao sin el peso roto de Mesa 24
$CLANG_64 --sysroot="$SYSROOT" -O3 -shared -fPIC -std=c++17 \
  -D__BIONIC__ -DANDROID -D_FORTIFY_SOURCE=2 \
  -I./spirv_source/include \
  -I./spirv_source/external/spirv-headers/include \
  -I./src/vulkan/wrapper \
  -I./src/include \
  src/vulkan/wrapper/wrapper_device.c \
  src/vulkan/wrapper/wrapper_instance.c \
  src/vulkan/wrapper/wrapper_log.c \
  src/vulkan/wrapper/spirv_edit.cpp \
  -Wl,--whole-archive \
  spirv_source/build_64/source/opt/libSPIRV-Tools-opt.a \
  spirv_source/build_64/source/libSPIRV-Tools.a \
  -Wl,--no-whole-archive \
  -lm -llog -landroid \
  -o wrapper_output/libvulkan_wrapper.so

echo "=== 3. EMPAQUETADO MONOLÍTICO: Comprobando Peso Bruto y Comprimiendo ==="
ls -lh wrapper_output/libvulkan_wrapper.so
tar -cf wrapper.tar -C wrapper_output libvulkan_wrapper.so
zstd -19 wrapper.tar -o wrapper.tzst

echo "Proceso finalizado con éxito absoluto de forma limpia."
