name: Compilar Wrapper Completo Original (Direct Clang)
on:
  workflow_dispatch:

jobs:
  build-fat-wrapper:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Descargar Codigo Principal del Wrapper
        uses: actions/checkout@v4

      - name: 2. Descargar SPIRV-Tools Custom Legítimo de leegao
        uses: actions/checkout@v4
        with:
          repository: 'leegao/SPIRV-Tools'
          path: 'spirv_source'

      - name: 3. Descargar SPIRV-Headers Estables de Khronos
        uses: actions/checkout@v4
        with:
          repository: 'KhronosGroup/SPIRV-Headers'
          ref: 'main'
          path: 'spirv_source/external/spirv-headers'

      - name: 4. Configurar Entorno Java para Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. Instalar Android SDK y NDK Oficial
        uses: android-actions/setup-android@v3

      - name: 6. Instalar Herramientas de Compilacion de Ubuntu
        run: sudo apt-get update && sudo apt-get install -y zstd tar glslang-tools cmake ninja-build

      - name: 7. Compilar e Inyectar el Motor de leegao Completo con Peso Real
        run: mkdir -p spirv_source/build_64 && cd spirv_source/build_64 && cmake .. -G Ninja -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release -DSPIRV_SKIP_TESTS=ON -DSPIRV_WERROR=OFF && ninja

      - name: 8. Generar Entorno de Cabeceras e Inyecciones
        run: chmod +x crear_cabeceras.sh && ./crear_cabeceras.sh || true && chmod +x crear_stubs.sh && ./crear_stubs.sh || true

      - name: 9. COMPILACIÓN DIRECTA DE CLANG (El Método Real de leegao)
        run: mkdir -p wrapper_output && $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++ --sysroot=$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot -O3 -shared -fPIC -std=c++17 -I./spirv_source/include -I./spirv_source/external/spirv-headers/include src/vulkan/wrapper/wrapper_device.c src/vulkan/wrapper/wrapper_instance.c src/vulkan/wrapper/wrapper_log.c src/vulkan/wrapper/spirv_edit.cpp -Wl,--whole-archive spirv_source/build_64/source/opt/libSPIRV-Tools-opt.a spirv_source/build_64/source/libSPIRV-Tools.a -Wl,--no-whole-archive -lm -llog -landroid -o wrapper_output/libvulkan_wrapper.so

      - name: 10. EMPAQUETADO BRUTO: Comprobando Peso de leegao y Comprimiendo en tzst
        run: ls -lh wrapper_output/libvulkan_wrapper.so && tar -cf wrapper.tar -C wrapper_output libvulkan_wrapper.so && zstd -19 wrapper.tar -o wrapper.tzst

      - name: 11. Subir wrapper.tzst como Artefacto Universal para Winlator
        uses: actions/upload-artifact@v4
        with:
          name: bionic-vulkan-wrapper-universal
          path: wrapper.tzst
