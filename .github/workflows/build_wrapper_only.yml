name: Compilar Wrapper TZST
on:
  workflow_dispatch: # Permite ejecutar el botón manualmente desde la pestaña Actions

jobs:
  build-wrapper:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          submodules: true # Importante por si el repositorio tiene submódulos

      - name: Instalar Dependencias de Compilación
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build gcc-aarch64-linux-gnu g++-aarch64-linux-gnu zstd tar

      - name: Configurar Proyecto con Meson
        run: |
          # Si el repositorio requiere compilación cruzada para ARM64 (Android/Winlator)
          # Reemplaza 'cross_file.txt' si el repo incluye su propio archivo de cross-compilation
          meson setup build --buildtype=release

      - name: Compilar con Ninja
        run: |
          ninja -C build

      - name: Empaquetar en wrapper.tzst
        run: |
          # Modifica la ruta 'build/src/' según dónde se genere el binario (ej. libvulkan_wrapper.so)
          # Este comando guarda la carpeta de salida en formato .tar.zst (.tzst)
          tar -I 'zstd -19' -cf wrapper.tzst -C build/src .

      - name: Subir wrapper.tzst como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: bionic-vulkan-wrapper-tzst
          path: wrapper.tzst
