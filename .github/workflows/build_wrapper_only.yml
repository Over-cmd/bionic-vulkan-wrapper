name: Compilar Wrapper TZST
on:
  workflow_dispatch:

jobs:
  build-wrapper:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Instalar Dependencias de Compilación Cruzada y Herramientas Vulkan
        run: |
          sudo apt-get update
          # Instalamos glslang-tools para obtener glslangValidator, junto con librerías de desarrollo de Vulkan
          sudo apt-get install -y \
            meson ninja-build zstd tar glslang-tools libvulkan-dev \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Configurar Proyecto con Meson (Target ARM64)
        run: |
          # Como este proyecto está hecho para Winlator (Android), forzamos la compilación cruzada hacia aarch64.
          # Si el repositorio provee su propio archivo cross en 'android' o 'build-support', úsalo. 
          # De lo contrario, este bloque genera un archivo cross-file temporal estándar:
          cat <<EOF > arm64_cross.txt
          [binaries]
          c = 'aarch64-linux-gnu-gcc'
          cpp = 'aarch64-linux-gnu-g++'
          ar = 'aarch64-linux-gnu-ar'
          strip = 'aarch64-linux-gnu-strip'
          pkgconfig = 'pkg-config'

          [properties]
          needs_exe_wrapper = true

          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'v8a'
          endian = 'little'
          EOF

          # Configuramos usando el archivo de compilación cruzada y desactivamos elementos innecesarios de Mesa
          meson setup build \
            --cross-file arm64_cross.txt \
            --buildtype=release \
            -Dplatforms=android \
            -Dgallium-drivers= \
            -Dvulkan-drivers=

      - name: Compilar con Ninja
        run: |
          ninja -C build

      - name: Empaquetar en wrapper.tzst
        run: |
          # Empaquetamos la carpeta build donde residen las librerías finales .so compiladas
          tar -I 'zstd -19' -cf wrapper.tzst -C build .

      - name: Subir wrapper.tzst como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: bionic-vulkan-wrapper-arm64
          path: wrapper.tzst
