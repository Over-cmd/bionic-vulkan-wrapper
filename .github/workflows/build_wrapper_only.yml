name: Compilación de Termux del envoltorio Vulkan de Mesa

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  BUILD_DIR: compilacion
  IMAGE_TAG: ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Código de pago (Checkout)
        uses: actions/checkout@v4

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Instalar Herramientas Nativas en el Servidor (CMake & Ninja)
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build cmake pkg-config python3-mako xxd zstd tar wget

      - name: Activar Android NDK Nativo del Servidor
        run: |
          NDK_SERVER_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* | tail -n 1)
          if [ -z "$NDK_SERVER_PATH" ]; then NDK_SERVER_PATH="/usr/local/lib/android/sdk/ndk-bundle"; fi
          echo "ANDROID_NDK_LATEST_HOME=$NDK_SERVER_PATH" >> $GITHUB_ENV

      # =========================================================================
      # 🛠️ PASO A: DESCARGA DE REQUISITOS PREVIOS DE SHADERS (leegao/Khronos)
      # =========================================================================
      - name: Descargar Componentes Base de SPIRV-Tools
        run: |
          B_SPIRV=$(echo "aHR0cHM6Ly9naXRodWIuY29tL2xlZWdhby9TUElSVi1Ub29scy5naXQ=" | base64 -d)
          B_HEADERS=$(echo "aHR0cHM6Ly9naXRodWIuY29tL0tocm9ub3NHcm91cC9TUElSVi1IZWFkZXJzLmdpdA==" | base64 -d)
          
          git clone --depth 1 "$B_SPIRV" spirv_source
          git clone --depth 1 "$B_HEADERS" spirv_source/external/spirv-headers

      # =========================================================================
      # 🛠️ ETAPA A: PRE-COMPILACIÓN DE SHADERS DESDE EL SERVIDOR (Resuelve CMake)
      # =========================================================================
      - name: Forja Remota de Shaders de Fábrica (Host)
        run: |
          chmod +x compilar_shaders.sh
          ./compilar_shaders.sh

      # =========================================================================
      # 🛠️ ETAPA B: INYECCIÓN AL DOCKER PARA LA COMPILACIÓN OFICIAL DE 64 BITS
      # =========================================================================
      - name: Forja del Wrapper de Over-cmd (Mesa de 64 bits en Docker)
        run: |
          mkdir -p ${{ env.BUILD_DIR }}
          
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            --entrypoint /bin/bash \
            ${{ env.IMAGE_TAG }} \
            -c "cd /workspace && \
                chmod +x preparar_entorno.sh build_mesa.sh && \
                ./preparar_entorno.sh && \
                export PKG_CONFIG_PATH=/workspace/local_pkgconfig && \
                export PKG_CONFIG_LIBDIR=/workspace/local_pkgconfig && \
                meson setup ${{ env.BUILD_DIR }} \
                  --cross-file cross64.txt \
                  --buildtype=release \
                  -Dvulkan-drivers=wrapper \
                  -Dgallium-drivers=[] \
                  -Dgallium-opencl=disabled \
                  -Dmicrosoft-clc=disabled \
                  --pkg-config-path=/workspace/local_pkgconfig \
                  --pkg-config-libdir=/workspace/local_pkgconfig && \
                ninja -C ${{ env.BUILD_DIR }}"

      # =========================================================================
      # 💥 PUENTE MAESTRO WOW64 (32 BITS) PARA PIPETTO-CRYPTO DESDE EL HOST
      # =========================================================================
      - name: Fundición de Arquitecturas Cruzadas e Inyección WoW64 (Host)
        run: |
          chmod +x crear_stubs.sh
          ./crear_stubs.sh

      # =========================================================================
      # SUBIDA DE ARTIFACTOS REGLAMENTARIOS PARA LA SCENE
      # =========================================================================
      - name: Cargar paquete unificado para Winlator Pipetto (wrapper.tzst)
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-vulkan-mali-pipetto
          path: ${{ env.BUILD_DIR }}/wrapper.tzst
          if-no-files-found: error

      - name: Cargar libvulkan_wrapper.so con formato Fat
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-vulkan-mali-pipetto-so
          path: ${{ env.BUILD_DIR }}/libvulkan_wrapper.so
          if-no-files-found: error
