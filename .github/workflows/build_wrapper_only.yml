name: Compilador wrapper.tzst NDK Híbrido Oficial Real
on: workflow_dispatch
jobs:
  build-mali:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Instalar Herramientas Base del Sistema
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build git zstd tar pkg-config glslang-tools python3-mako cmake g++ curl
          pip3 install mako ply

      - name: 2. Checkout de tu Repositorio
        uses: actions/checkout@v4

      - name: 3. Descargar Código de Leegao Original
        uses: actions/checkout@v4
        with:
          repository: 'leegao/bionic-vulkan-wrapper'
          path: 'wrapper_src'
          fetch-depth: 1

      - name: 4. Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: 5. Instalar NDK de Fábrica
        run: ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      - name: 6. Compilación de Leegao en Modo Híbrido Pesado de Pipetto (32 y 64 bits en un .so)
        run: |
          SYSROOT_MAESTRO="${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          LIB_64="${SYSROOT_MAESTRO}/usr/lib/aarch64-linux-android/26"

          # 1. SEMBRADO DIRECTO DE CABECERA DE SALUD (Desbloquea el test del compilador de Meson)
          cat << 'EOF' > /tmp/vk_pc_stubs.h
          #ifndef _VK_PC_STUBS_H
          #define _VK_PC_STUBS_H
          #include <stdint.h>
          #include <stddef.h>
          #include <stdbool.h>
          #define HAVE_ZSTD 1
          #define HAVE_ZLIB 1
          typedef struct VkXcbSurfaceCreateInfoKHR { uint32_t sType; const void* pNext; uint32_t flags; void* connection; uintptr_t window; } VkXcbSurfaceCreateInfoKHR;
          typedef struct VkXlibSurfaceCreateInfoKHR { uint32_t sType; const void* pNext; uint32_t flags; void* dpy; uintptr_t window; } VkXlibSurfaceCreateInfoKHR;
          void* adrenotools_open_libvulkan(const char* a, const char* s);
          #endif
          EOF

          # 2. Interceptor Pkg-config limpio
          echo -e '#!/bin/bash\nif [[ "$*" == *"--modversion"* ]]; then echo "14.0.0"; else echo "-I/tmp"; fi\nexit 0' > /tmp/fake-pkg-config
          chmod +x /tmp/fake-pkg-config

          # 3. Escribimos cross.txt con la receta híbrida multiarquitectura de Pipetto
          cat << EOF > /tmp/cross.txt
          [binaries]
          c='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang'
          cpp='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++'
          ar='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config='/tmp/fake-pkg-config'
          glslangValidator='/usr/bin/glslangValidator'
          [properties]
          sys_root='${SYSROOT_MAESTRO}'
          [built-in options]
          c_args=['-DHAVE_ANDROID_PLATFORM', '-DANDROID', '-DVK_USE_PLATFORM_ANDROID_KHR', '-DVK_EXPORT', '-include', '/tmp/vk_pc_stubs.h', '-DO_RDONLY=0', '-DO_RDWR=2', '-DO_CLOEXEC=02000000', '-fvisibility=default', '-D__ANDROID_VNDK__', '-D_FILE_OFFSET_BITS=64']
          cpp_args=['-DHAVE_ANDROID_PLATFORM', '-DANDROID', '-DVK_USE_PLATFORM_ANDROID_KHR', '-DVK_EXPORT', '-include', '/tmp/vk_pc_stubs.h', '-DO_RDONLY=0', '-DO_RDWR=2', '-DO_CLOEXEC=02000000', '-fvisibility=default', '-D__ANDROID_VNDK__', '-D_FILE_OFFSET_BITS=64']
          c_link_args=['-llog', '-landroid', '-ldl', '-Wl,--export-dynamic', '-Wl,--no-as-needed', '-L${LIB_64}']
          cpp_link_args=['-llog', '-landroid', '-ldl', '-Wl,--export-dynamic', '-Wl,--no-as-needed', '-L${LIB_64}', '-stdlib=libc++']
          [host_machine]
          system='linux'
          cpu_family='aarch64'
          cpu='armv8-a'
          endian='little'
          EOF

          cd wrapper_src
          rm -rf build || true

          # Puentes locales de cabeceras de Mesa
          echo -e '#ifndef LOCAL_ZSTD_H\n#define LOCAL_ZSTD_H\n#include "/tmp/vk_pc_stubs.h"\n#endif' > include/zstd.h
          echo -e '#ifndef LOCAL_ZLIB_H\n#define LOCAL_ZLIB_H\n#include "/tmp/vk_pc_stubs.h"\n#endif' > include/zlib.h
          echo -e '#ifndef LOCAL_XF86DRM_H\n#define LOCAL_XF86DRM_H\n#include "/tmp/vk_pc_stubs.h"\n#endif' > include/xf86drm.h

          find src/vulkan/wrapper/ -name "*.c" -o -name "*.h" -o -name "*.cpp" | while read -r archivo_c; do
            sed -i 's/vk_icdGetInstanceProcAddr/__attribute__((visibility("default"))) vk_icdGetInstanceProcAddr/g' "$archivo_c" || true
            sed -i 's/vk_icdNegotiateLoaderICDInterfaceVersion/__attribute__((visibility("default"))) vk_icdNegotiateLoaderICDInterfaceVersion/g' "$archivo_c" || true
          done

          # El desvío condicional de Pipetto para que el .so híbrido conmute de lib64 a lib al vuelo
          find . -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" \) | while read -r f; do
            sed -i 's/"libvulkan.so"/(sizeof(void*) == 8 ? "\/system\/lib64\/libvulkan.so" : "\/system\/lib\/libvulkan.so")/g' "$f" || true
            sed -i 's/"libvulkan.so.1"/(sizeof(void*) == 8 ? "\/system\/lib64\/libvulkan.so" : "\/system\/lib\/libvulkan.so")/g' "$f" || true
          done

          sed -i "s/gnu_symbol_visibility : 'hidden'/gnu_symbol_visibility : 'default'/g" meson.build || true
          sed -i 's/-fvisibility=hidden/-fvisibility=default/g' meson.build || true
          sed -i '1i glslang_quiet = []\nglslang_depfile = []' src/vulkan/wrapper/meson.build || true
          echo "" > src/vulkan/wsi/wsi_common_ahardware_buffer.c

          meson setup build --cross-file /tmp/cross.txt \
            -Dplatforms=android -Dplatform-sdk-version=26 -Dgallium-drivers=[] -Dvulkan-drivers=wrapper \
            -Ddraw-use-llvm=false -Dglvnd=disabled -Dllvm=disabled -Dshader-cache=disabled -Dvalgrind=disabled \
            -Dbuildtype=debugoptimized -Dstrip=false
          ninja -C build
          
          mkdir -p /tmp/out/usr/lib
          cp -f $(find build -name "libvulkan_wrapper.so" -o -name "*.so" | head -n 1) /tmp/out/usr/lib/libvulkan_wrapper.so
          cd -

      - name: 7. Estructurar Paquete Plano en Carpeta usr/lib/ Real
        run: |
          mkdir -p /tmp/out/usr/share/vulkan/icd.d
          chmod 755 /tmp/out/usr/lib/libvulkan_wrapper.so || true
          chmod +x /tmp/out/usr/lib/libvulkan_wrapper.so || true
          
          echo "===================================================="
          echo "EL PESO ACTUAL REAL DE TU DRIVER HÍBRIDO ES:"
          du -sh /tmp/out/usr/lib/libvulkan_wrapper.so
          echo "===================================================="

          cat << 'EOF' > /tmp/out/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          { "file_format_version": "1.0.0", "ICD": { "library_path": "libvulkan_wrapper.so", "api_version": "1.3.292" } }
          EOF
          
          # CORRECCIÓN DE SINTAXIS OFICIAL: Reemplazamos github.workspace con la variable de entorno completa
          cd /tmp/out && tar -p -cf - usr | zstd -19 > ${{ github.workspace }}/wrapper.tzst

      - name: 8. Subir wrapper.tzst Híbrido Unificado en lib/ de 9MB
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Leegao-Wrapper-Original-Unisoc
          path: ${{ github.workspace }}/wrapper.tzst
