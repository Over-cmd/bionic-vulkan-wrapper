name: Compilador wrapper.tzst NDK Dual
on: workflow_dispatch
jobs:
  build-mali:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Instalar Base y Descargar Codigo
        run: |
          sudo apt-get update && sudo apt-get install -y meson ninja-build git zstd tar pkg-config glslang-tools curl python3-mako
          pip3 install mako ply
      
      - name: 2. Checkout Repositorio Leegao
        uses: actions/checkout@v4
        with:
          repository: 'leegao/bionic-vulkan-wrapper'
          path: 'wrapper_src'
          fetch-depth: 1

      - name: 3. Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: 4. Instalar NDK de Fabrica
        run: ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      - name: 5. Inyectar Cabeceras e Infraestructura al NDK
        run: |
          INC="${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
          mkdir -p "$INC/libdrm" "$INC/log" "$INC/cutils" "$INC/hardware" "$INC/backtrace" /tmp/pkgconfig
          
          echo -e '#ifndef _Z\ntypedef unsigned char Byte;\ntypedef unsigned int uInt;\ntypedef unsigned long uLong;\ntypedef void *voidpf;\n#endif' > "$INC/zlib.h"
          echo -e '#ifndef _C\n#endif' | tee "$INC/zconf.h" "$INC/hardware/hardware.h" "$INC/libdrm/drm.h" > /dev/null
          echo -e '#ifndef _S\ntypedef size_t ZSTD_ErrorCode;\n#endif' > "$INC/zstd.h"
          
          cat << 'EOF' > "$INC/log/log.h"
          #ifndef _NDK_LOG_H
          #define _NDK_LOG_H
          #include <android/log.h>
          #define LOG_PRI(p,t,...) __android_log_print(p,t,__VA_ARGS__)
          #endif
          EOF

          cat << 'EOF' > "$INC/cutils/trace.h"
          #ifndef _NDK_TRACE_H
          #define _NDK_TRACE_H
          #include <stdint.h>
          #define ATRACE_TAG_GRAPHICS 0
          static inline void atrace_begin(uint64_t t, const char* n){}
          static inline void atrace_end(uint64_t t){}
          #endif
          EOF
          
          cat << 'EOF' > "$INC/cutils/native_handle.h"
          #ifndef _NDK_HANDLE_H
          #define _NDK_HANDLE_H
          typedef struct native_handle { int version; int numFds; int numInts; int data; } native_handle_t;
          #endif
          EOF

          cat << 'EOF' > "$INC/cutils/properties.h"
          #ifndef _CUTILS_PROPERTIES_H
          #define _CUTILS_PROPERTIES_H
          #define PROPERTY_KEY_MAX 32
          #define PROPERTY_VALUE_MAX 92
          static inline int property_get(const char* key, char *value, const char *default_value) {
              int i = 0;
              if (default_value) {
                  while (default_value[i] && i < PROPERTY_VALUE_MAX - 1) { value[i] = default_value[i]; i++; }
                  value[i] = '\0'; return i;
              }
              value = '\0'; return 0;
          }
          #endif
          EOF

          cat << 'EOF' > "$INC/backtrace/Backtrace.h"
          #ifndef _NDK_BACKTRACE_H
          #define _NDK_BACKTRACE_H
          #include <stdint.h>
          #include <sys/types.h>
          #include <string>
          #define BACKTRACE_CURRENT_PROCESS -1
          #define BACKTRACE_CURRENT_THREAD -2
          class FakeMap { public: std::string Name() const { return ""; } };
          typedef struct { uint64_t pc; uint64_t rel_pc; uint64_t func_offset; std::string func_name; FakeMap map; } backtrace_frame_data_t;
          class Backtrace { public: static Backtrace* Create(pid_t p, pid_t t) { return nullptr; } bool Unwind(size_t n) { return true; } const backtrace_frame_data_t* GetFrame(size_t i) { return nullptr; } virtual ~Backtrace() {} };
          #endif
          EOF

          cat << 'EOF' > "$INC/xf86drm.h"
          #ifndef _XF86DRM_H
          #define _XF86DRM_H
          #include <stdint.h>
          struct drm_gem_close { uint32_t handle; uint32_t pad; };
          #define DRM_IOCTL_GEM_CLOSE 0
          #define DRM_PRIME_CAP_IMPORT 1
          #define DRM_PRIME_CAP_EXPORT 2
          #define DRM_NODE_RENDER 0
          #define DRM_NODE_PRIMARY 1
          #define _IOWR(t,n,s) 0
          #define _IOW(t,n,s) 0
          typedef struct { uint32_t available_nodes; char **nodes; } drmDevice, *drmDevicePtr;
          static inline int drmIoctl(int f, unsigned long r, void *a) { return 0; }
          static inline int drmPrimeFDToHandle(int f, int p, uint32_t *h) { return 0; }
          static inline int drmGetDevice2(int f, uint32_t g, drmDevicePtr *d) { return -1; }
          static inline void drmFreeDevice(drmDevicePtr *d) {}
          static inline int drmDevicesEqual(drmDevicePtr a, drmDevicePtr b) { return 0; }
          static inline int drmGetDevices2(uint32_t f, drmDevicePtr d[], int m) { return 0; }
          #endif
          EOF

          for pc in cutils hardware log sync backtrace nativewindow libglvnd libclc libdrm libzstd dl zlib; do 
            echo -e "Name: $pc\nVersion: 1.0\nCflags: -I$INC\nLibs:" > /tmp/pkgconfig/$pc.pc
          done

          cat << 'EOF' > /tmp/fake-pkg-config
          #!/bash/bin
          if [[ "$*" == *"--modversion"* ]]; then echo "1.2.11"; else echo "-I${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"; fi
          exit 0
          EOF
          chmod +x /tmp/fake-pkg-config

          # FIJADO DEL ENLAZADOR TOTAL: Inyectamos el puntero ficticio de memoria _eglDriver=0 directo al linker de LLVM sin alterar ningun .c
          cat << EOF > /tmp/cross.txt
          [binaries]
          c='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang'
          cpp='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++'
          ar='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/bin/llvm-strip'
          pkg-config='/tmp/fake-pkg-config'
          glslangValidator='/usr/bin/glslangValidator'
          [built-in options]
          c_args=['-I$INC']
          cpp_args=['-I$INC']
          c_link_args=['-llog', '-Wl,--allow-shlib-undefined', '-Wl,--undefined-version', '-Wl,--defsym=_eglDriver=0']
          cpp_link_args=['-llog', '-Wl,--allow-shlib-undefined', '-Wl,--undefined-version', '-Wl,--defsym=_eglDriver=0']
          [host_machine]
          system='linux'
          cpu_family='aarch64'
          cpu='armv8-a'
          endian='little'
          EOF

      - name: 6. Compilar Codigo Completo con el NDK y Enrutador Unisoc T618
        run: |
          cd wrapper_src
          
          # PARCHE COMPACTO UNISOC: Forzamos al cargador dinámico del wrapper a escanear las rutas físicas reales de tu chip Mali-G52
          find . -type f \( -name "*.c" -o -name "*.h" \) | while read -r f; do
            if grep -q '"libvulkan.so"' "$f"; then
              sed -i 's/"libvulkan.so"/"libvulkan.so", "libvulkan.mali.so", "vulkan.mali.so", "\/vendor\/lib64\/egl\/libvulkan.mali.so"/g' "$f" || true
            fi
          done

          PKG_CONFIG_PATH="/tmp/pkgconfig" PKG_CONFIG_LIBDIR="/tmp/pkgconfig" meson setup build --cross-file /tmp/cross.txt -Dc_args='-DHAVE_ANDROID_PLATFORM' -Dcpp_args='-DHAVE_ANDROID_PLATFORM' -Dplatforms=android -Dplatform-sdk-version=26 -Dgallium-drivers=zink -Dgallium-vdpau=disabled -Dgallium-va=disabled -Dgallium-xa=disabled -Dgallium-opencl=disabled -Ddraw-use-llvm=false -Dglvnd=disabled -Dllvm=disabled -Dshader-cache=disabled -Dzstd=disabled -Dzlib=disabled -Dvalgrind=disabled -Dvulkan-drivers=[] -Dbuildtype=release -Dstrip=true
          ninja -C build
          cd -

      - name: 7. Estructurar y Crear wrapper.tzst
        run: |
          mkdir -p /tmp/out/usr/lib /tmp/out/usr/share/vulkan/icd.d
          cp -f $(find wrapper_src/build -name "libvulkan_wrapper.so" -o -name "*.so" | head -n 1) /tmp/out/usr/lib/libvulkan_wrapper.so || cp -f wrapper_src/build/src/vulkan/wrapper/libvulkan_wrapper.so /tmp/out/usr/lib/libvulkan_wrapper.so || true
          
          cat << 'EOF' > /tmp/out/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.1.149",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF
          
          cd /tmp/out && tar -cf - usr | zstd -19 > /tmp/wrapper.tzst

      - name: 8. Subir Artefacto Terminado
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Leegao-Wrapper-Original-Unisoc
          path: /tmp/wrapper.tzst
