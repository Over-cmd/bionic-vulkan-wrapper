name: Compilar Wrapper Winlator (Pipetto-Style)
on:
  workflow_dispatch:

jobs:
  build-arm-multilib:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Instalar Compiladores Cruzados ARM (32 y 64 bits)
        run: |
          sudo apt-get update
          # Instalamos compiladores reales para procesadores de teléfonos móviles
          sudo apt-get install -y \
            meson ninja-build zstd tar glslang-tools pkg-config \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi g++-arm-linux-gnueabi

      - name: Instalar Mako y Dependencias de Python
        run: |
          python3 -m pip install --break-system-packages mako packaging setuptools

      - name: Crear Stubs de Android (Engañar comprobaciones de cutils)
        run: |
          mkdir -p stub_libs/pkgconfig
          
          # Generamos archivos .pc falsos para que Meson asuma que cutils y hardware existen
          cat <<EOF > stub_libs/pkgconfig/cutils.pc
          Name: cutils
          Description: Android cutils stub
          Version: 1.0
          Libs:
          Cflags:
          EOF

          cp stub_libs/pkgconfig/cutils.pc stub_libs/pkgconfig/hardware.pc
          cp stub_libs/pkgconfig/cutils.pc stub_libs/pkgconfig/sync.pc

      - name: Configurar y Compilar Versión de 64 bits (ARM64 / aarch64)
        run: |
          # Corregimos 'pkgconfig' por 'pkg-config' en el archivo cross para quitar el Warning
          cat <<EOF > arm64_cross.txt
          [binaries]
          c = 'aarch64-linux-gnu-gcc'
          cpp = 'aarch64-linux-gnu-g++'
          ar = 'aarch64-linux-gnu-ar'
          strip = 'aarch64-linux-gnu-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

          export PKG_CONFIG_PATH=$PWD/stub_libs/pkgconfig
          
          # Eliminamos "-Dfreedreno-kmd" y configuramos el driver exclusivo "wrapper" de leegao
          meson setup build64 \
            --cross-file arm64_cross.txt \
            --buildtype=release \
            -Dplatforms=android \
            -Dplatform-sdk-version=33 \
            -Dgallium-drivers= \
            -Dvulkan-drivers=wrapper

          ninja -C build64

      - name: Configurar y Compilar Versión de 32 bits (ARM32 / armhf)
        run: |
          cat <<EOF > arm32_cross.txt
          [binaries]
          c = 'arm-linux-gnueabi-gcc'
          cpp = 'arm-linux-gnueabi-g++'
          ar = 'arm-linux-gnueabi-ar'
          strip = 'arm-linux-gnueabi-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'arm'
          cpu = 'armv7-a'
          endian = 'little'
          EOF

          export PKG_CONFIG_PATH=$PWD/stub_libs/pkgconfig

          meson setup build32 \
            --cross-file arm32_cross.txt \
            --buildtype=release \
            -Dplatforms=android \
            -Dplatform-sdk-version=33 \
            -Dgallium-drivers= \
            -Dvulkan-drivers=wrapper

          ninja -C build32

      - name: Preparar Estructura e Inyectar al wrapper.tzst
        run: |
          # Creamos la separación limpia de directorios de Winlator
          mkdir -p wrapper_output/lib64
          mkdir -p wrapper_output/lib

          # Buscamos y copiamos el archivo compilado final (ej: libvulkan_wrapper.so)
          find build64/ -name "*.so" -exec cp {} wrapper_output/lib64/ \;
          find build32/ -name "*.so" -exec cp {} wrapper_output/lib/ \;

          # Forzamos compresión Zstandard compatible con Winlator
          tar -I 'zstd -19' -cf wrapper.tzst -C wrapper_output .

      - name: Subir wrapper.tzst como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-wrapper-pipetto
          path: wrapper.tzst
