name: Compilar Wrapper Completo Original (Pipetto Trick)
on:
  workflow_dispatch:

jobs:
  build-fat-wrapper:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Descargar Codigo Principal
        uses: actions/checkout@v4

      - name: 2. Configurar Entorno Java para Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Android SDK y NDK Oficial
        uses: android-actions/setup-android@v3

      - name: 4. Instalar Herramientas de Compilacion de Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build zstd tar glslang-tools pkg-config llvm clang libclang-dev cmake

      - name: 5. Instalar Dependencias Python de Mesa
        run: python3 -m pip install --break-system-packages mako packaging setuptools

      - name: 6. Descargar y Compilar Dependencias Fisicas de SPIRV
        run: |
          # EL TRUCO DEFINITIVO: Purgamos cualquier configuracion corrupta de Git en el contenedor
          git config --global --unset-all url.https://github.com 2>/dev/null || true
          git config --global --unset-all url."git@github.com:".insteadof 2>/dev/null || true
          git config --system --unset-all url.https://github.com 2>/dev/null || true
          rm -rf ~/.gitconfig
          
          # Clonamos de forma limpia e independiente las herramientas oficiales estables
          rm -rf spirv_source
          git clone --depth=1 https://github.com spirv_source
          git clone --depth=1 https://github.com spirv_source/external/spirv-headers
          
          # Compilamos para 32 bits
          mkdir -p spirv_source/build_32 && cd spirv_source/build_32
          cmake .. -G Ninja -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release -DSPIRV_SKIP_TESTS=ON -DSPIRV_WERROR=OFF
          ninja
          mkdir -p $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/26
          cp source/opt/libSPIRV-Tools-opt.a $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/26/libSPIRV-Tools-opt.a
          cp source/libSPIRV-Tools.a $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/arm-linux-androideabi/26/libSPIRV-Tools.a
          
          # Compilamos para 64 bits
          cd ../..
          mkdir -p spirv_source/build_64 && cd spirv_source/build_64
          cmake .. -G Ninja -DCMAKE_TOOLCHAIN_FILE=$ANDROID_NDK_LATEST_HOME/build/cmake/android.toolchain.cmake -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release -DSPIRV_SKIP_TESTS=ON -DSPIRV_WERROR=OFF
          ninja
          mkdir -p $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/26
          cp source/opt/libSPIRV-Tools-opt.a $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/26/libSPIRV-Tools-opt.a
          cp source/libSPIRV-Tools.a $ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/26/libSPIRV-Tools.a
          cd ../..

      - name: 7. Generar Entorno de Cabeceras e Inyecciones
        run: |
          chmod +x crear_cabeceras.sh
          ./crear_cabeceras.sh
          chmod +x crear_stubs.sh
          ./crear_stubs.sh

      - name: 8. Ejecutar Compilacion Unificada de Mesa (Todo Instalado)
        run: |
          chmod +x build_mesa.sh
          ./build_mesa.sh

      - name: 9. Empaquetar el UNICO libvulkan_wrapper.so Universal en wrapper.tzst
        run: |
          mkdir -p wrapper_output
          cp build64/src/vulkan/wrapper/libvulkan_wrapper.so wrapper_output/libvulkan_wrapper.so
          ls -la wrapper_output/
          tar -I 'zstd -19' -cf wrapper.tzst -C wrapper_output libvulkan_wrapper.so

      - name: 10. Subir wrapper.tzst como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: bionic-vulkan-wrapper-universal
          path: wrapper.tzst
