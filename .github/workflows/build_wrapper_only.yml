name: Compilador wrapper.tzst NDK Híbrido Oficial Real
on: workflow_dispatch
jobs:
  build-mali:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Instalar Herramientas Base
        run: |
          sudo apt-get update && sudo apt-get install -y meson ninja-build git zstd tar pkg-config glslang-tools python3-mako cmake
          pip3 install mako ply

      - name: 2. Descargar Código de Leegao Original
        uses: actions/checkout@v4
        with:
          repository: 'leegao/bionic-vulkan-wrapper'
          path: 'wrapper_src'
          fetch-depth: 1

      - name: 3. Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: 4. Instalar NDK de Fábrica
        run: ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      - name: 5. Descargar y Compilar SPIRV-Tools Real de Khronos (Otorga el Peso Oficial)
        run: |
          INC="${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"
          LIB_64="${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/lib/aarch64-linux-android/26"
          
          # Clonamos el código oficial de optimización de Shaders de Khronos
          git clone --depth=1 https://github.com spirv-tools
          git clone --depth=1 https://github.com spirv-tools/external/spirv-headers
          
          # Lo compilamos de forma legítima para arquitectura ARM64 usando CMake y el NDK de Android
          cd spirv-tools
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=${ANDROID_SDK_ROOT}/ndk/25.2.9519653/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DSPIRV_SKIP_TESTS=ON \
                -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          
          # Instalamos las librerías físicas reales y pesadas en los directorios del NDK
          cp source/libSPIRV-Tools.a "$LIB_64/"
          cp source/opt/libSPIRV-Tools-opt.a "$LIB_64/"
          cd ../../

          # Inyectamos las cabeceras comunes biónicas obligatorias
          mkdir -p "$INC/bits"
          echo -e '#ifndef _BITS_PTHREADTYPES_H\n#define _BITS_PTHREADTYPES_H\n#endif' > "$INC/bits/pthreadtypes.h"
          echo -e '#ifndef ZSTD_H\n#define ZSTD_H\n#endif' > "$INC/zstd.h"
          echo -e '#ifndef ZLIB_H\n#define ZLIB_H\n#endif' > "$INC/zlib.h"
          echo -e '#ifndef ZCONF_H\n#define ZCONF_H\n#endif' > "$INC/zconf.h"

          # Fabricamos el vk_pc_stubs.h maestro con las llamadas de libdrm sincronizadas
          cat << 'EOF' > /tmp/vk_pc_stubs.h
          #ifndef _VK_PC_STUBS_H
          #define _VK_PC_STUBS_H
          #include <stdint.h>
          #include <stddef.h>
          int open(const char *pathname, int flags, ...);
          typedef struct VkXcbSurfaceCreateInfoKHR { uint32_t sType; const void* pNext; uint32_t flags; void* connection; uintptr_t window; } VkXcbSurfaceCreateInfoKHR;
          typedef struct VkXlibSurfaceCreateInfoKHR { uint32_t sType; const void* pNext; uint32_t flags; void* dpy; uintptr_t window; } VkXlibSurfaceCreateInfoKHR;
          void* adrenotools_open_libvulkan(const char* a, const char* s);
          #endif
          EOF

          # Esqueleto de soporte para adrenotools externo
          echo -e '#include <stddef.h>\nextern "C" void* adrenotools_open_libvulkan(const char* a, const char* s){return nullptr;}' > /tmp/adreno.cpp
          ${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++ -shared -fPIC /tmp/adreno.cpp -o /tmp/libadrenotools.so

          echo -e '#!/bin/bash\nif [[ "$*" == *"--modversion"* ]]; then echo "14.0.0"; else echo "-I/tmp"; fi\nexit 0' > /tmp/fake-pkg-config
          chmod +x /tmp/fake-pkg-config

          # Escribimos el cross-file final de Meson para ARM64
          cat << EOF > /tmp/cross.txt
          [binaries]
          c='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang'
          cpp='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++'
          ar='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config='/tmp/fake-pkg-config'
          glslangValidator='/usr/bin/glslangValidator'
          [built-in options]
          c_args=['-DHAVE_ANDROID_PLATFORM', '-DANDROID', '-DVK_USE_PLATFORM_ANDROID_KHR', '-DVK_EXPORT', '-include', '/tmp/vk_pc_stubs.h', '-DO_RDONLY=0', '-DO_RDWR=2', '-DO_CLOEXEC=02000000', '-fvisibility=default']
          cpp_args=['-DHAVE_ANDROID_PLATFORM', '-DANDROID', '-DVK_USE_PLATFORM_ANDROID_KHR', '-DVK_EXPORT', '-include', '/tmp/vk_pc_stubs.h', '-DO_RDONLY=0', '-DO_RDWR=2', '-DO_CLOEXEC=02000000', '-fvisibility=default']
          c_link_args=['-llog', '-landroid', '-ldl', '-L/tmp', '-ladrenotools', '-Wl,--export-dynamic']
          cpp_link_args=['-llog', '-landroid', '-ldl', '-L/tmp', '-ladrenotools', '-Wl,--export-dynamic']
          [host_machine]
          system='linux' ; cpu_family='aarch64' ; cpu='armv8-a' ; endian='little'
          EOF

      - name: 6. Compilación Limpia del Driver Real de Leegao (Mesa Original)
        run: |
          cd wrapper_src
          rm -rf build || true

          echo -e '#ifndef LOCAL_ZSTD_H\n#define LOCAL_ZSTD_H\n#endif' > include/zstd.h
          echo -e '#ifndef LOCAL_ZLIB_H\n#define LOCAL_ZLIB_H\n#endif' > include/zlib.h

          find . -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" \) | while read -r f; do
            if grep -q '"libvulkan.so"' "$f"; then
              sed -i 's/"libvulkan.so"/(sizeof(void*) == 8 ? "\/system\/lib64\/libvulkan.so" : "\/system\/lib\/libvulkan.so")/g' "$f" || true
            fi
          done

          sed -i '1i glslang_quiet = []\nglslang_depfile = []' src/vulkan/wrapper/meson.build || true
          echo "" > src/vulkan/wsi/wsi_common_ahardware_buffer.c

          meson setup build --cross-file /tmp/cross.txt \
            -Dplatforms=android -Dplatform-sdk-version=26 -Dgallium-drivers=[] -Dvulkan-drivers=wrapper \
            -Dgallium-vdpau=disabled -Dgallium-va=disabled -Dgallium-xa=disabled -Dgallium-opencl=disabled \
            -Ddraw-use-llvm=false -Dglvnd=disabled -Dllvm=disabled -Dshader-cache=disabled -Dvalgrind=disabled \
            -Dbuildtype=release -Dstrip=true
          ninja -C build
          cd -

      - name: 7. Estructurar Carpeta Única /usr/lib e Imprimir Peso de Verificación
        run: |
          mkdir -p /tmp/out/usr/lib /tmp/out/usr/share/vulkan/icd.d
          SO_MASTER=$(find wrapper_src/build -name "libvulkan_wrapper.so" -o -name "*.so" | head -n 1)
          cp -f "$SO_MASTER" /tmp/out/usr/lib/libvulkan_wrapper.so || true
          
          echo "===================================================="
          echo "EL PESO ACTUAL REAL DE TU DRIVER ES:"
          du -sh /tmp/out/usr/lib/libvulkan_wrapper.so
          echo "===================================================="

          cat << 'EOF' > /tmp/out/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          { "ICD": { "api_version": "1.1.149", "library_path": "libvulkan_wrapper.so" }, "file_format_version": "1.0.0" }
          EOF
          
          cd /tmp/out && tar -cf - usr | zstd -19 > ${{ github.workspace }}/wrapper.tzst

      - name: 8. Subir wrapper.tzst Original Puro y Pesado
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Leegao-Wrapper-Original-Unisoc
          path: ${{ github.workspace }}/wrapper.tzst
