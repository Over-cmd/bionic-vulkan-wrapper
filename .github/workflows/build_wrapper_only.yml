name: Compilar Wrapper (32 & 64 bits)
on:
  workflow_dispatch:

jobs:
  build-multilib:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Habilitar Arquitectura i386 e Instalar Herramientas Multilib
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          
          # Instalamos herramientas mínimas y las librerías de desarrollo Vulkan esenciales
          sudo apt-get install -y \
            meson ninja-build zstd tar glslang-tools pkg-config \
            gcc-multilib g++-multilib \
            libvulkan-dev libvulkan-dev:i386

      - name: Instalar Mako y Dependencias de Python
        run: |
          python3 -m pip install --break-system-packages mako packaging setuptools

      - name: Configurar y Compilar Versión de 64 bits
        run: |
          # Cambiamos "-Dplatforms=x11" por "surfaceless" para omitir por completo XCB, DRM y Wayland
          meson setup build64 \
            --buildtype=release \
            -Dplatforms=surfaceless \
            -Dgallium-drivers= \
            -Dvulkan-drivers= \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Degl=disabled \
            -Dgles1=disabled \
            -Dgles2=disabled
          
          ninja -C build64

      - name: Configurar y Compilar Versión de 32 bits
        run: |
          # Archivo de entorno nativo para obligar a Meson a compilar en 32 bits (-m32)
          cat <<EOF > x86_32_cross.txt
          [binaries]
          c = ['gcc', '-m32']
          cpp = ['g++', '-m32']
          pkgconfig = 'pkg-config'

          [host_machine]
          system = 'linux'
          cpu_family = 'x86'
          cpu = 'i686'
          endian = 'little'
          EOF

          # Configuramos la compilación de 32 bits usando también la plataforma libre de dependencias visuales
          export PKG_CONFIG_PATH=/usr/lib/i386-linux-gnu/pkgconfig
          meson setup build32 \
            --cross-file x86_32_cross.txt \
            --buildtype=release \
            -Dplatforms=surfaceless \
            -Dgallium-drivers= \
            -Dvulkan-drivers= \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Degl=disabled \
            -Dgles1=disabled \
            -Dgles2=disabled

          ninja -C build32

      - name: Preparar y Estructurar el Contenedor para Winlator
        run: |
          # Organizamos la estructura de salida para los juegos de 32 y 64 bits
          mkdir -p wrapper_output/lib64
          mkdir -p wrapper_output/lib32

          # Copiamos todos los binarios .so encontrados en los directorios de compilación
          find build64/ -name "*.so" -exec cp {} wrapper_output/lib64/ \;
          find build32/ -name "*.so" -exec cp {} wrapper_output/lib32/ \;

      - name: Empaquetar en wrapper.tzst (Zstandard)
        run: |
          tar -I 'zstd -19' -cf wrapper.tzst -C wrapper_output .

      - name: Subir wrapper.tzst como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-wrapper-32-64bit
          path: wrapper.tzst
