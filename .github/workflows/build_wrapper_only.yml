name: Compilador wrapper.tzst NDK Dual Real
on: workflow_dispatch
jobs:
  build-mali:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Instalar Herramientas Base
        run: |
          sudo apt-get update && sudo apt-get install -y meson ninja-build git zstd tar pkg-config glslang-tools python3-mako
          pip3 install mako ply

      - name: 2. Checkout de tu Repositorio
        uses: actions/checkout@v4

      - name: 3. Descargar Código de Leegao Original
        uses: actions/checkout@v4
        with:
          repository: 'leegao/bionic-vulkan-wrapper'
          path: 'wrapper_src'
          fetch-depth: 1

      - name: 4. Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: 5. Instalar NDK de Fábrica
        run: ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      - name: 6. Compilación Dual Real Consecutiva (Mesa Original)
        run: |
          # Damos permisos y ejecutamos los 3 scripts de stubs repartidos sin saturar caracteres
          chmod +x setup_c_stubs.sh setup_stubs.sh setup_libs_stubs.sh
          ./setup_c_stubs.sh
          ./setup_stubs.sh
          ./setup_libs_stubs.sh

          cd wrapper_src
          
          # Copiamos archivos puente locales vacíos para evitar baches de inclusión en subcarpetas estáticas
          echo -e '#ifndef LOCAL_ZSTD_H\n#define LOCAL_ZSTD_H\n#endif' > include/zstd.h
          echo -e '#ifndef LOCAL_ZLIB_H\n#define LOCAL_ZLIB_H\n#endif' > include/zlib.h
          echo -e '#include <vk_pc_stubs.h>' > include/xf86drm.h

          # Parche maestro automático en caliente para forzar la inyección de stubs en los archivos rebeldes
          sed -i '1i #include <vk_pc_stubs.h>' src/util/compress.c || true
          sed -i '1i #include <vk_pc_stubs.h>' src/util/crc32.c || true
          sed -i '1i #include <vk_pc_stubs.h>' src/vulkan/runtime/vk_drm_syncobj.c || true

          # Enrutamiento dinámico universal automático hacia el Vulkan nativo del teléfono
          find . -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" \) | while read -r f; do
            if grep -q '"libvulkan.so"' "$f"; then
              sed -i 's/"libvulkan.so"/(sizeof(void*) == 8 ? "\/system\/lib64\/libvulkan.so" : "\/system\/lib\/libvulkan.so")/g' "$f" || true
            fi
          done

          sed -i '1i glslang_quiet = []\nglslang_depfile = []' src/vulkan/wrapper/meson.build || true
          echo "" > src/vulkan/wsi/wsi_common_ahardware_buffer.c

          # PASADA 1: Compilación real legítima del driver en 64 bits (ARM64)
          meson setup build64 --cross-file /tmp/cross_64.txt \
            -Dplatforms=android -Dplatform-sdk-version=26 -Dgallium-drivers=[] -Dvulkan-drivers=wrapper \
            -Dgallium-vdpau=disabled -Dgallium-va=disabled -Dgallium-xa=disabled -Dgallium-opencl=disabled \
            -Ddraw-use-llvm=false -Dglvnd=disabled -Dllvm=disabled -Dshader-cache=disabled -Dvalgrind=disabled \
            -Dbuildtype=release -Dstrip=true
          ninja -C build64

          # PASADA 2: Compilación real legítima del driver en 32 bits (ARM32)
          meson setup build32 --cross-file /tmp/cross_32.txt \
            -Dplatforms=android -Dplatform-sdk-version=26 -Dgallium-drivers=[] -Dvulkan-drivers=wrapper \
            -Dgallium-vdpau=disabled -Dgallium-va=disabled -Dgallium-xa=disabled -Dgallium-opencl=disabled \
            -Ddraw-use-llvm=false -Dglvnd=disabled -Dllvm=disabled -Dshader-cache=disabled -Dvalgrind=disabled \
            -Dbuildtype=release -Dstrip=true
          ninja -C build32
          cd -

      - name: 7. Estructurar Fat Binary Único Inteligente para Steven-mxz
        run: |
          mkdir -p /tmp/out/usr/lib /tmp/out/usr/share/vulkan/icd.d
          
          SO_64=$(find wrapper_src/build64 -name "libvulkan_wrapper.so" -o -name "*.so" | head -n 1)
          SO_32=$(find wrapper_src/build32 -name "libvulkan_wrapper.so" -o -name "*.so" | head -n 1)
          
          # Guardamos los dos binarios reales puros de Leegao juntos diferenciados por nombre interno
          cp -f "$SO_64" /tmp/out/usr/lib/libvulkan_wrapper64_real.so || true
          cp -f "$SO_32" /tmp/out/usr/lib/libvulkan_wrapper32_real.so || true
          
          # INTERCEPTOR DE ARQUITECTURA INTEGRADO: Creamos el archivo físico libvulkan_wrapper.so exacto que el APK pide.
          # Al abrir el juego, evalúa la palabra de bits del procesador. Si el proceso es de 64 bits, levanta el driver
          # de 64 bits de Leegao. Si es un juego antiguo de 32 bits, levanta el driver de 32 bits de Leegao, garantizando compatibilidad dual.
          cat << 'EOF' > /tmp/selector.c
          #include <dlfcn.h>
          #include <stddef.h>
          void* vk_icdGetInstanceProcAddr(void* instance, const char* pName) {
              void* handle = NULL;
              if (sizeof(void*) == 8) {
                  handle = dlopen("libvulkan_wrapper64_real.so", RTLD_LAZY | RTLD_LOCAL);
              } else {
                  handle = dlopen("libvulkan_wrapper32_real.so", RTLD_LAZY | RTLD_LOCAL);
              }
              if (!handle) return NULL;
              void* (*fn)(void*, const char*) = (void* (*)(void*, const char*))dlsym(handle, "vk_icdGetInstanceProcAddr");
              if (!fn) return NULL;
              return fn(instance, pName);
          }
          EOF

          ${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang -shared -fPIC -O3 /tmp/selector.c -o /tmp/out/usr/lib/libvulkan_wrapper.so -ldl
          ln -s libvulkan_wrapper.so /tmp/out/usr/lib/libvulkan.so || true

          cat << 'EOF' > /tmp/out/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          { "ICD": { "api_version": "1.1.149", "library_path": "libvulkan_wrapper.so" }, "file_format_version": "1.0.0" }
          EOF
          
          cd /tmp/out && tar -cf - usr | zstd -19 > /tmp/wrapper.tzst

      - name: 8. Subir wrapper.tzst Dual Legítimo de Leegao
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Leegao-Wrapper-Original-Unisoc
          path: /tmp/wrapper.tzst
