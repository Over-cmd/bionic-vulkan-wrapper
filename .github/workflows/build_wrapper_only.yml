name: Compilar Wrapper Oficial Termux-Packages
on:
  workflow_dispatch:

jobs:
  build-termux-wrapper:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Instalar Dependencias del Entorno Termux
        run: |
          sudo apt-get update
          # Instalamos las herramientas necesarias para correr los entornos de empaquetado de Termux
          sudo apt-get install -y \
            bash curl git python3 zstd tar jq ... python3-pip

      - name: Configurar e Iniciar Compilación Oficial de leegao
        run: |
          # Damos permisos de ejecución a los scripts oficiales del repositorio
          chmod +x *.sh scripts/*.sh
          
          # Ejecutamos el script oficial del autor para compilar el paquete del wrapper.
          # Este script se encarga de descargar el NDK correcto, aplicar los parches (ndk-patches),
          # compilar mesa_bionic y generar las librerías libvulkan_wrapper.so para ambas arquitecturas.
          ./build-package.sh -a aarch64 wrapper
          ./build-package.sh -a arm wrapper

      - name: Aplicar el Truco de Pipetto para Steven MXZ (Estructura Multilib)
        run: |
          # Creamos las carpetas con la estructura exacta que leen Winlator Steven MXZ y Ludashi
          mkdir -p wrapper_output/lib64
          mkdir -p wrapper_output/lib

          # Los scripts de termux-packages guardan los resultados en carpetas temporales o de salida (ej: debs o debs/output)
          # Buscamos de forma inteligente el archivo libvulkan_wrapper.so en los directorios de compilación correspondientes
          # Nota: Ajustamos el origen según dónde los scripts de termux depositan las librerías finales compiladas.
          find output/aarch64/ -name "libvulkan_wrapper.so" -exec cp {} wrapper_output/lib64/ \; 2>/dev/null || \
          find tmp/ -name "*aarch64*libvulkan_wrapper.so" -exec cp {} wrapper_output/lib64/ \; 2>/dev/null || \
          find . -path "*/wrapper/*64*" -name "libvulkan_wrapper.so" -exec cp {} wrapper_output/lib64/ \;

          find output/arm/ -name "libvulkan_wrapper.so" -exec cp {} wrapper_output/lib/ \; 2>/dev/null || \
          find tmp/ -name "*arm*libvulkan_wrapper.so" -exec cp {} wrapper_output/lib/ \; 2>/dev/null || \
          find . -path "*/wrapper/*32*" -name "libvulkan_wrapper.so" -exec cp {} wrapper_output/lib/ \;

          # Si el script generó el archivo de forma nativa mediante "wrapper.sh", lo extraemos directamente
          if [ -d "tmp_runtime" ]; then
            find tmp_runtime/ -name "libvulkan_wrapper.so" -path "*/lib64/*" -exec cp {} wrapper_output/lib64/ \;
            find tmp_runtime/ -name "libvulkan_wrapper.so" -path "*/lib/*" -exec cp {} wrapper_output/lib/ \;
          fi

          # Empaquetamos todo en el formato .tzst que requiere tu emulador
          tar -I 'zstd -19' -cf wrapper.tzst -C wrapper_output .

      - name: Subir wrapper.tzst como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: bionic-vulkan-wrapper-termux
          path: wrapper.tzst
