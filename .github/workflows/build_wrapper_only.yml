name: Compilar Wrapper Oficial Termux-Packages
on:
  workflow_dispatch:

jobs:
  build-termux-wrapper:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Instalar Dependencias del Entorno Termux (Corregido)
        run: |
          sudo apt-get update
          # Instalamos solo las herramientas base necesarias para los scripts de Termux sin romper APT
          sudo apt-get install -y \
            bash curl git python3 zstd tar jq cmake coreutils findutils pip

      - name: Configurar e Iniciar Compilación Oficial de leegao
        run: |
          # Otorgamos permisos de ejecución a los scripts del repositorio
          chmod +x *.sh scripts/*.sh
          
          # Ejecutamos el entorno oficial de leegao para compilar ambas arquitecturas móviles
          ./build-package.sh -a aarch64 wrapper
          ./build-package.sh -a arm wrapper

      - name: Aplicar el Truco de Pipetto para Steven MXZ (Estructura Multilib)
        run: |
          # Creamos la estructura exacta que leen Winlator Steven MXZ, Ludashi y contenedores Bionic
          mkdir -p wrapper_output/lib64
          mkdir -p wrapper_output/lib

          # Buscamos de forma inteligente las librerías construidas en los directorios de Termux
          find output/aarch64/ -name "libvulkan_wrapper.so" -exec cp {} wrapper_output/lib64/ \; 2>/dev/null || \
          find tmp/ -name "*aarch64*libvulkan_wrapper.so" -exec cp {} wrapper_output/lib64/ \; 2>/dev/null || \
          find . -path "*/wrapper/*64*" -name "libvulkan_wrapper.so" -exec cp {} wrapper_output/lib64/ \; 2>/dev/null

          find output/arm/ -name "libvulkan_wrapper.so" -exec cp {} wrapper_output/lib/ \; 2>/dev/null || \
          find tmp/ -name "*arm*libvulkan_wrapper.so" -exec cp {} wrapper_output/lib/ \; 2>/dev/null || \
          find . -path "*/wrapper/*32*" -name "libvulkan_wrapper.so" -exec cp {} wrapper_output/lib/ \; 2>/dev/null

          # Si el repositorio generó el entorno en caliente con wrapper.sh, recolectamos el runtime
          if [ -d "tmp_runtime" ]; then
            find tmp_runtime/ -name "libvulkan_wrapper.so" -path "*/lib64/*" -exec cp {} wrapper_output/lib64/ \; 2>/dev/null
            find tmp_runtime/ -name "libvulkan_wrapper.so" -path "*/lib/*" -exec cp {} wrapper_output/lib/ \; 2>/dev/null
          fi

          # Empaquetamos todo con el algoritmo de compresión zstd solicitado
          tar -I 'zstd -19' -cf wrapper.tzst -C wrapper_output .

      - name: Subir wrapper.tzst como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: bionic-vulkan-wrapper-termux
          path: wrapper.tzst
