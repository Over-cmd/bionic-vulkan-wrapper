name: Compilar Wrapper Winlator (Pipetto-Style)
on:
  workflow_dispatch:

jobs:
  build-arm-multilib:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Instalar Compiladores Cruzados ARM (32 y 64 bits)
        run: |
          sudo apt-get update
          # Necesitamos los compiladores cruzados reales para procesadores de teléfonos (ARM)
          sudo apt-get install -y \
            meson ninja-build zstd tar glslang-tools pkg-config \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi g++-arm-linux-gnueabi

      - name: Instalar Mako y Dependencias de Python
        run: |
          python3 -m pip install --break-system-packages mako packaging setuptools

      - name: Crear Stubs de Android (Ignorar cutils y dependencias de Google)
        run: |
          # Creamos un directorio local de simulación para engañar a Meson
          mkdir -p stub_libs/pkgconfig
          
          # Generamos archivos .pc falsos para que simulen que cutils existe en el sistema
          cat <<EOF > stub_libs/pkgconfig/cutils.pc
          Name: cutils
          Description: Android cutils stub
          Version: 1.0
          Libs:
          Cflags:
          EOF

          # Hacemos lo mismo para otras dependencias nativas que pide Mesa bajo la bandera de Android
          cp stub_libs/pkgconfig/cutils.pc stub_libs/pkgconfig/hardware.pc
          cp stub_libs/pkgconfig/cutils.pc stub_libs/pkgconfig/sync.pc

      - name: Configurar y Compilar Versión de 64 bits (ARM64 / aarch64)
        run: |
          # Archivo de compilación cruzada para teléfonos de 64 bits
          cat <<EOF > arm64_cross.txt
          [binaries]
          c = 'aarch64-linux-gnu-gcc'
          cpp = 'aarch64-linux-gnu-g++'
          ar = 'aarch64-linux-gnu-ar'
          strip = 'aarch64-linux-gnu-strip'
          pkgconfig = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

          # Agregamos nuestros stubs al PATH de pkg-config para que encuentre "cutils"
          export PKG_CONFIG_PATH=$PWD/stub_libs/pkgconfig
          
          # Activamos de forma obligatoria la plataforma de Android para el WSI de Winlator
          meson setup build64 \
            --cross-file arm64_cross.txt \
            --buildtype=release \
            -Dplatforms=android \
            -Dplatform-sdk-version=33 \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmd=msm

          ninja -C build64

      - name: Configurar y Compilar Versión de 32 bits (ARM32 / armhf)
        run: |
          # Archivo de compilación cruzada para juegos de 32 bits en teléfonos móviles
          cat <<EOF > arm32_cross.txt
          [binaries]
          c = 'arm-linux-gnueabi-gcc'
          cpp = 'arm-linux-gnueabi-g++'
          ar = 'arm-linux-gnueabi-ar'
          strip = 'arm-linux-gnueabi-strip'
          pkgconfig = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'arm'
          cpu = 'armv7-a'
          endian = 'little'
          EOF

          export PKG_CONFIG_PATH=$PWD/stub_libs/pkgconfig

          meson setup build32 \
            --cross-file arm32_cross.txt \
            --buildtype=release \
            -Dplatforms=android \
            -Dplatform-sdk-version=33 \
            -Dgallium-drivers= \
            -Dvulkan-drivers=freedreno \
            -Dfreedreno-kmd=msm

          ninja -C build32

      - name: Preparar Estructura e Inyectar al wrapper.tzst
        run: |
          # Estructura de librerías ARM requeridas por el Content Manager de Winlator
          mkdir -p wrapper_output/lib64
          mkdir -p wrapper_output/lib

          # Buscamos e inyectamos los drivers resultantes (ej. libvulkan_freedreno.so / turnip)
          find build64/ -name "*.so" -exec cp {} wrapper_output/lib64/ \;
          find build32/ -name "*.so" -exec cp {} wrapper_output/lib/ \;

          # Empaquetamos todo con compresión Zstandard compatible con Winlator
          tar -I 'zstd -19' -cf wrapper.tzst -C wrapper_output .

      - name: Subir wrapper.tzst como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: turnip-wrapper-pipetto
          path: wrapper.tzst
