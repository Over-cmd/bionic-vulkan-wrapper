name: Compilar Wrapper (32 & 64 bits)
on:
  workflow_dispatch:

jobs:
  build-multilib:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Habilitar Arquitectura i386 e Instalar Herramientas Multilib
        run: |
          # Habilitamos paquetes de 32 bits (i386) en Ubuntu para poder descargar dependencias de desarrollo de 32 bits
          sudo dpkg --add-architecture i386
          sudo apt-get update
          
          # Instalamos herramientas de compilación y compiladores multilib
          sudo apt-get install -y \
            meson ninja-build zstd tar glslang-tools pkg-config \
            gcc-multilib g++-multilib \
            libvulkan-dev libvulkan-dev:i386

      - name: Instalar Mako y Dependencias de Python requeridas por Mesa
        run: |
          # Instalamos el módulo mako y sus complementos necesarios usando pip en el entorno virtual o global
          python3 -m pip install --break-system-packages mako packaging setuptools

      - name: Configurar y Compilar Versión de 64 bits
        run: |
          # Configuramos la compilación limpia de 64 bits en la carpeta 'build64'
          meson setup build64 \
            --buildtype=release \
            -Dplatforms=x11 \
            -Dgallium-drivers= \
            -Dvulkan-drivers= \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Degl=disabled \
            -Dgles1=disabled \
            -Dgles2=disabled
          
          ninja -C build64

      - name: Configurar y Compilar Versión de 32 bits
        run: |
          # Creamos un archivo de entorno nativo para obligar a Meson a compilar en 32 bits (-m32)
          cat <<EOF > x86_32_cross.txt
          [binaries]
          c = ['gcc', '-m32']
          cpp = ['g++', '-m32']
          pkgconfig = 'pkg-config'

          [host_machine]
          system = 'linux'
          cpu_family = 'x86'
          cpu = 'i686'
          endian = 'little'
          EOF

          # Configuramos la compilación en la carpeta 'build32' usando las dependencias de 32 bits
          export PKG_CONFIG_PATH=/usr/lib/i386-linux-gnu/pkgconfig
          meson setup build32 \
            --cross-file x86_32_cross.txt \
            --buildtype=release \
            -Dplatforms=x11 \
            -Dgallium-drivers= \
            -Dvulkan-drivers= \
            -Dglx=disabled \
            -Dgbm=disabled \
            -Degl=disabled \
            -Dgles1=disabled \
            -Dgles2=disabled

          ninja -C build32

      - name: Preparar y Estructurar el Contenedor para Winlator
        run: |
          # Creamos la estructura organizada para Winlator
          mkdir -p wrapper_output/lib64
          mkdir -p wrapper_output/lib32

          # Copiamos todos los binarios .so encontrados en ambas compilaciones
          find build64/ -name "*.so" -exec cp {} wrapper_output/lib64/ \;
          find build32/ -name "*.so" -exec cp {} wrapper_output/lib32/ \;

      - name: Empaquetar en wrapper.tzst (Zstandard)
        run: |
          tar -I 'zstd -19' -cf wrapper.tzst -C wrapper_output .

      - name: Subir wrapper.tzst como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: vulkan-wrapper-32-64bit
          path: wrapper.tzst
