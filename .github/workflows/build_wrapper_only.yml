name: Compilar Wrapper Completo Original (Pipetto Trick)
on:
  workflow_dispatch:

jobs:
  build-universal:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout del código original completo
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Java para el Entorno Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar Android SDK y NDK oficial (Sin virtualizar)
        uses: android-actions/setup-android@v3
        # Esto nos da acceso a libcutils, libdrm, libhardware y sync reales de Android

      - name: Instalar Herramientas del Sistema de Ubuntu
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build zstd tar glslang-tools pkg-config cmake

      - name: Instalar dependencias de Python requeridas por Mesa
        run: |
          python3 -m pip install --break-system-packages mako packaging setuptools

      - name: Descargar y compilar fuentes reales de SPIRV-Tools
        run: |
          rm -rf SPIRV-Tools
          git clone https://github.com SPIRV-Tools
          cd SPIRV-Tools
          git checkout 80627fe 2>/dev/null || true
          python3 utils/git-sync-deps.py
          
          # Compilamos SPIRV-Tools real para ARM64 usando el toolchain oficial del NDK
          NDK_PATH=$ANDROID_NDK_LATEST_HOME
          mkdir -p build_arm64 && cd build_arm64
          cmake .. -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE=$NDK_PATH/build/cmake/android.toolchain.cmake \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-25 \
            -DCMAKE_BUILD_TYPE=Release \
            -DSPIRV_SKIP_TESTS=ON \
            -DSPIRV_WERROR=OFF
          ninja
          cd ../..

      - name: COMPILACIÓN MONOLÍTICA ORIGINAL DE LEEGAO
        run: |
          NDK_PATH=$ANDROID_NDK_LATEST_HOME
          
          # Creamos el cross-file original vinculando los compiladores Clang nativos del NDK
          cat <<EOF > arm64_biarch_cross.txt
          [binaries]
          c = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android25-clang'
          cpp = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android25-clang++'
          ar = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip = '$NDK_PATH/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config = 'pkg-config'

          [host_machine]
          system = 'android'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

          # TRUCO DE PIPETTO: Pasamos las variables para unificar las dos arquitecturas en un solo .so
          # Las banderas -Wl,-q y -Wl,--eh-frame-hdr mantienen vivos los mapas de símbolos híbridos
          export LDFLAGS="-L$PWD/SPIRV-Tools/build_arm64/source -L$PWD/SPIRV-Tools/build_arm64/source/opt -Wl,-q -Wl,--eh-frame-hdr"
          export CXXFLAGS="-I$PWD/SPIRV-Tools/include -I$PWD/SPIRV-Tools/source"

          # Configuración 100% original. Compila todo el árbol sin deshabilitar opciones nativas
          meson setup build_universal \
            --cross-file arm64_biarch_cross.txt \
            --buildtype=release \
            -Dplatforms=android \
            -Dplatform-sdk-version=25 \
            -Dvulkan-drivers=wrapper

          ninja -C build_universal

      - name: Empaquetar el único libvulkan_wrapper.so (Formato Steven MXZ)
        run: |
          mkdir -p wrapper_output
          
          # Recolectamos el archivo binario universal que genera la compilación completa de leegao
          find build_universal/ -name "libvulkan_wrapper.so" -exec cp {} wrapper_output/ \;
          
          # Lo empaquetamos suelto en la raíz del .tzst, tal y como lo exige Steven MXZ
          tar -I 'zstd -19' -cf wrapper.tzst -C wrapper_output libvulkan_wrapper.so

      - name: Subir wrapper.tzst como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: bionic-vulkan-wrapper-universal
          path: wrapper.tzst
