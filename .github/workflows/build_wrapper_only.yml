name: Compilar Wrapper Completo Original NDK25
on:
  workflow_dispatch:

jobs:
  build-wrapper:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Descargar Codigo Principal del Wrapper
        uses: actions/checkout@v4

      - name: 2. Descargar SPIRV-Tools Custom Legítimo de leegao
        uses: actions/checkout@v4
        with:
          repository: 'leegao/SPIRV-Tools'
          path: 'spirv_source'

      - name: 3. Descargar SPIRV-Headers Estables de Khronos
        uses: actions/checkout@v4
        with:
          repository: 'KhronosGroup/SPIRV-Headers'
          ref: 'main'
          path: 'spirv_source/external/spirv-headers'

      - name: 4. Instalar Herramientas de Compilacion de Ubuntu (Con Meson)
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build zstd tar glslang-tools pkg-config llvm clang libclang-dev cmake python3-pip wget unzip

      - name: 5. Instalar NDK r25c Legítimo de Google
        uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r25c
          add-to-path: true

      - name: 6. Instalar Dependencias Python de Mesa
        run: python3 -m pip install --break-system-packages mako packaging setuptools

      - name: 7. Ejecutar Compilacion Directa de Clang por Script
        run: |
          export MY_NDK_PATH="${{ steps.setup-ndk.outputs.ndk-path }}"
          sed -i 's/\r$//' crear_cabeceras.sh || true
          sed -i 's/\r$//' crear_stubs.sh || true
          sed -i 's/\r$//' build_mesa.sh || true
          chmod +x crear_cabeceras.sh && ./crear_cabeceras.sh || true
          chmod +x crear_stubs.sh && ./crear_stubs.sh || true
          chmod +x build_mesa.sh
          ./build_mesa.sh

      - name: 8. Subir wrapper.tzst como Artefacto Universal para Winlator
        uses: actions/upload-artifact@v4
        with:
          name: bionic-vulkan-wrapper-universal
          path: wrapper.tzst
