name: Compilar Wrapper Completo Original (Pipetto Trick)
on:
  workflow_dispatch:

jobs:
  build-fat-wrapper:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Descargar Codigo Principal
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: 2. Configurar Entorno Java para Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 3. Instalar Android SDK y NDK Oficial
        uses: android-actions/setup-android@v3

      - name: 4. Instalar Herramientas de Compilacion
        run: sudo apt-get update && sudo apt-get install -y meson ninja-build zstd tar glslang-tools pkg-config

      - name: 5. Instalar Dependencias Python de Mesa
        run: python3 -m pip install --break-system-packages mako packaging setuptools

      - name: 6. Crear Script de Compilacion Plano (Evita error de YAML)
        run: |
          # Escribimos los comandos en archivos separados usando codificación base64 para que el YAML no se rompa con comillas
          echo "" > setup_build.sh
          echo "" >> setup_build.sh
          echo "" >> setup_build.sh
          
          # Decodificamos el script plano de ejecucion limpia
          cat setup_build.sh | base64 -d > run_etapa1.sh
          bash run_etapa1.sh

      - name: 7. ETAPA 2: COMPILACION DE 64 BITS CON INYECCION DE SIMBOLOS (Truco Pipetto)
        run: |
          # Hacemos lo mismo para la etapa de 64 bits con inyección Fat Binary
          echo "" > setup_build64.sh
          echo "" >> setup_build64.sh
          echo "" >> setup_build64.sh
          
          cat setup_build64.sh | base64 -d > run_etapa2.sh
          bash run_etapa2.sh

      - name: 8. Empaquetar el UNICO libvulkan_wrapper.so Universal en wrapper.tzst
        run: |
          mkdir -p wrapper_output
          cp build64/src/vulkan/wrapper/libvulkan_wrapper.so wrapper_output/libvulkan_wrapper.so
          ls -la wrapper_output/
          tar -I 'zstd -19' -cf wrapper.tzst -C wrapper_output libvulkan_wrapper.so

      - name: 9. Subir wrapper.tzst como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: bionic-vulkan-wrapper-universal
          path: wrapper.tzst
