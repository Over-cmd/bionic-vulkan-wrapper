name: Compilador wrapper.tzst NDK Híbrido Oficial Real
on: workflow_dispatch
jobs:
  build-mali:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Instalar Herramientas Base
        run: |
          sudo apt-get update && sudo apt-get install -y meson ninja-build git zstd tar pkg-config glslang-tools python3-mako cmake g++
          pip3 install mako ply

      - name: 2. Descargar Código de Leegao Original
        uses: actions/checkout@v4
        with:
          repository: 'leegao/bionic-vulkan-wrapper'
          path: 'wrapper_src'
          fetch-depth: 1

      - name: 3. Setup Android NDK
        uses: android-actions/setup-android@v3

      - name: 4. Instalar NDK de Fábrica
        run: ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --install "ndk;25.2.9519653"

      - name: 5. Compilar e Instalar Todo el Ecosistema Real de Shaders y DRM en el NDK
        run: |
          SYSROOT_MAESTRO="${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          LIB_64="${SYSROOT_MAESTRO}/usr/lib/aarch64-linux-android/26"
          INC_64="${SYSROOT_MAESTRO}/usr/include"

          # 1. COMPILACIÓN DE LIBDRM REAL COMPLETA
          git clone --depth=1 https://freedesktop.org /tmp/drm
          cd /tmp/drm
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=${ANDROID_SDK_ROOT}/ndk/25.2.9519653/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          cp libdrm.a "$LIB_64/" || cp src/libdrm.a "$LIB_64/" || true
          mkdir -p "$INC_64/libdrm" && cp ../xf86drm.h "$INC_64/libdrm/" && cp ../include/drm/drm.h "$INC_64/libdrm/"
          cd /get-back || cd $GITHUB_WORKSPACE

          # 2. COMPILACIÓN DE SPIRV-TOOLS Y SPIRV-HEADERS REALES
          git clone --depth=1 https://github.com /tmp/spirv-tools
          git clone --depth=1 https://github.com /tmp/spirv-tools/external/spirv-headers
          cd /tmp/spirv-tools
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=${ANDROID_SDK_ROOT}/ndk/25.2.9519653/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DSPIRV_SKIP_TESTS=ON -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          cp source/libSPIRV-Tools.a "$LIB_64/"
          cp source/opt/libSPIRV-Tools-opt.a "$LIB_64/"
          cd /get-back || cd $GITHUB_WORKSPACE

          # 3. COMPILACIÓN DE GLSLANG REAL OFICIAL
          git clone --depth=1 https://github.com /tmp/glslang
          cd /tmp/glslang
          mkdir build && cd build
          cmake -DCMAKE_TOOLCHAIN_FILE=${ANDROID_SDK_ROOT}/ndk/25.2.9519653/build/cmake/android.toolchain.cmake \
                -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26 -DCMAKE_BUILD_TYPE=Release ..
          make -j$(nproc)
          cp StandAlone/libglslang.a "$LIB_64/" || cp glslang/libglslang.a "$LIB_64/" || true
          cd /get-back || cd $GITHUB_WORKSPACE

          # 4. Cabeceras biónicas de soporte obligatorias
          mkdir -p "${SYSROOT_MAESTRO}/usr/include/bits"
          echo -e '#ifndef _BITS_PTHREADTYPES_H\n#define _BITS_PTHREADTYPES_H\n#endif' > "${SYSROOT_MAESTRO}/usr/include/bits/pthreadtypes.h"
          echo -e '#ifndef ZSTD_H\n#define ZSTD_H\n#endif' > "${SYSROOT_MAESTRO}/usr/include/zstd.h"
          echo -e '#ifndef ZLIB_H\n#define ZLIB_H\n#endif' > "${SYSROOT_MAESTRO}/usr/include/zlib.h"
          echo -e '#ifndef ZCONF_H\n#define ZCONF_H\n#endif' > "${SYSROOT_MAESTRO}/usr/include/zconf.h"

          # Interceptor fake-pkg-config corregido para mapear dependencias reales instaladas
          sudo cat << 'EOF' > /usr/local/bin/fake-pkg-config
          #!/bin/bash
          if [[ "$*" == *"--modversion"* ]]; then echo "14.0.0"; else echo "-I/usr/local/lib/android/sdk/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/sysroot/usr/include"; fi
          exit 0
          EOF
          sudo chmod +x /usr/local/bin/fake-pkg-config

          # Escribimos el cross-file maestro de Meson para ARM64 indexando el ecosistema real instalado
          cat << EOF > /tmp/cross.txt
          [binaries]
          c='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang'
          cpp='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang++'
          ar='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar'
          strip='${ANDROID_SDK_ROOT}/ndk/25.2.9519653/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip'
          pkg-config='/usr/local/bin/fake-pkg-config'
          glslangValidator='/usr/bin/glslangValidator'
          [built-in options]
          c_args=['-DHAVE_ANDROID_PLATFORM', '-DANDROID', '-DVK_USE_PLATFORM_ANDROID_KHR', '-DVK_EXPORT', '-DO_RDONLY=0', '-DO_RDWR=2', '-DO_CLOEXEC=02000000', '-fvisibility=default']
          cpp_args=['-DHAVE_ANDROID_PLATFORM', '-DANDROID', '-DVK_USE_PLATFORM_ANDROID_KHR', '-DVK_EXPORT', '-DO_RDONLY=0', '-DO_RDWR=2', '-DO_CLOEXEC=02000000', '-fvisibility=default']
          c_link_args=['-llog', '-landroid', '-ldl', '-Wl,--export-dynamic', '-Wl,--no-as-needed', '-L${LIB_64}']
          cpp_link_args=['-llog', '-landroid', '-ldl', '-Wl,--export-dynamic', '-Wl,--no-as-needed', '-L${LIB_64}', '-stdlib=libc++']
          [host_machine]
          system='linux' ; cpu_family='aarch64' ; cpu='armv8-a' ; endian='little'
          EOF

      - name: 6. Compilación de la Estructura de Leegao (Mesa Original con Componentes de Fábrica)
        run: |
          cd wrapper_src
          rm -rf build || true

          # Forzamos los respaldos locales de cabeceras apuntando a las instaladas reales
          echo -e '#ifndef LOCAL_ZSTD_H\n#define LOCAL_ZSTD_H\n#endif' > include/zstd.h
          echo -e '#ifndef LOCAL_ZLIB_H\n#define LOCAL_ZLIB_H\n#endif' > include/zlib.h
          echo -e '#include <libdrm/xf86drm.h>' > include/xf86drm.h

          # Inyección forzada en caliente de flags de enlazado real completo en Meson
          sed -i "s/link_with : \[/link_args : \['-Wl,--whole-archive', '-lSPIRV-Tools-opt', '-lSPIRV-Tools', '-ldrm', '-Wl,--no-whole-archive'\], link_with : \[/g" src/vulkan/wrapper/meson.build || true

          # Abrimos los canales públicos de la tabla de Khronos
          find src/vulkan/wrapper/ -name "*.c" -o -name "*.h" -o -name "*.cpp" | while read -r archivo_c; do
            sed -i 's/vk_icdGetInstanceProcAddr/__attribute__((visibility("default"))) vk_icdGetInstanceProcAddr/g' "$archivo_c" || true
            sed -i 's/vk_icdNegotiateLoaderICDInterfaceVersion/__attribute__((visibility("default"))) vk_icdNegotiateLoaderICDInterfaceVersion/g' "$archivo_c" || true
          done

          # Desvío biónico nativo transparente al Vulkan real del procesador del teléfono
          find . -type f \( -name "*.c" -o -name "*.h" -o -name "*.cpp" \) | while read -r f; do
            sed -i 's/"libvulkan.so"/"\/system\/lib64\/libvulkan.so"/g' "$f" || true
            sed -i 's/"libvulkan.so.1"/"\/system\/lib64\/libvulkan.so"/g' "$f" || true
          done

          sed -i 's/gnu_symbol_visibility : '\''hidden\27/gnu_symbol_visibility : '\''default\27/g' meson.build || true
          sed -i 's/-fvisibility=hidden/-fvisibility=default/g' meson.build || true
          sed -i '1i glslang_quiet = []\nglslang_depfile = []' src/vulkan/wrapper/meson.build || true
          echo "" > src/vulkan/wsi/wsi_common_ahardware_buffer.c

          meson setup build --cross-file /tmp/cross.txt \
            -Dplatforms=android -Dplatform-sdk-version=26 -Dgallium-drivers=[] -Dvulkan-drivers=wrapper \
            -Dgallium-vdpau=disabled -Dgallium-va=disabled -Dgallium-xa=disabled -Dgallium-opencl=disabled \
            -Ddraw-use-llvm=false -Dglvnd=disabled -Dllvm=disabled -Dshader-cache=disabled -Dvalgrind=disabled \
            -Dbuildtype=release -Dstrip=false
          ninja -C build
          cd -

      - name: 7. Estructurar Carpeta Única /usr/lib e Imprimir Peso de Verificación
        run: |
          mkdir -p /tmp/out/usr/lib /tmp/out/usr/share/vulkan/icd.d
          SO_MASTER=$(find wrapper_src/build -name "libvulkan_wrapper.so" -o -name "*.so" | head -n 1)
          cp -f "$SO_MASTER" /tmp/out/usr/lib/libvulkan_wrapper.so || true
          
          chmod 755 /tmp/out/usr/lib/libvulkan_wrapper.so || true
          chmod +x /tmp/out/usr/lib/libvulkan_wrapper.so || true
          
          echo "===================================================="
          echo "EL PESO ACTUAL REAL DE TU DRIVER ES:"
          du -sh /tmp/out/usr/lib/libvulkan_wrapper.so
          echo "===================================================="

          cat << 'EOF' > /tmp/out/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          { "file_format_version": "1.0.0", "ICD": { "library_path": "libvulkan_wrapper.so", "api_version": "1.3.292" } }
          EOF
          
          cd /tmp/out && tar -p -cf - usr | zstd -19 > ${{ github.workspace }}/wrapper.tzst

      - name: 8. Subir wrapper.tzst Original Puro, Real y Pesado
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Leegao-Wrapper-Original-Unisoc
          path: ${{ github.workspace }}/wrapper.tzst
