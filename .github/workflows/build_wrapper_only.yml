name: Compilar Wrapper Completo Original (Direct Clang)
on:
  workflow_dispatch:

jobs:
  build-fat-wrapper:
    runs-on: ubuntu-24.04
    steps:
      - name: 1. Descargar Codigo Principal del Wrapper
        uses: actions/checkout@v4

      - name: 2. Descargar SPIRV-Tools Custom Legítimo de leegao
        uses: actions/checkout@v4
        with:
          repository: 'leegao/SPIRV-Tools'
          path: 'spirv_source'

      - name: 3. Descargar SPIRV-Headers Estables de Khronos
        uses: actions/checkout@v4
        with:
          repository: 'KhronosGroup/SPIRV-Headers'
          ref: 'main'
          path: 'spirv_source/external/spirv-headers'

      - name: 4. Configurar Entorno Java para Android
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 5. Instalar Android SDK y NDK Oficial
        uses: android-actions/setup-android@v3

      - name: 6. Instalar Herramientas de Compilacion de Ubuntu
        run: sudo apt-get update && sudo apt-get install -y zstd tar glslang-tools cmake ninja-build

      - name: 7. Ejecutar Compilacion y Empaquetado Monolítico por Clang
        run: |
          chmod +x build_mesa.sh
          ./build_mesa.sh

      - name: 8. Subir wrapper.tzst como Artefacto Universal para Winlator
        uses: actions/upload-artifact@v4
        with:
          name: bionic-vulkan-wrapper-universal
          path: wrapper.tzst
