name: Compilar Wrapper Oficial Termux-Packages
on:
  workflow_dispatch:

jobs:
  build-termux-wrapper:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout del código
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Instalar Dependencias del Entorno (Limpio)
        run: |
          sudo apt-get update
          # Instalamos las herramientas de empaquetado mínimas requeridas en el host
          sudo apt-get install -y bash curl git python3 zstd tar jq coreutils findutils pip

      - name: Configurar e Iniciar Compilación Oficial mediante Docker (Método leegao)
        run: |
          # 1. Otorgamos permisos de ejecución de forma dinámica a todos los scripts .sh reales en la raíz
          find . -maxdepth 1 -name "*.sh" -exec chmod +x {} \;
          if [ -d "scripts" ]; then find scripts/ -name "*.sh" -exec chmod +x {} \; 2>/dev/null || true; fi
          
          # 2. Ejecutamos la compilación oficial de leegao invocando su script central wrapper.sh
          # Usamos la bandera nativa de termux para empaquetar por separado las arquitecturas de 64 y 32 bits
          ./scripts/run-docker.sh ./wrapper.sh -a aarch64
          ./scripts/run-docker.sh ./wrapper.sh -a arm

      - name: Aplicar el Truco de Pipetto para Steven MXZ (Estructura Multilib)
        run: |
          # Creamos la estructura de carpetas que Steven MXZ y Ludashi leen en Winlator
          mkdir -p wrapper_output/lib64
          mkdir -p wrapper_output/lib

          # Buscamos de forma recursiva los archivos libvulkan_wrapper.so que el contenedor depositó en el árbol de directorios
          find output/debs/ -name "libvulkan_wrapper.so" -path "*/aarch64/*" -exec cp {} wrapper_output/lib64/ \; 2>/dev/null || \
          find debs/ -name "*aarch64*libvulkan_wrapper.so" -exec cp {} wrapper_output/lib64/ \; 2>/dev/null || \
          find . -name "libvulkan_wrapper.so" -path "*/aarch64/*" -exec cp {} wrapper_output/lib64/ \; 2>/dev/null || \
          find . -name "libvulkan_wrapper.so" -path "*64*" -exec cp {} wrapper_output/lib64/ \; 2>/dev/null

          find output/debs/ -name "libvulkan_wrapper.so" -path "*/arm/*" -exec cp {} wrapper_output/lib/ \; 2>/dev/null || \
          find debs/ -name "*arm*libvulkan_wrapper.so" -exec cp {} wrapper_output/lib/ \; 2>/dev/null || \
          find . -name "libvulkan_wrapper.so" -path "*/arm/*" -exec cp {} wrapper_output/lib/ \; 2>/dev/null || \
          find . -name "libvulkan_wrapper.so" -path "*32*" -exec cp {} wrapper_output/lib/ \; 2>/dev/null

          # Si se generaron carpetas temporales adicionales de runtime durante el build, las extraemos
          if [ -d "tmp_runtime" ]; then
            find tmp_runtime/ -name "libvulkan_wrapper.so" -path "*/lib64/*" -exec cp {} wrapper_output/lib64/ \; 2>/dev/null
            find tmp_runtime/ -name "libvulkan_wrapper.so" -path "*/lib/*" -exec cp {} wrapper_output/lib/ \; 2>/dev/null
          fi

          # Empaquetamos todo con máxima compresión Zstandard compatible con Winlator
          tar -I 'zstd -19' -cf wrapper.tzst -C wrapper_output .

      - name: Subir wrapper.tzst como Artefacto
        uses: actions/upload-artifact@v4
        with:
          name: bionic-vulkan-wrapper-termux
          path: wrapper.tzst
