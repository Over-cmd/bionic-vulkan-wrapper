name: Compilador Oficial de wrapper.tzst Leegao Pure Mali
on:
  workflow_dispatch:

jobs:
  build-mali-wrapper-pure:
    runs-on: ubuntu-latest
    steps:
      - name: 1. Instalar Herramientas de Compilación Cruzada y Meson Base
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build python3-pip python3-setuptools \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu git zstd tar pixz bison flex curl python3-mako unzip pkg-config glslang-tools
          pip3 install mako ply

      - name: 2. Descargar Código de Leegao (Bypass de Red Seguro con Checkout)
        uses: actions/checkout@v4
        with:
          repository: 'leegao/bionic-vulkan-wrapper'
          path: 'wrapper_src'
          fetch-depth: 1

      - name: 3. Configurar el Archivo de Compilación Cruzada Linux para Android ARM64
        run: |
          cat << 'EOF' > /tmp/cross_android_64.txt
          [binaries]
          c = 'aarch64-linux-gnu-gcc'
          cpp = 'aarch64-linux-gnu-g++'
          ar = 'aarch64-linux-gnu-ar'
          strip = 'aarch64-linux-gnu-strip'
          pkgconfig = 'pkg-config'
          glslangValidator = '/usr/bin/glslangValidator'
          [host_machine]
          system = 'linux'
          cpu_family = 'aarch64'
          cpu = 'armv8-a'
          endian = 'little'
          EOF

      - name: 4. Crear Puentes Simulados (Mock) y Cabeceras Ficticias de Android/DRM en Linux
        run: |
          mkdir -p /tmp/mock_ndk/include/cutils
          mkdir -p /tmp/mock_ndk/include/hardware
          mkdir -p /tmp/mock_ndk/include/android
          mkdir -p /tmp/mock_ndk/include/backtrace
          mkdir -p /tmp/mock_ndk/include/log
          
          # Escribimos los archivos de cabecera .h vacíos obligatorios para que gcc no aborte
          echo -e '#ifndef _CUTILS_H\n#define _CUTILS_H\n#endif' > /tmp/mock_ndk/include/cutils/properties.h
          echo -e '#ifndef _HARDWARE_H\n#define _HARDWARE_H\n#endif' > /tmp/mock_ndk/include/hardware/hardware.h
          echo -e '#ifndef _ANDROID_LOG_H\n#define _ANDROID_LOG_H\n#endif' > /tmp/mock_ndk/include/android/log.h
          echo -e '#ifndef _BACKTRACE_H\n#define _BACKTRACE_H\n#endif' > /tmp/mock_ndk/include/backtrace/Backtrace.h
          
          # PARCHE MAESTRO LOGS TOTAL (Línea 157): Inyectamos las prioridades de log y la macro LOG_PRI que exige egllog.c
          cat << 'EOF' > /tmp/mock_ndk/include/log/log.h
          #ifndef _ANDROID_LOG_LOG_H
          #define _ANDROID_LOG_LOG_H
          
          #define ANDROID_LOG_UNKNOWN 0
          #define ANDROID_LOG_DEFAULT 1
          #define ANDROID_LOG_VERBOSE 2
          #define ANDROID_LOG_DEBUG   3
          #define ANDROID_LOG_INFO    4
          #define ANDROID_LOG_WARN    5
          #define ANDROID_LOG_ERROR   6
          #define ANDROID_LOG_FATAL   7
          #define ANDROID_LOG_SILENT  8
          
          #ifndef LOG_TAG
          #define LOG_TAG "EGL-Mock"
          #endif
          
          #define LOG_PRI(priority, tag, ...) do {} while(0)
          
          #endif
          EOF
          
          # Parche estructural DRM completo para Zink
          cat << 'EOF' > /tmp/mock_ndk/include/xf86drm.h
          #ifndef _XF86DRM_H
          #define _XF86DRM_H
          #include <stdint.h>
          
          struct drm_gem_close { uint32_t handle; uint32_t pad; };
          #define DRM_IOCTL_GEM_CLOSE 0
          static inline int drmIoctl(int fd, unsigned long request, void *arg) { return 0; }
          static inline int drmPrimeFDToHandle(int fd, int prime_fd, uint32_t *handle) { return 0; }
          
          #define DRM_PRIME_CAP_IMPORT 0x1
          #define DRM_PRIME_CAP_EXPORT 0x2
          #define DRM_NODE_RENDER 0
          #define DRM_NODE_PRIMARY 1
          
          #ifndef _IOWR
          #define _IOWR(type,nr,size) 0
          #endif
          #ifndef _IOW
          #define _IOW(type,nr,size) 0
          #endif
          
          typedef struct _drmDevice {
              uint32_t available_nodes;
              char **nodes;
          } drmDevice, *drmDevicePtr;
          
          static inline int drmGetDevice2(int fd, uint32_t flags, drmDevicePtr *device) { return -1; }
          static inline void drmFreeDevice(drmDevicePtr *device) {}
          static inline int drmDevicesEqual(drmDevicePtr a, drmDevicePtr b) { return 0; }
          static inline int drmGetDevices2(uint32_t flags, drmDevicePtr devices[], int max_devices) { return 0; }
          
          #endif
          EOF
          
          echo -e '#ifndef _DRM_H\n#define _DRM_H\n#endif' > /tmp/mock_ndk/include/drm.h
          
          mkdir -p /tmp/pkgconfig
          for pc in hardware log libglvnd libclc sync backtrace nativewindow; do
            echo -e "Name: $pc\nDescription: Mock\nVersion: 1.0\nCflags: -I/tmp/mock_ndk/include\nLibs:" > /tmp/pkgconfig/$pc.pc
          done
          
          echo -e "Name: cutils\nDescription: Mock\nVersion: 1.0\nCflags: -I/tmp/mock_ndk/include\nLibs:" > /tmp/pkgconfig/cutils.pc
          
          cat << 'EOF' > /tmp/pkgconfig/libdrm.pc
          Name: libdrm
          Description: Direct Rendering Manager mock bridge for Android compilation
          Version: 2.4.110
          Cflags: -I/tmp/mock_ndk/include
          Libs:
          EOF
          
          cat << 'EOF' > /tmp/pkgconfig/dl.pc
          Name: dl
          Description: Android dynamic linker mock bridge
          Version: 1.0
          Cflags:
          Libs: -ldl
          EOF

          echo -e "Name: zlib\nDescription: Mock Zlib\nVersion: 1.3\nCflags:\nLibs: -lz" > /tmp/pkgconfig/zlib.pc
          echo -e "Name: libzstd\nDescription: Mock Zstd\nVersion: 1.5.5\nCflags:\nLibs:" > /tmp/pkgconfig/libzstd.pc

      - name: 5. Compilar el Wrapper con Cargador Bionic usando Meson y Ninja
        env:
          PKG_CONFIG_PATH: "/tmp/pkgconfig"
        run: |
          cd wrapper_src
          rm -rf build_universal
          
          # Parches de conversión de banderas de error de Clang a GCC
          find . -name "meson.build" -exec sed -i 's/-ferror-limit=1000/-fmax-errors=1000/g' {} \; || true
          find . -name "*.build" -exec sed -i 's/-ferror-limit=1000/-fmax-errors=1000/g' {} \; || true
          
          # Parche crítico memfd_create
          find . -name "anon_file.c" -exec sed -i 's/syscall(SYS_memfd_create, debug_name, MFD_CLOEXEC | MFD_ALLOW_SEALING)/memfd_create(debug_name, MFD_CLOEXEC | MFD_ALLOW_SEALING)/g' {} \; || true
          
          # Parche crítico hilos monotónicos
          find . -name "cnd_monotonic.c" -exec sed -i 's/pthread_cond_timedwait(&cond->cond, mtx, abs_time)/pthread_cond_timedwait(\&cond->cond, (pthread_mutex_t *)mtx, abs_time)/g' {} \; || true
          find . -name "cnd_monotonic.c" -exec sed -i 's/pthread_cond_wait(&cond->cond, mtx)/pthread_cond_wait(\&cond->cond, (pthread_mutex_t *)mtx)/g' {} \; || true

          # Parche crítico getrandom
          find . -name "rand_xor.c" -exec sed -i 's/syscall(SYS_getrandom, seed, seed_size, GRND_NONBLOCK)/getrandom(seed, seed_size, GRND_NONBLOCK)/g' {} \; || true

          # Parche maestro de firmas C/C++ de depuración
          echo -e '#include <stdint.h>\n#include <stdio.h>\n#include "util/u_debug_stack.h"\nextern "C" {\nvoid debug_backtrace_capture(struct debug_stack_frame *frames, unsigned start, unsigned count) {}\nvoid debug_backtrace_dump(const struct debug_stack_frame *frames, unsigned count) {}\nvoid debug_backtrace_print(FILE *f, const struct debug_stack_frame *frames, unsigned count) {}\n}' > src/util/u_debug_stack_android.cpp
          sed -i '1s/^/#include <stdint.h>\n/' src/util/u_debug_stack.h

          meson setup build_universal --cross-file /tmp/cross_android_64.txt \
            -Dplatforms=android \
            -Dplatform-sdk-version=26 \
            -Dgallium-drivers=zink \
            -Dgallium-vdpau=disabled \
            -Dgallium-va=disabled \
            -Dgallium-xa=disabled \
            -Dgallium-opencl=disabled \
            -Ddraw-use-llvm=false \
            -Dllvm=disabled \
            -Dvulkan-drivers=[] \
            -Dbuildtype=release \
            -Dstrip=true
            
          ninja -C build_universal
          cd -

      - name: 6. Estructurar Contenedor Unificado en Carpeta lib e Inyectar wrapper_icd.aarch64.json
        run: |
          mkdir -p /tmp/mali_wrapper/lib
          mkdir -p /tmp/mali_wrapper/etc/vulkan/icd.d

          SO_MASTER=$(find wrapper_src/build_universal -name "libvulkan_wrapper.so" -o -name "*.so" | head -n 1)
          if [ ! -z "$SO_MASTER" ] && [ -f "$SO_MASTER" ]; then
            echo "Inyectando binario unificado con cargador Bionic en lib/..."
            cp -f "$SO_MASTER" /tmp/mali_wrapper/lib/libvulkan_wrapper.so
          else
            cp -f wrapper_src/build_universal/src/vulkan/wrapper/libvulkan_wrapper.so /tmp/mali_wrapper/lib/libvulkan_wrapper.so || true
          fi

          cat << 'EOF' > /tmp/mali_wrapper/etc/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.1.149",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF

      - name: 7. Empaquetar Entorno Unificado en Formato wrapper.tzst Máximo Rendimiento
        run: |
          cd /tmp/mali_wrapper
          tar -cf - . | zstd -19 > /tmp/wrapper.tzst
          cd -

      - name: 8. Subir wrapper.tzst Unificado Terminado a tus Artifacts de GitHub
        uses: actions/upload-artifact@v4
        with:
          name: Mesa-Leegao-Wrapper-Unificado-Unisoc
          path: /tmp/wrapper.tzst
