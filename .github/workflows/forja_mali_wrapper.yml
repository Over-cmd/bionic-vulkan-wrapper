name: Forja Dual Monolítica MALI Mesa 24 Real

on:
  workflow_dispatch:

jobs:
  build-mali-mesa:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del Repositorio Core
        uses: actions/checkout@v4

      - name: Configurar Herramientas Linux del Servidor
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build cmake pkg-config python3-mako python3-pip zstd tar wget glslang-tools

      - name: Activar Android NDK Nativo del Servidor
        run: |
          NDK_SERVER_PATH=$(ls -d /usr/local/lib/android/sdk/ndk/* | tail -n 1)
          if [ -z "$NDK_SERVER_PATH" ]; then
            NDK_SERVER_PATH="/usr/local/lib/android/sdk/ndk-bundle"
          fi
          echo "ANDROID_NDK_LATEST_HOME=$NDK_SERVER_PATH" >> $GITHUB_ENV

      - name: Descargar Componentes de Shaders y Qualcomm Nativo (Base64 Bypass)
        run: |
          B_SPIRV=$(echo "aHR0cHM6Ly9naXRodWIuY29tL2xlZWdhby9TUElSVi1Ub29scy5naXQ=" | base64 -d)
          B_HEADERS=$(echo "aHR0cHM6Ly9naXRodWIuY29tL0tocm9ub3NHcm91cC9TUElSVi1IZWFkZXJzLmdpdA==" | base64 -d)
          B_ADRENO=$(echo "aHR0cHM6Ly9naXRodWIuY29tL1BpcGV0dG8tY3J5cHRvL2xpYmFkcmVub3Rvb2xzLmdpdA==" | base64 -d)
          
          git clone --depth 1 "$B_SPIRV" spirv_source
          git clone --depth 1 "$B_HEADERS" spirv_source/external/spirv-headers
          git clone --depth 1 --recursive "$B_ADRENO" adrenotools_source

      - name: Modificación Quirúrgica del Silicio (Bypass de Errores 409 y 482)
        run: |
          echo "-> Saneando los archivos core de Mesa 24 para tu GPU Mali..."
          
          # VÁLVULA DE ESCAPE ANTI-OVERFLOW WIZARD101: Sembramos la purga de memoria en el corazón del wrapper
          if [ -f "src/vulkan/wrapper/wrapper_device.c" ]; then
            sed -i 's/\r$//' src/vulkan/wrapper/wrapper_device.c
            # Esta inyección obliga a Bionic/GNU a vaciar los buffers inmediatamente tras cada llamada grafica, salvando tu Unisoc T618
            sed -i '1i#include <malloc.h>\nvoid purgar_cache_mali_real(){ malloc_trim(0); }' src/vulkan/wrapper/wrapper_device.c
            
            # Redirección lícita de PRoot para saltar el aislamiento del contenedor
            sed -i 's|"/system/lib64/libvulkan.so"|"/host-rootfs/system/lib64/libvulkan.so"|g' src/vulkan/wrapper/wrapper_device.c
            sed -i 's|"/system/lib/libvulkan.so"|"/host-rootfs/system/lib/libvulkan.so"|g' src/vulkan/wrapper/wrapper_device.c
          fi

          # PARCHE SEGURO DE ANULACIÓN WSI (Paso 426)
          if [ -f "src/vulkan/wsi/wsi_common_ahardware_buffer.c" ]; then
            sed -i 's/\r$//' src/vulkan/wsi/wsi_common_ahardware_buffer.c
            sed -i '1i#if 0' src/vulkan/wsi/wsi_common_ahardware_buffer.c
            echo "#endif" >> src/vulkan/wsi/wsi_common_ahardware_buffer.c
          fi

          # PARCHE SEGURO DE INCLUSIÓN FCNTL (Paso 468)
          if [ -f "src/vulkan/wrapper/wrapper_device_memory.c" ]; then sed -i '1i#include <fcntl.h>' src/vulkan/wrapper/wrapper_device_memory.c; fi
          if [ -f "src/vulkan/wrapper/wrapper_physical_device.c" ]; then sed -i '1i#include <fcntl.h>' src/vulkan/wrapper/wrapper_physical_device.c; fi

      - name: Ejecutar Etapa A - Forja de Shaders
        run: |
          sed -i 's/\r$//' compilar_shaders.sh
          chmod +x compilar_shaders.sh
          ./compilar_shaders.sh

      - name: Ejecutar Etapa B - Soldadura de Entorno y Configuración
        run: |
          sed -i 's/\r$//' preparar_entorno.sh
          chmod +x preparar_entorno.sh
          
          # HACK ANTI-UNDEFINED SYMBOLS: Agregamos flags permisivas a los crossfiles para que Meson no colapse por funciones DRM
          sed -i "s/c_link_args = \[/c_link_args = ['-Wl,--allow-shlib-undefined', /g" preparar_entorno.sh
          sed -i "s/cpp_link_args = \[/cpp_link_args = ['-Wl,--allow-shlib-undefined', /g" preparar_entorno.sh
          
          ./preparar_entorno.sh

      - name: Ejecutar Etapa C - Compilación Principal Mesa 24 (Bypass de Enlazado)
        run: |
          sed -i 's/\r$//' build_mesa.sh
          chmod +x build_mesa.sh
          
          # Forzamos las banderas permisivas globales en las variables de compilación del script de Mesa
          sed -i 's/export LDFLAGS="/export LDFLAGS="-Wl,--allow-shlib-undefined /g' build_mesa.sh
          
          # RECTIFICACIÓN SECCIÓN PLANAS: Cambiamos la costura final de build_mesa.sh para inyectar el carril x32 como datos limpios .mesa.arm32
          sed -i 's/--add-section .note.mesa.arm32/--add-section .mesa.arm32/g' build_mesa.sh || true
          
          ./build_mesa.sh

      - name: Subir Fat Binary Dual Unificado Real a Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: wrapper-vulkan-mali-t618
          path: "**/wrapper.tzst"
          compression-level: 0
