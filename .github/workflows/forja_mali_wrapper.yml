name: Mesa Bionic Vulkan Wrapper Mali Packager (.tzst)

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  BUILD_DIR: compilacion
  IMAGE_TAG: ghcr.io/leegao/mesa-wrapper-ci/wrapper-compiler:latest

jobs:
  build-aarch64-wrapper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Instalar herramientas de compresión Zstd en el servidor de GitHub
      - name: Install Zstd Packager
        run: |
          sudo apt-get update
          sudo apt-get install -y zstd python3

      # ¡ESTE PASO ANIQUILA TANTO SPIRV-TOOLS COMO EXPAT DE FORMA SEGURO POR PYTHON!
      - name: Bypass SPIRV-Tools and Expat Requirements (Python Surgical Patch)
        run: |
          echo "-> Ejecutando inyector de dependencias por script Python..."
          
          # PARCHE 1: Neutralizamos SPIRV-Tools en el subproyecto del wrapper
          python3 -c "
          import os
          target = 'src/vulkan/wrapper/meson.build'
          if os.path.exists(target):
              with open(target, 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
              content = content.replace('\r\n', '\n')
              content = content.replace(\"find_library('SPIRV-Tools-opt')\", \"find_library('m')\")
              content = content.replace(\"find_library('SPIRV-Tools-opt',\", \"find_library('m',\")
              content = content.replace(\"find_library('SPIRV-Tools')\", \"find_library('m')\")
              content = content.replace(\"find_library('SPIRV-Tools',\", \"find_library('m',\")
              with open(target, 'w', encoding='utf-8') as f:
                  f.write(content)
              print('-> ¡SPIRV-Tools desviado con éxito a la librería m!')
          "
          
          # PARCHE 2: Neutralizamos Expat en el meson.build raíz para evitar la descarga de internet
          python3 -c "
          import os
          target = 'meson.build'
          if os.path.exists(target):
              with open(target, 'r', encoding='utf-8', errors='ignore') as f:
                  content = f.read()
              content = content.replace('\r\n', '\n')
              
              # Reemplazamos la busqueda estricta de expat por la de matemáticas 'm' nativa
              content = content.replace(\"dependency('expat'\", \"dependency('m'\")
              content = content.replace(\"dependency('expat',\", \"dependency('m',\")
              
              with open(target, 'w', encoding='utf-8') as f:
                  f.write(content)
              print('-> ¡Expat desviado con éxito a la librería m en la raíz!')
          "

      # TU INYECCIÓN DE MEMORIA BALANCEADA PARA TU HARDWARE UNISOC T618
      - name: Surgical Silicon Modification (Anti-Overflow & Smooth Videos MALI)
        run: |
          echo "-> Rastreando el corazon de bionic-vulkan-wrapper para meter la valvula MALI..."
          WRAPPER_DEVICE=$(find src/ -name "wrapper_device.c" | head -n 1)
          
          if [ -n "$WRAPPER_DEVICE" ] && [ -f "$WRAPPER_DEVICE" ]; then
            echo "-> Soldando valvula mallopt y soporte de 32 bits en: $WRAPPER_DEVICE"
            sed -i 's/\r$//' "$WRAPPER_DEVICE"
            
            # Inyectamos los prototipos estándar de Android en la línea 1
            sed -i '1iextern int mallopt(int param, int value);' "$WRAPPER_DEVICE"
            sed -i '1iextern int setenv(const char *name, const char *value, int overwrite);' "$WRAPPER_DEVICE"
            
            # Forzamos mallopt(-1002, 0) y modo mailbox de forma segura en el despachador de la API
            sed -i '/vk_icdGetInstanceProcAddr/!b;n;i\\ extern int mallopt(int p, int v);\\n extern int setenv(const char *n, const char *v, int o);\\n mallopt(-1002, 0);\\n setenv("MESA_VK_WSI_PRESENT_MODE", "mailbox", 1);\\n setenv("vblank_mode", "0", 1);' "$WRAPPER_DEVICE"
            echo "-> Parche de silicio inyectado correctamente en el bionic wrapper."
          else
            echo "-> Aplicando inyección alternativa global preventiva..."
            find src/ -name "*.c" -exec sed -i 's/vk_icdGetInstanceProcAddr/extern int mallopt(int p, int v); extern int setenv(const char *n, const char *v, int o); mallopt(-1002, 0); setenv("MESA_VK_WSI_PRESENT_MODE", "mailbox", 1); setenv("vblank_mode", "0", 1); vk_icdGetInstanceProcAddr/g' {} + || true
          fi

      # INTERCEPTOR DE COMANDOS PARA NINJA
      - name: Create Ninja Wrapper Hijacker (Bypass Unknown Target)
        run: |
          mkdir -p bin_hijack
          
          cat << 'EOF' > bin_hijack/ninja
          #!/bin/bash
          ARGS=("$@")
          NEW_ARGS=()
          
          for arg in "${ARGS[@]}"; do
            if [ "$arg" == "src/vulkan/wrapper/libvulkan_wrapper.so" ]; then
              NEW_ARGS+=("vulkan_wrapper")
            else
              NEW_ARGS+=("$arg")
            fi
          done
          
          exec /usr/local/bin/ninja "${NEW_ARGS[@]}"
          EOF
          
          chmod +x bin_hijack/ninja
          echo "-> Interceptor Ninja creado con éxito."

      # TU COMANDO DE DOCKER ORIGINAL NATIVO INTACTO
      - name: compilador-envoltorio
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/workspace" \
            -v "${{ github.workspace }}/bin_hijack/ninja:/usr/local/bin/ninja" \
            ${{ env.IMAGE_TAG }} ${{ env.BUILD_DIR }}

      # ESTE PASO CREA LA ESTRUCTURA EXACTA PARA BANNERLATOR Y GENERA EL ARCHIVO .TZST
      - name: Structure and Pack wrapper.tzst
        run: |
          echo "-> Creando arbol de directorios de Linux para Bannerlator..."
          mkdir -p pkg/usr/lib
          mkdir -p pkg/usr/share/vulkan/icd.d
          
          echo "-> Localizando el bionic driver compilado..."
          SO_FILE=$(find ${{ env.BUILD_DIR }}/ -name "*wrapper*.so" -o -name "*.so" | head -n 1)
          
          if [ -n "$SO_FILE" ] && [ -f "$SO_FILE" ]; then
            echo "-> Moviendo binario detectado: $SO_FILE"
            cp "$SO_FILE" pkg/usr/lib/libvulkan_wrapper.so
          else
            echo "-> Fallback a ruta estandar..."
            cp ${{ env.BUILD_DIR }}/libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so || cp ${{ env.BUILD_DIR }}/src/vulkan/wrapper/libvulkan_wrapper.so pkg/usr/lib/libvulkan_wrapper.so
          fi
          
          echo "-> Inyectando manifiesto JSON ICD oficial de Vulkan 1.3..."
          cat << 'EOF' > pkg/usr/share/vulkan/icd.d/wrapper_icd.aarch64.json
          {
              "ICD": {
                  "api_version": "1.3.289",
                  "library_path": "libvulkan_wrapper.so"
              },
              "file_format_version": "1.0.0"
          }
          EOF
          
          cd pkg
          tar -I 'zstd -19 -T0' -cf ../wrapper.tzst usr/
          cd ..
          echo "-> ¡Empaquetado completado con éxito!"

      - name: Upload Final wrapper.tzst for Bannerlator
        uses: actions/upload-artifact@v4
        with:
          name: Bannerlator-Bionic-Mali-Wrapper
          path: wrapper.tzst
          if-no-files-found: error
